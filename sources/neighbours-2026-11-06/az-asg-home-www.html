<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong Page - NPM</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #3a3f45;
      --muted: #8b949e;
      --border: #e6e8ee;
      --accent: #2b7a77; /* NPM'in ikonik teal/yeşil tonu */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(800px, 90vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
      padding: 50px;
    }

    /* Logo ve Marka Kısmı */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-right: 1px solid var(--border);
      padding-right: 20px;
    }

    .brand img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .brand h3 {
      letter-spacing: 3px;
      font-weight: 700;
      font-size: 16px;
      margin: 0;
      color: var(--text);
    }

    .brand small {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* Mesaj Kısmı */
    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }

    .content h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .message {
      margin-top: 15px;
      font-size: 26px;
      line-height: 1.3;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .sub-message {
      margin-top: 10px;
      font-size: 15px;
      color: var(--muted);
    }

    /* Mobil Görünüm */
    @media (max-width: 720px) {
      .card {
        grid-template-columns: 1fr;
        padding: 30px;
        text-align: center;
      }
      .brand {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-right: 0;
        padding-bottom: 30px;
      }
      .content {
        text-align: center;
        padding-top: 20px;
      }
      .message {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <img src="https://camo.githubusercontent.com/1d54842e99c00437d405c6a81a5eb954e57cdf7918b02d72328655ab6a95e7f7/68747470733a2f2f6e67696e7870726f78796d616e616765722e636f6d2f6769746875622e706e67" alt="NPM Logo" />
      <h3>ASG NGINX</h3>
      <small>PROXY MANAGER</small>
    </div>

    <div class="content">
      <h2>404 - Not Found</h2>
      <div class="message">WRONG PAGE<br>BUD GO BACK NOW</div>
      <div class="sub-message">It looks like you've taken a wrong turn. Please check the URL or contact your administrator.</div>
    </div>
  </div>

</html>
