\":\"Описание функций и услуг\",\"description1\":\"Консульская служба, представленная в международных аэропортах Кыргызстана, играет ключевую роль в обеспечении правовой поддержки и защиты граждан своей страны, а также помощи иностранным пассажирам.\",\"description2\":\"Она функционирует как связующее звено между пассажирами и государственными органами, предоставляя оперативную помощь в ситуациях, требующих вмешательства компетентных дипломатических представителей.\",\"consular.title\":\"Основные функции консульской службы\",\"consular.section1.title\":\"Оформление и выдача документов\",\"consular.section1.desc\":\"Консульская служба помогает пассажирам в ситуациях, связанных с документальными проблемами\",\"consular.section1.card1.title\":\"Временные проездные документы:\",\"consular.section1.card1.item1\":\"Для граждан, утративших паспорт за границей или путешествующих без действительного документа, консульская служба может оформить временное удостоверение личности для возвращения домой.\",\"consular.section1.card2.title\":\"Консультации по визовым вопросам:\",\"consular.section1.card2.item1\":\"Помощь иностранцам в получении информации о визовых требованиях для въезда в страну.\",\"consular.section1.card2.item2\":\"Уточнение необходимости получения транзитных виз для пересадки на другой рейс.\",\"consular.section2.title\":\"Оказание правовой и юридической поддержки\",\"consular.section2.desc\":\"Консульские работники предоставляют правовую помощь в сложных ситуациях, таких как:\",\"consular.section2.card1.title\":\"Отказ во въезде:\",\"consular.section2.card1.item1\":\"Пассажирам, которым пограничные службы отказали во въезде, оказывается консультация и помощь в урегулировании ситуации.\",\"consular.section2.card2.title\":\"Задержания и конфликты:\",\"consular.section2.card2.item1\":\"Консульство выступает посредником при задержаниях пассажиров правоохранительными органами, информирует родственников и оказывает правовую поддержку.\",\"consular.section3.title\":\"Помощь в экстренных ситуациях\",\"consular.section3.desc\":\"Консульская служба помогает гражданам в нестандартных ситуациях, требующих срочных решений:\",\"consular.section3.card1.title\":\"Утрата документов\",\"consular.section3.card1.item1\":\"Пассажирам, потерявшим паспорт или подвергшимся краже, оказывают содействие в восстановлении документов и связях с родными или официальными органами.\",\"consular.section3.card2.title\":\"Медицинские и гуманитарные случаи\",\"consular.section3.card2.item1\":\"В случае внезапной болезни, травмы или чрезвычайной ситуации консульство помогает организовать медицинскую помощь и эвакуацию.\",\"consular.section3.card3.title\":\"Кризисные ситуации\",\"consular.section3.card3.item1\":\"При возникновении природных катастроф, терактов или других угроз консульская служба координирует эвакуацию и безопасное возвращение граждан на родину.\",\"consular.info.title\":\"Информационно-консультационные услуги\",\"consular.info.list.title\":\"Консульство предоставляет пассажирам информацию о следующих аспектах\",\"consular.info.item1\":\"Правила въезда и выезда из страны назначения или транзита.\",\"consular.info.item2\":\"Требования к визам, ограничения по провозу багажа и личных вещей.\",\"consular.info.item3\":\"Возможные риски при посещении определенных стран или регионов.\",\"consular.support.title\":\"Содействие уязвимым категориям пассажиров\",\"consular.support.desc\":\"Консульская служба особое внимание уделяет поддержке пассажиров, которые могут столкнуться с трудностями в путешествии\",\"consular.support.card1.title\":\"Несовершеннолетние без сопровождения взрослых\",\"consular.support.card1.item1\":\"Помощь в организации передачи ребенка сопровождающим лицам, контроль за безопасностью транзита.\",\"consular.support.card2.title\":\"Лица с ограниченными возможностями\",\"consular.support.card2.item1\":\"Содействие в получении необходимых услуг и информации.\",\"consular.support.card3.title\":\"Пожилые люди\",\"consular.support.card3.item1\":\"Помощь в разрешении визовых и миграционных вопросов, поддержка в случае экстренных ситуаций.\",\"consular.when.title\":\"Когда и как обращаться в консульскую службу\",\"consular.when.item1\":\"Потеря или кража документов.\",\"consular.when.item2\":\"Задержание или отказ во въезде в страну.\",\"consular.when.item3\":\"Нужда в срочном оформлении документов или юридической поддержке.\",\"consular.when.item4\":\"Возникновение чрезвычайных ситуаций, требующих немедленного вмешательства.\",\"consular.when.desc\":\"Для обращения в консульскую службу пассажиру следует подойти к соответствующему офису в зоне международных вылетов или прибытия, либо связаться с представителями консульства по телефону, указанному на информационных стендах аэропорта.\",\"consular.tips.title\":\"Важные рекомендации\",\"consular.tips.item1\":\"Всегда носите при себе копии документов и контакты консульских служб вашей страны.\",\"consular.tips.item2\":\"При утрате документов незамедлительно обращайтесь к представителям консульства или полиции.\",\"consular.tips.item3\":\"Следуйте указаниям сотрудников консульской службы для быстрого и эффективного разрешения ситуации.\",\"consular.tips.desc\":\"Консульская служба — надежный помощник в решении сложных ситуаций и обеспечении безопасного и комфортного путешествия для каждого пассажира.\"},\"customsControl\":{\"title\":\"Таможенный контроль\"},\"dutyFree\":{\"title\":\"Дьюти-фри\"},\"baggage\":{\"title\":\"Багаж\"},\"motherRoom\":{\"title\":\"Комната матери и ребенка\",\"description\":\"Это специально оборудованное пространство, предназначенное для комфортного пребывания женщин с младенцами и детьми младшего возраста. Она обеспечивает конфиденциальность, удобство и поддержку для родителей в течение путешествия.\"},\"parking\":{\"title\":\"Паркинг\",\"description\":\"Это специально оборудованное пространство, предназначенное для удобного и безопасного размещения автомобилей пассажиров и посетителей аэропорта. Паркинг оснащен современными технологиями, обеспечивающими комфорт, безопасность и удобство оплаты.\"},\"peopleDisabilities\":{\"title\":\"Для лиц с ограниченными возможностями\"},\"police\":{\"title\":\"Милиция\"},\"prayerRoom\":{\"title\":\"Намазкана\"},\"preFlightInspection\":{\"title\":\"Предполетный досмотр\"},\"registration\":{\"title\":\"Регистрация\"},\"taxi\":{\"title\":\"Такси\"},\"transportationAnimals\":{\"title\":\"Перевозка животных\"},\"asmanAirlines\":{\"title\":\"Авиакомпания «Асман Эйрлайнс»\",\"description\":\"Это ведущий учебный центр, специализирующийся на подготовке высококвалифицированных специалистов для авиационной отрасли, работающий в рамках ОАО «Аэропорты Кыргызстана».\"},\"asmanOilCompany\":{\"title\":\"Asman Oil Company\",\"description\":\"Это ведущий учебный центр, специализирующийся на подготовке высококвалифицированных специалистов для авиационной отрасли, работающий в рамках ОАО «Аэропорты Кыргызстана».\"},\"manasMenegement\":{\"title\":\"Компания Манас Менеджмент\",\"description\":\"Это важнейшее звено в системе логистики и грузовых перевозок, действующее в рамках ОАО «Аэропорты Кыргызстана».\",\"description2\":\"С 2000 года Центр бортового питания ОАО «Аэропорты Кыргызстана» обеспечивает пассажиров и экипажи воздушных судов качественными блюдами, приготовленными в соответствии с международными стандартами.\",\"firstIndicatortext\":\"Современный центр площадью\",\"firstIndicatorNumber\":\"3960 кв.м.\",\"secondIndicatortext\":\"ВГЦ способен обслуживать до\",\"secondIndicatorNumber\":\"100 тыс. тонн\",\"logisFirstIndicatortext\":\"Современный центр площадью\",\"logisFirstIndicatorNumber\":\"850 кв. м\",\"logisSecondIndicatortext\":\"Международный сертификат\",\"logisSecondIndicatorNumber\":\"ISO 22000\"},\"trainingCenter\":{\"title\":\"Учебный центр «Манас Тренинг Центр»\",\"description\":\"Это ведущий учебный центр, специализирующийся на подготовке высококвалифицированных специалистов для авиационной отрасли, работающий в рамках ОАО «Аэропорты Кыргызстана».\",\"description2\":\"Обучение в центре проводится с использованием передовых методов, что помогает специалистам получить максимально приближенные к реальной ситуации навыки.\",\"simulators1\":\"Широкий спектр образовательных услуг\",\"simulators2\":\"Актуальные тренажеры\",\"simulators3\":\"Современные симуляторы\"},\"airCargoTerminal\":{\"title\":\"Воздушно-грузовой терминал\",\"name1\":\"Воздушно-грузовой терминал\",\"description1\":\"Воздушно-грузовой терминал международного аэропорта «Манас» — это современный логистический комплекс, обеспечивающий эффективную обработку и транспортировку грузов. Благодаря стратегическому расположению, развитой инфраструктуре и передовым технологиям, терминал является ключевым звеном в международных и региональных грузоперевозках.\",\"name2\":\"Наши возможности\",\"description2\":\"Обработка различных типов грузов: генеральные, скоропортящиеся, опасные, ценные, живые животные. Современные складские помещения с регулируемым температурным режимом. Оперативное оформление и экспедирование грузов, включая таможенное сопровождение. Комплексная логистика: прием, хранение, сортировка, перегрузка и отправка. Гибкие условия сотрудничества с авиакомпаниями, экспедиторами и грузоотправителями.\",\"name3\":\"Инфраструктура\",\"description3\":\"Просторные склады с современными системами безопасности и видеонаблюдением. Холодильные и морозильные камеры для хранения скоропортящихся товаров. Зона обработки опасных грузов с соблюдением международных норм безопасности. Автоматизированные системы учета и контроля для точного отслеживания грузов.\",\"name4\":\"Преимущества\",\"description4\":\"Удобное расположение и доступ к основным международным маршрутам. Высокая скорость обработки грузов и минимальное время ожидания. Круглосуточная работа и оперативная поддержка клиентов. ВГЦ оснащен современным оборудованием и специализированной техникой что позволяет осуществить погрузку или разгрузку одновременно двух ВС типа Боинг-747-400, АН-124 или ИЛ-76. Работает: 24/7. Мощность грузового терминала: 100 000 тонн / год\"},\"cateringCenter\":{\"title\":\"Центр бортового питания\",\"name1\":\"Центр бортового питания\",\"description1\":\"Центр бортового питания международного аэропорта «Манас» предлагает авиакомпаниям широкий спектр услуг по подготовке и доставке свежих и качественных блюд на борт. Мы обеспечиваем пассажиров и экипажи вкусным, безопасным и разнообразным питанием, соответствующим международным стандартам.\",\"name2\":\"Наши возможности\",\"description2\":\"Современные технологии и строгий контроль качества на каждом этапе. Полный цикл производства: закупка, хранение, приготовление, упаковка и доставка. Гибкая логистика и оперативная доставка бортового питания. Разработка индивидуального меню под требования авиакомпаний.\",\"name3\":\"Типы питания\",\"description3\":\"Стандартное меню – сбалансированное питание для пассажиров эконом- и бизнес-класса. Специальные рационы – детское, вегетарианское, халяльное, кошерное, диабетическое и другие диеты. VIP-меню – изысканные блюда для премиального обслуживания. Экипажное питание – оптимизированные блюда для летных экипажей и персонала.\",\"name4\":\"Производственные мощности\",\"description4\":\"Мощность до X тысяч порций в сутки. Современные кухни с международной сертификацией (HACCP, ISO). Отдельные линии приготовления для различных категорий питания.\",\"name5\":\"Сотрудничество с авиакомпаниями\",\"description5\":\"Индивидуальные условия контракта с учетом пожеланий партнеров. Соответствие требованиям международных авиационных стандартов. Круглосуточная работа и возможность экстренного обслуживания рейсов.\",\"name6\":\"Информация\",\"description6_1\":\"Центр бортового питания аэропорта «Манас» – надежный партнер для авиакомпаний, обеспечивающий высококачественное питание и превосходный сервис на борту!\",\"description6_2\":\"Компании, осуществляющие производство и поставку бортового питания, должны проходить обязательную сертификацию на соответствие сертификационным требованиям Агентства гражданской авиации Кыргызской Республики (согласно АПКР 21 «Сертификация организаций по наземному обслуживанию»)\"},\"commercialServices\":{\"title\":\"Коммерческие услуги и реклама\",\"name\":\"Коммерческие неавиационные услуги\",\"description\":\"Мы предлагаем свободные площади в аэровокзалах/на привокзальной территории 5 международных аэропортов, предназначенные под различные сервисы.\",\"optionTitle\":\"Доступные услуги:\",\"option1\":\"Авиакасса\",\"option2\":\"Вендинговый аппарат (с учетом использования прилегающей зоны)\",\"option3\":\"Массажное кресло (с учетом использования прилегающей зоны)\",\"option4\":\"Платежный терминал (с учетом использования прилегающей зоны)\",\"option5\":\"Банкомат (с учетом использования прилегающей зоны)\",\"option6\":\"Кофейня/Кафе/Бар\",\"option7\":\"Банк/сберкасса/банковские услуги\",\"option8\":\"Обменное бюро\",\"option9\":\"Аптека\",\"option10\":\"и многое другое\",\"optionTitle1\":\"Условия аренды:\",\"option11\":\"Тарифы на аренду коммерческих площадей в международных аэропортах разработаны с учетом регионального рынка.\",\"option12\":\"Стоимость аренды зависит от зонирования объекта, а также от объемов и сроков аренды.\",\"option13\":\"Сроки аренды в зависимости от коммерческих предложений потенциальных клиентов/арендаторов.\",\"contactTitle\":\"Контактная информация для связи:\",\"email\":\"Email:\",\"phone\":\"Телефон:\"},\"cooperation\":{\"title\":\"Сотрудничество\",\"name1\":\"Сотрудничество.\",\"description1\":\"ОАО «Аэропорты Кыргызстана» приглашает к долгосрочному и взаимовыгодному сотрудничеству компании и партнёров, заинтересованных в развитии бизнеса в сфере авиации, логистики, коммерческой недвижимости, рекламы и других направлений. ОАО «Аэропорты Кыргызстана», являясь ключевым транспортным узлом в регионе, предлагает уникальные возможности для совместной работы и реализации проектов. Повышению доходов аэропорта способствует увеличение объёмов деятельности путем привлечения иностранных инвесторов и зарубежных авиакомпаний, в связи с чем уделяется большое внимание развитию благоприятной бизнес-среды предприятия.\",\"name2\":\"Долгосрочные перспективы:\",\"description2\":\"Мы заинтересованы в построении долгосрочных отношений с партнёрами, что обеспечивает стабильность и рост бизнеса.\",\"name3\":\"Поддержка на всех этапах:\",\"description3\":\"Наша команда предоставляет полное сопровождение на всех этапах сотрудничества, от переговоров до реализации проектов.\",\"name4\":\"Международный уровень:\",\"description4\":\"ОАО «Аэропорты Кыргызстана» соответствует международным стандартам, что позволяет партнёрам выходить на новые рынки.\",\"name5\":\"Стратегическое расположение\",\"description5\":\"ОАО «Аэропорты Кыргызстана» расположен вблизи столицы Кыргызстана, города Бишкек, что делает его важным логистическим хабом не только для страны, но и для всего Центрально-Азиатского региона. Это идеальное место для компаний, которые хотят расширить своё присутствие в регионе.\",\"name6\":\"Высокий пассажиропоток\",\"description6\":\"Ежегодно через ОАО «Аэропорты Кыргызстана» проходит более [укажите количество] пассажиров, что открывает широкие возможности для рекламы, розничной торговли и предоставления услуг. Мы предлагаем доступ к этой аудитории через различные каналы взаимодействия.\",\"name7\":\"Гибкие условия сотрудничества\",\"description7\":\"Мы предлагаем индивидуальный подход к каждому партнёру, учитывая специфику вашего бизнеса. Наша команда готова разработать гибкие условия сотрудничества, которые будут выгодны обеим сторонам.\",\"name8\":\"Современная инфраструктура\",\"description8\":\"Аэропорт оснащён передовыми технологиями и соответствует международным стандартам. Это включает в себя современные терминалы, грузовые мощности, системы безопасности и логистические решения.\",\"name9\":\"Возможности для инвестиций\",\"description9\":\"ОАО «Аэропорты Кыргызстана» активно развивается, и мы приветствуем инвестиции в новые проекты, такие как строительство коммерческой недвижимости, развитие логистических центров, внедрение инновационных технологий и многое другое.\",\"name10\":\"Как начать сотрудничество?\",\"description10\":\"Если вы заинтересованы в сотрудничестве с аэропортом Манас, свяжитесь с нами для обсуждения деталей. Мы готовы рассмотреть ваши предложения и разработать индивидуальные условия, которые будут соответствовать вашим бизнес-целям.\",\"link\":\"Тех. Оснащения аэропортов ( Регион и международные)\",\"name11\":\"Контактная информация для связи:\",\"address\":\"Адрес:\",\"contactAddress\":\"г. Бишкек, ул. Манас, 123\"},\"fuelFillingComplex\":{\"title\":\"Топливозаправочный комплекс\",\"name1\":\"Топливозаправочный комплекс.\",\"description1\":\"Топливозаправочный комплекс международного аэропорта «Манас» обеспечивает бесперебойную заправку воздушных судов авиационным топливом высокого качества. Современные технологии, строгий контроль безопасности и соответствие международным стандартам гарантируют надежность и эффективность топливоснабжения.\",\"name2\":\"Основные возможности\",\"description2\":\"Полный цикл топливообеспечения: прием, хранение, контроль качества и заправка. Автоматизированные системы учета и контроля топлива. Соответствие международным требованиям безопасности и экологическим стандартам. Гибкие условия сотрудничества с авиакомпаниями и операторами.\",\"name3\":\"Инфраструктура\",\"description3\":\"Современные резервуары для хранения топлива с многоуровневой системой защиты. Специализированные заправочные машины с высокой пропускной способностью. Лаборатория контроля качества топлива с сертифицированным оборудованием.\",\"name4\":\"Преимущества\",\"description4\":\"Высокая скорость заправки и минимальное время обслуживания воздушных судов. Круглосуточная работа и оперативное реагирование на запросы клиентов. Гибкие тарифы и индивидуальный подход к каждому партнеру.\"},\"hallDelegationsPage\":{\"title\":\"Зал официальных делегаций\",\"name1\":\"Зал официальных делегаций\",\"description1\":\"Зал официальных делегаций Международного аэропорта «Манас»— это специализированное пространство для обслуживания высокопоставленных гостей, официальных лиц, дипломатических миссий, а также пассажиров, предпочитающих высокий уровень комфорта, конфиденциальности и персонального сервиса. Мы обеспечиваем быстрое и удобное прохождение всех формальностей в отдельной зоне, исключая ожидание в общих очередях.\",\"name2\":\"Информация о бронировании и услугах\",\"description2\":\"Стоимость обслуживания формируется в зависимости от перечня предоставляемых услуг и категории пассажиров.\",\"strong\":\"К услугам гостей:\",\"content1\":\"- оформление авиабилетов и необходимых документов\",\"content2\":\"- прохождение паспортного и таможенного контроля вне общего потока пассажиров\",\"content3\":\"- оформление и доставка багажа к воздушному судну или в зал \",\"content4\":\"- TV и Wi-Fi\",\"content5\":\"- бар прохладительных и спиртных напитков\",\"content6\":\"- комната отдыха для пассажиров\",\"content7\":\"- конференц-зал для проведения деловых встреч\",\"content8\":\"- доставка пассажиров на комфортабельном микроавтобусе к воздушному судну или в зал\",\"content9\":\"- при необходимости организация такси с оперативной подачей\",\"content10\":\"Свяжитесь с нами, чтобы узнать подробнее о доступных тарифах и условиях бронирования. Мы гарантируем эксклюзивный сервис и высокий уровень комфорта!\"},\"personnel\":\"Персонал\",\"aviationObjects\":\"Авиаобъекты\",\"passengersAndTransport\":\"Пассажиры и транспорт\",\"service\":\"Сервис\",\"infrastructure\":\"Инфраструктура\",\"events\":\"Мероприятия\",\"showMore\":\"Показать больше\",\"showMoreImages\":\"Показать больше изображений\",\"all\":\"Все\",\"airports\":{\"InternationalAirports\":\"Международные аэропорты Кыргызстана\",\"description\":\"Аэропорты Кыргызстана | Аэропорты\",\"RegionalAirports\":\"Региональные аэропорты Кыргызстана\",\"flightSchedule\":\"Расписание рейсов\",\"currentInformation\":\"Актуальная информация о прибывающих и отправляющихся рейсах:\",\"airportNotFound\":\"Аэропорт не найден\",\"dataIsMissing\":\"Данные отсутствуют\",\"selectPlaceholder\":\"Выбрать аэропорт\",\"currentTemperature\":\"Текущая температура\",\"noWeatherData\":\"Нет данных о погоде\"},\"arrivals\":\"Прилёты\",\"departures\":\"Вылеты\",\"flight\":\"Рейс\",\"airport\":\"Маршрут\",\"scheduledDate\":\"План дата\",\"actualDate\":\"Факт дата\",\"scheduled\":\"План\",\"actual\":\"Факт\",\"status\":\"Статус\",\"regularity\":\"Регулярность\",\"airline\":\"Авиакомпания\",\"short_flight\":\"Рейс\",\"short_airport\":\"Маршрт\",\"short_scheduledDate\":\"План. дата\",\"short_actualDate\":\"Факт. дата\",\"short_scheduled\":\"План.\",\"short_actual\":\"Факт.\",\"short_status\":\"Статус\",\"short_regularity\":\"Регул.\",\"news\":{\"noPicture\":\"Нет картинки\",\"videoFromMediaSlider\":\"Видео из медиа-слайдера\",\"latestNews\":\"Последние новости\",\"viewAll\":\"Все новости\",\"noPosts\":\"Новости не найдены\",\"loadError\":\"Не удалось загрузить новости\",\"title\":\"Новости\",\"description\":\"Аэропорты Кыргызстана | Новости\",\"notFound\":\"Страница не найдена\",\"pageNotFoundDescription\":\"Описание страницы не найдено\"},\"gallery\":{\"title\":\"Галерея\",\"description\":\"Аэропорты Кыргызстана | Галерея\"},\"contacts\":{\"title\":\"Контакты\",\"description\":\"Аэропорты Кыргызстана | Контакты\"},\"advertising\":{\"title\":\"Реклама в аэропорту\",\"text\":\"Рекламные возможности в аэропортах Кыргызстана помогут вашему бренду достичь максимального охвата. Разместите свою рекламу на стратегически важных площадках:\",\"phoneText\":\"Звоните в любое время\",\"readMore\":\"Подробнее\"},\"mainOffer\":{\"smallSlogan\":\"Что вы получите\",\"findoUTmore\":\"Узнайте больше\"}},\"borderControl\":{\"steps\":[{\"number\":1,\"title\":\"Подход к кабинке пограничного контроля\",\"description\":\"Встаньте в очередь согласно указаниям и ожидайте своей очереди.\"},{\"number\":2,\"title\":\"Передача документов\",\"description\":\"Передайте паспорт и другие необходимые документы сотруднику пограничной службы для проверки.\"},{\"number\":3,\"title\":\"Проверка данных\",\"description\":\"Пограничник проверяет:\",\"details\":[\"Подлинность документов\",\"Легитимность въезда или выезда из страны\",\"Наличие виз и соблюдение визовых требований.\"]},{\"number\":4,\"title\":\"Дополнительные вопросы\",\"description\":\"Пограничник может уточнить:\",\"details\":[\"Цель поездки (туризм, работа, учеба, транзит)\",\"Место проживания в стране назначения\",\"Планируемую длительность пребывания\"]},{\"number\":5,\"title\":\"Проставление отметок\",\"description\":\"После успешного прохождения контроля сотрудник ставит отметку о въезде или выезде в паспорт.\"}],\"documentReasons\":[\"Поддельные или поврежденные документы.\",\"Нарушение визового режима или отсутствие визы.\",\"Отсутствие необходимых подтверждающих документов о целях поездки.\",\"Запрет на выезд по законодательным основаниям (например, судебный запрет).\",\"Угроза национальной безопасности или общественному порядку.\"],\"title\":\"Процедура прохождения пограничного контроля\",\"intro\":\"Пограничный контроль проводится для проверки законности пересечения государственной границы и подтверждения права на выезд или въезд в страну. Эта процедура обязательна для всех пассажиров международных рейсов и является важным этапом обеспечения национальной безопасности.\",\"section1\":\"Контрольно-пропускные пункты «Манас-аэропорт» и «Ош-аэропорт» являются одним из подразделений пограничного контроля Государственной пограничной службы Кыргызской Республики, которые в своей деятельности руководствуются Конституцией, Законом Кыргызской Республики «О Государственной границе Кыргызской Республики» и иными нормативными правовыми актами Кыргызской Республики, вступившими в установленном законом порядке в силу международными договорами, участницей которых является Кыргызская Республика.\",\"section2\":\"Охрана Государственной границы в пунктах пропуска «Манас-аэропорт» и «Ош-аэропорт» и пропуск через Государственную границу лиц, воздушных судов, грузов и иного имущества осуществляется пограничными нарядами, высылаемыми от вышеуказанных контрольно-пропускных пунктов. Необходимо отметить, что от контрольно-пропускного пункта «Манас-аэропорт» выставляется состав пограничных нарядов в пункт пропуска «Иссык-Куль-аэропорт» (летнее время) для выполнения задач по охране Государственной границы и осуществления пропуска через Государственную границу лиц, воздушных судов, грузов и иного имущества в период туристического сезона.\",\"section3\":\"Общий распорядок работы указанных пунктов пропуска - время начала и окончания работы, графики (расписания) оформления лиц, воздушных судов и грузов, следующих через Государственную границу - утверждается совместным решением руководителей государственных контрольных органов и директора аэропорта.\",\"preparationTitle\":\"Подготовка к прохождению пограничного контроля\",\"preparation\":{\"documentsTitle\":\"Документы:\",\"documentsList\":[\"Паспорт гражданина вашей страны или загранпаспорт.\",\"Виза (если страна назначения требует её наличие).\",\"При необходимости дополнительные документы: приглашение, туристический ваучер, медицинская страховка, подтверждение бронирования жилья и обратного билета.\"],\"behaviorTitle\":\"Поведение:\",\"behaviorList\":[\"Оставайтесь спокойными и вежливыми.\",\"Снимите головные уборы и солнцезащитные очки перед подходом к сотруднику пограничной службы.\",\"Не используйте мобильные устройства во время контроля.\"]},\"stepProcessTitle\":\"Пошаговый процесс прохождения\",\"docRequestTitle\":\"Возможные случаи запроса дополнительных документов\",\"docRequestSubTitle1\":\"Недостаток информации\",\"docRequestSubTitle2\":\"Подозрение на нарушение миграционных правил\",\"docRequestSubTitle3\":\"Особые категории пассажиров:\",\"additionalDocs\":{\"lackInfo\":[\"Отсутствие бронирования жилья или обратного билета.\",\"Неясность цели поездки.\"],\"suspicion\":[\"Отсутствие бронирования жилья или обратного билета.\",\"Неясность цели поездки.\"],\"specialCategories\":[\"Несовершеннолетние без сопровождения (нужно разрешение).\",\"Лица с ограничениями по решению суда.\"]},\"recommendations\":{\"name\":\"Контрольно-пропускные пункты\",\"content1\":\"При осуществлении пограничного контроля в пунктах пропуска через Государственную границу Кыргызской Республики основные усилия сосредоточены на проверку документов и досмотр воздушных судов. Особое внимание обращено при проверке документов на лиц, проходящих по оперативным учетам, выявление лиц причастных к международным террористическим организациям, на выявление поддельных и чужих документов. При досмотре воздушных судов на выявление предметов контрабанды, оружия, боеприпасов, наркотических и взрывчатых веществ в тайниках, укрытиях и под грузом.\",\"content2\":\"В целях качественного осуществления пограничного контроля в указанных пунктах пропуска и выполнения поставленных задач по охране Государственной границы Кыргызской Республики, пункты пропуска «Манас-аэропорт», «Ош-аэропорт» и «Иссык-Куль-аэропорт» оснащены современными кабинами паспортного контроля и обеспечены автоматизированной системой пограничного контроля, современными техническими средствами паспортного контроля, досмотра воздушных судов, а также приборами для обнаружения нарушителей, укрывшихся в воздушных судах и грузах.\",\"title\":\"Рекомендации для успешного прохождения контроля:\",\"list\":[\"Ознакомьтесь заранее с правилами въезда в страну назначения.\",\"Проверьте срок действия паспорта и виз.\",\"Подготовьте документы заранее для быстрой проверки.\"],\"closing\":\"Желаем приятного путешествия и комфортного полета!\"}},\"customControl\":{\"steps\":[{\"number\":1,\"title\":\"Выбор коридора\",\"details\":[\"Если у вас нет предметов или валюты, подлежащих декларированию, вы проходите через 'зеленый коридор'.\",\"При наличии декларируемых предметов необходимо пройти через 'красный коридор' и заполнить декларацию.\"]},{\"number\":2,\"title\":\"Проверка багажа и ручной клади\",\"details\":[\"Вещи сканируются с помощью рентгеновского оборудования.\",\"При необходимости может проводиться ручной досмотр.\",\"Таможенник имеет право уточнить информацию о происхождении товаров и запросить подтверждающие документы.\"]},{\"number\":3,\"title\":\"Подход к кабинке пограничного контроля\",\"description\":\"Передайте паспорт и другие необходимые документы сотруднику пограничной службы для проверки.\"},{\"number\":4,\"title\":\"Проверка личных вещей\",\"details\":[\"Особое внимание уделяется драгоценным металлам, камням, культурным ценностям и крупным суммам наличных денег.\"]}],\"documentReasons\":[\"Попытка провоза запрещенных товаров\",\"Недекларирование крупной суммы наличных денег или ценных вещей\",\"Отказ от выполнения требований таможенной службы\"],\"title\":\"Процедура прохождения таможенного контроля\",\"intro\":\"Таможенный контроль проводится для предотвращения незаконного ввоза и вывоза товаров, валюты и ценных вещей через границу страны. Он также обеспечивает соблюдение таможенного законодательства и защищает экономические и общественные интересы государства.\",\"section1\":\"В целях защиты экономических интересов республики и реализации её таможенной политики на территории Международных аэропортов «Манас» и «Ош» свою деятельность осуществляет таможня «Манас» и Центр таможенных процессов «Ош», которые непосредственно подчинены Государственной таможенной службе при Правительстве КР.\",\"section2\":\"Для выполнения поставленных задач таможня оснащена современной рентгентелевизионной досмотровой техникой и техническими средствами таможенного контроля, необходимые для выявления и пресечения незаконного ввоза и вывоза запрещенных товаров.\",\"section3Title\":\"Одна из основных задач - это защита экономических интересов Кыргызстана, выражающаяся в выполнении задания по формированию доходной части бюджета страны, а также:\",\"section3\":\"- обеспечение соблюдения законодательства Кыргызской Республики о таможенном деле;\\n- защита экономических интересов Кыргызской Республики, обеспечение в пределах своей компетенции экономической безопасности Кыргызской Республики;\\n- содействие осуществлению мер по защите государственной безопасности, жизни и здоровья граждан, защите животных и растений, охране окружающей природной среды, защите интересов отечественных потребителей при ввозе товаров на территорию Кыргызской Республики.\",\"section4Title\":\"Таможня в соответствии с возложенными на нее задачами выполняет следующие функции:\",\"section4\":\"- осуществляет контроль за соблюдением законодательства о таможенном деле;\\n- организует и осуществляет таможенный контроль и таможенное оформление товаров и транспортных средств в пунктах пропуска, местах таможенного оформления и иных местах в порядке, установленном законодательством;\\n- осуществляет контроль полноты и своевременности уплаты таможенных платежей;\\n- осуществляет пресечение таможенных правонарушений;\\n- осуществляет информирование и консультирование заинтересованных лиц по таможенным вопросам;\\n- обеспечивает своевременное и полное рассмотрение жалоб и обращений лиц в порядке, установленном законодательством;\\n- выполняет иные функции, возложенные на нее законодательством.\",\"preparationTitle\":\"Подготовка к прохождению таможенного контроля\",\"preparation\":{\"documentsTitle\":\"Документы:\",\"documentsList\":[\"Паспорт и посадочный талон.\",\"Таможенная декларация (заполняется при необходимости).\",\"Документы, подтверждающие стоимость и легальность приобретения ценных вещей (при необходимости).\"],\"lanesTitle\":\"Разделение на коридоры\",\"greenLane\":\"'Зеленый коридор' — для пассажиров, не имеющих подлежащих декларированию товаров или валюты.\",\"redLane\":\"'Красный коридор' — для тех, кто декларирует товары, валюту или имеет с собой запрещенные либо ограниченные к провозу предметы.\"},\"stepProcessTitle\":\"Пошаговый процесс прохождения таможенного контроля\",\"declarationRulesTitle\":\"Правила декларирования валюты и ценных вещей\",\"currencyDeclaration\":\"Декларирование валюты\",\"currencyDeclarationList\":[\"В большинстве стран необходимо декларировать сумму, превышающую установленный лимит (обычно эквивалент $10,000).\",\"Обязательно указывайте все наличные деньги, дорожные чеки и иностранную валюту.\"],\"valuablesDeclaration\":\"Драгоценности\",\"valuablesDeclarationList\":[\"Золото, бриллианты и другие драгоценные металлы и камни подлежат декларированию, если их стоимость превышает установленный лимит.\",\"При перевозке украшений, приобретенных за границей, могут потребоваться документы, подтверждающие их покупку и стоимость.\"],\"specialGoodsDeclaration\":\"Особые товары\",\"specialGoodsDeclarationList\":[\"Культурные ценности (картины, антиквариат) требуют наличия разрешительных документов на вывоз или ввоз.\",\"Ограничено или запрещено провозить определенные виды оружия, взрывчатые вещества и товары двойного назначения.\"],\"denialReasonsTitle\":\"Причины отказа в пропуске через таможню\",\"recommendationsTitle\":\"Рекомендации для успешного прохождения контроля:\",\"recommendationsList\":[\"Заблаговременно ознакомьтесь с таможенными правилами страны отправления и назначения.\",\"Честно декларируйте валюту и ценные вещи.\",\"Храните документы на покупку дорогих вещей и культурные ценности для подтверждения их легальности.\",\"Соблюдайте правила и инструкции сотрудников таможенной службы.\"],\"closing\":\"Прохождение таможенного контроля — это несложная процедура при соблюдении всех правил и законов. Желаем вам легкого и беспрепятственного путешествия!\",\"imageAlt1\":\"Таможенный контроль\",\"imageAlt2\":\"Стюардесса\",\"imageAlt3\":\"Таможенный контроль\"},\"luggage\":{\"title\":\"Багаж пассажира\",\"basicsTitle\":\"Основное\",\"mainRequirements\":{\"title\":\"Основные требования\",\"description\":\"Весь багаж, перевозимый пассажиром, включая багаж в кабину, должен быть предъявлен при регистрации на рейс, что вызвано требованиями обеспечения безопасности полета. Багаж пассажира, который авиакомпания принимает к перевозке под свою ответственность за его сохранность, маркируется багажной биркой и перевозится в багажном отсеке самолета.\",\"list\":[\"Параметры багажа зависят от политики авиакомпании и класса обслуживания.\",\"Для зарегистрированного багажа чаще всего допустимы размеры до 158 см по сумме трех измерений (длина + ширина + высота) и вес до 20-23 кг.\",\"Ручная кладь обычно не превышает размеры 55 x 40 x 20 см и вес 5–10 кг\"]},\"freeAllowance\":{\"title\":\"Нормы бесплатного провоза багажа\",\"systemsTitle\":\"Системы норм провоза багажа\",\"systemsList\":[\"Весовая система (weight concept) (необходимо уточнить при приобретении авиабилета)\",\"Система количества мест (piece concept) (необходимо уточнить при приобретении авиабилета)\"],\"adultsChildrenTitle\":\"Для взрослых и детей\",\"adultsChildrenList\":[\"в первом классе – 40 кг.\",\"в бизнес классе – 30 кг.\",\"в экономическом классе – 20 кг.\",\"На детей младше 2 лет, путешествующих без отдельного места, норма бесплатного провоза багажа составляет 10 кг.\"]},\"luggageContent\":{\"title\":\"Содержимое багажа\",\"description\":\"\u003cstrong\u003eЦенные вещи:\u003c/strong\u003e документы, деньги, ювелирные изделия, ноутбуки и другие электронные устройства лучше перевозить в ручной клади.\u003cbr /\u003e\u003cbr /\u003eПассажирам всех классов \u003cstrong\u003eразрешается взять\u003c/strong\u003e в салон незарегистрированный багаж весом до 10 кг., который включается в общий вес багажа, перевозимого бесплатно (необходимо уточнить при приобретении авиабилета). Его размер по сумме трех измерений не должен превышать 115 см.\u003cbr /\u003eОплата за \u003cstrong\u003eсверхнормативный багаж\u003c/strong\u003e производится в соответствии с багажными тарифами, действующими на день оформления квитанции платного багажа, которая выдается пассажиру при внесении оплаты в кассе авиакомпании.\",\"allowedItemsTitle\":\"Разрешенные, но ограниченные предметы\",\"allowedItemsList\":[\"Жидкости, гели и аэрозоли в ручной клади должны быть упакованы в ёмкости объемом до 100 мл каждая, общая ёмкость не должна превышать 1 литр.\",\"Спортивное оборудование и музыкальные инструменты допускаются в качестве специального или негабаритного багажа.\"],\"prohibitedItemsTitle\":\"Запрещенные к перевозке предметы\",\"prohibitedItemsList\":[\"Боеприпасы, оружие и взрывчатые вещества.\",\"Легковоспламеняющиеся жидкости и токсичные вещества.\",\"Химические вещества и коррозионные материалы.\"]},\"packing\":{\"title\":\"Упаковка багажа\",\"description\":{\"p1\":\"Дорогие путешественники!\",\"p2\":\"Мы рады сообщить вам, что 1 июля 2025 года мы открыли 3 пункта упаковки багажа в международном аэропорту г. Бишкека!\",\"p3\":\"Здесь, вы можете не только упаковать свой багаж в нашу фирменную пленку, но и воспользоваться нашей услугой защиты багажа, а также приобрести необходимые в дороге аксессуары!\",\"p4\":\"С нетерпением ждем вас на наших стойках в международном аэропорту \\\"Манас\\\"!\",\"p5\":\"Приятного вам путешествия!\",\"contacts\":\"Контактные телефоны:\",\"phone\":\"0703 18 84 88\",\"emailLabel\":\"Email:\"}},\"marking\":{\"title\":\"Маркировка и идентификация\",\"list\":[\"Прикрепите к багажу яркие бирки с вашим именем, номером телефона и адресом электронной почты.\",\"Используйте чехлы с необычным дизайном или наклейки для быстрого опознавания своего багажа на транспортной ленте.\"]},\"oversizedLuggage\":{\"title\":\"Особенности обработки негабаритного багажа\",\"categoriesTitle\":\"Категории негабаритного багажа\",\"categoriesList\":[\"Спортивное оборудование (лыжи, велосипеды, сноуборды).\",\"Музыкальные инструменты большого размера.\",\"Детские коляски, инвалидные кресла.\"]},\"oversizedLuggageSteps\":[{\"number\":1,\"description\":\"Уведомите авиакомпанию о наличии негабаритного багажа заранее.\"},{\"number\":2,\"description\":\"Пройдите регистрацию в специально отведенных зонах для крупногабаритного багажа.\"},{\"number\":3,\"description\":\"Проследите за правильным оформлением бирок и дополнительной упаковкой для защиты.\"}],\"lostLuggage\":{\"title\":\"Действия при утере или повреждении багажа\",\"lostAndFoundTitle\":\"Служба Lost and Found:\",\"lostAndFoundList\":[\"Находится в зоне выдачи багажа или рядом с выходами.\",\"Помогает в розыске потерянного багажа и оформлении документов на компенсацию.\"],\"algorithmTitle\":\"Алгоритм действий\"},\"lostLuggageSteps\":[{\"number\":1,\"description\":\"Обратитесь к сотрудникам службы и заполните заявление о пропаже или повреждении багажа.\"},{\"number\":2,\"description\":\"Предоставьте документы: посадочный талон и багажную квитанцию.\"},{\"number\":3,\"description\":\"Сфотографируйте повреждения или состояние полученного багажа для подтверждения претензии.\"},{\"number\":4,\"description\":\"При утрате багажа авиакомпания обязана организовать его поиск и выплатить компенсацию, если он не будет найден в течение 21 дня.\"}],\"compensation\":{\"title\":\"Компенсация\",\"list\":[\"Согласно международным нормам (Конвенция Монреаля), максимальная компенсация за утрату багажа может составлять до 1 131 СПЗ (специальные права заимствования).\",\"В аэропортах Кыргызстана компенсация за утерю багажа регулируется международными соглашениями, подписанными страной, а также внутренними правилами авиакомпаний. Основной документ, регулирующий компенсацию за утерю багажа, — это Конвенция о международной гражданской авиации (Конвенция Монреаля) 1999 года, в которой прописаны условия и размер компенсации.\"],\"montrealConventionTitle\":\"Компенсация по Конвенции Монреаля:\",\"maxAmountTitle\":\"Максимальная сумма компенсации\",\"maxAmountList\":[\"За утрату багажа компенсация может составлять до 1 131 СПЗ (специальных прав заимствования). На момент января 2025 года это эквивалентно примерно 1 500–1 600 USD в зависимости от курса валют.\"],\"paymentProcedureTitle\":\"Порядок выплаты\",\"paymentProcedureList\":[\"Авиакомпания обязана выплатить компенсацию в течение 21 дня, если багаж не был найден в течение этого времени.\",\"При этом компенсация может быть уменьшена в случае, если пассажир не соблюдал правила упаковки багажа или перевозки запрещенных предметов.\"],\"howToGetTitle\":\"Как получить компенсацию за утерю багажа?\",\"applicationTitle\":\"Заявление\",\"applicationList\":[\"Пассажир должен заполнить заявление в службе Lost and Found (служба утерянных и найденных вещей) в аэропорту сразу после обнаружения утери.\"],\"documentsTitle\":\"Документы\",\"documentsList\":[\"Необходимо предоставить посадочный талон, багажную квитанцию и другие документы, которые могут подтвердить утерю багажа.\"],\"damageAssessmentTitle\":\"Оценка ущерба\",\"damageAssessmentList\":[\"Если багаж не был найден в течение 21 дня, авиакомпания оценивает ущерб и выплачивает компенсацию в рамках предусмотренных правил.\"],\"delayOrReductionTitle\":\"Отсрочка или сокращение компенсации:\",\"delayOrReductionList\":[\"В некоторых случаях компенсация может быть частичной, если пассажир не соблюдал правила упаковки, перевозил запрещенные предметы или не уведомил авиакомпанию в установленный срок.\"],\"disclaimer\":\"В случае, если пассажир не согласен с суммой компенсации, он может подать жалобу или обратиться в суд для разрешения спора.\"},\"importantInfo\":{\"title\":\"Важная информация\",\"list\":[\"Каждый пассажир, за исключением детей до 2-х лет, имеет право перевезти бесплатно багаж согласно нормам обслуживания, установленным авиакомпаниями.\",\"Дети, путешествующие на отдельных забронированных местах, могут провезти такое же количество ручной клади и регистрируемого багажа, как и взрослые пассажиры.\",\"Величина нормы бесплатного провоза багажа зависит от типа воздушного судна, направления полета и класса обслуживания. Мы настоятельно рекомендуем уточнить правила провоза ручной клади у авиакомпаний, выполняющих рейс по Вашему маршруту на сайтах этих авиакомпаний.\",\"Норма бесплатного провоза не распространяется на ряд предметов: музыкальные инструменты (их перевозят в салоне по отдельному билету) и животные. Перевозка данного сверхнормативного багажа оплачивается согласно правилам применения тарифов, независимо от других вещей, перевозимых в качестве багажа и ручной клади.\",\"Габариты багажа указываются с учетом размеров ручек и колес.\",\"Ответственность за незарегистрированные вещи несет сам пассажир.\",\"Пассажиру выдается багажная бирка как подтверждение, что зарегистрированный багаж принят для транспортировки.\",\"Перевозчик может отказать в перевозке зарегистрированного багажа, который ненадлежащим образом упакован или не приемлем для воздушной перевозки ввиду его веса, размера или происхождения.\",\"В зависимости от веса, размера или происхождения некоторые категории зарегистрированного багажа могут быть приняты к перевозке только при условии предварительного согласования с перевозчиком (например: инвалидные коляски и другие вспомогательные средства с питанием от литиевых батарей, животные, крупногабаритный багаж и т.д.)\",\"Багаж должен быть надежно закрыт, чтобы не открылся во время полета.\",\"Настоятельно рекомендуется при прибытии в пункт назначения сверять номер отрывного талона багажной бирки с номером багажной бирки на чемодане для исключения обмена однотипным багажом.\"]},\"recommendations\":{\"title\":\"Рекомендации для безопасной перевозки багажа\",\"beforeFlightTitle\":\"Перед полётом\",\"beforeFlightList\":[\"Проверьте список запрещенных предметов и уточните правила упаковки у авиакомпании.\",\"Подготовьте список содержимого багажа на случай потери.\",\"Сделайте фото вашего чемодана перед отправлением.\"],\"atAirportTitle\":\"В аэропорту\",\"atAirportList\":[\"При раннем прибытии зарегистрируйте багаж и пройдите контроль безопасности без спешки.\",\"Убедитесь в правильной маркировке багажа и сохранности багажной квитанции.\"],\"afterArrivalTitle\":\"После прибытия\",\"afterArrivalList\":[\"Осмотрите багаж на предмет повреждений или вскрытия.\",\"Немедленно сообщите о проблемах в службу Lost and Found.\"],\"additionalMeasuresTitle\":\"Дополнительные меры\",\"additionalMeasuresList\":[\"Рассмотрите возможность оформления страхования багажа при перевозке ценных вещей.\",\"При необходимости используйте услуги обмотки багажа пленкой для дополнительной защиты.\"],\"closing\":\"Следуя этим рекомендациям, вы обеспечите комфортное и безопасное путешествие без проблем с багажом.\"},\"imageAlt1\":\"Багаж\",\"imageAlt2\":\"Багаж\",\"imageAlt3\":\"Борт\",\"imageAlt4\":\"LostAndFound\",\"imageAlt5\":\"Женщина\"},\"peopleDisabilities\":{\"title\":\"Услуги для лиц с ограниченными возможностями здоровья в аэропортах Кыргызстана\",\"rampsAndElevators\":{\"title\":\"Пандусы и лифты\",\"list\":[\"Во всех основных частях аэропорта установлены пандусы для лиц с ограниченными возможностями здоровья, а также лифты для доступа в различные зоны (например, в терминалы, на выходы и в туалеты).\",\"Амбулаторный лифт для посадки/высадки ЛОВЗ с/на борт воздушного судна.\",\"Широкие двери и коридоры: Для удобства передвижения пассажиров с инвалидными колясками или другими средствами передвижения в аэропорту предусмотрены широкие двери и коридоры.\",\"Инвалидные кресла-коляски.\"]},\"specialRestrooms\":{\"title\":\"Специальные туалетные комнаты\",\"list\":[\"В аэропортах есть туалетные комнаты, оборудованные для лиц с ограниченными возможностями здоровья, которые предусматривают дополнительные поручни и простор для маневрирования инвалидных колясок.\"]},\"restAreas\":{\"title\":\"Площадки для отдыха и ожидания\",\"list\":[\"В аэропортах есть туалетные комнаты, оборудованные для лиц с ограниченными возможностями здоровья, которые предусматривают дополнительные поручни и простор для маневрирования инвалидных колясок.\",\"Специальные парковочные места в восточной стороне парковочной зоны С – это ближайшая к аэровокзальному комплексу (АВК) парковочная зона.\"]},\"instructionsTitle\":\"Инструкции для пассажиров с ограниченными возможностями здоровья\",\"steps\":[{\"number\":1,\"title\":\"Заблаговременное уведомление\",\"details\":[\"Пассажиры с ограниченными возможностями здоровья или ограниченными физическими возможностями должны заблаговременно уведомить авиакомпанию о своей потребности в специальной помощи. Это можно сделать при бронировании билета или за несколько часов до рейса, чтобы авиакомпания могла заранее подготовить необходимую поддержку.\"]},{\"number\":2,\"title\":\"Раннее прибытие в аэропорт\",\"details\":[\"Лицам с ограниченными возможностями здоровья рекомендуется прибыть в аэропорт за несколько часов до вылета, чтобы было достаточно времени на все процедуры, включая регистрацию, контроль безопасности и посадку на рейс. Обычно рекомендуется прибыть как минимум за 2-3 часа до рейса.\"]},{\"number\":3,\"title\":\"Услуги по сопровождению\",\"details\":[\"Услуга сопровождения предоставляет помощь в передвижении по аэропорту, начиная с регистрации и заканчивая посадкой в самолет или выходом из него. Для получения этой услуги также необходимо заранее уведомить авиакомпанию.\"]},{\"number\":4,\"title\":\"Использование инвалидных колясок\",\"details\":[\"Если пассажир не может передвигаться самостоятельно, аэропорты предоставляют бесплатные инвалидные коляски для передвижения по территории аэропорта. Если пассажир путешествует с собственным инвалидным креслом, то оно будет безопасно помещено в багажный отсек самолета.\"]},{\"number\":5,\"title\":\"Погрузка и высадка с использованием специальных устройств\",\"details\":[\"Для посадки и высадки пассажиров с ограниченными возможностями здоровья могут быть использованы специальные подъемники или платформы, которые помогают беспрепятственно пересаживаться из кресла в самолет и наоборот.\"]}],\"behaviorRulesTitle\":\"Правила поведения для пассажиров с ограниченными возможностями здоровья\",\"orderRules\":{\"title\":\"Соблюдение порядка\",\"list\":[\"Пассажиры с ограниченными возможностями здоровья должны соблюдать общие правила безопасности, такие как требования по использованию ремней безопасности, в случае необходимости участия в инструктаже по безопасности, а также следовать указаниям персонала аэропорта и экипажа.\"]},\"assistanceRules\":{\"title\":\"Сопровождение и помощь\",\"list\":[\"На время пребывания в аэропорту или в процессе посадки и высадки лицам с ограниченными возможностями здоровья могут воспользоваться услугами сопровождающих, если это необходимо. Важно заранее сообщить персоналу о потребности в этой помощи.\"]},\"mobilityRules\":{\"title\":\"Мобильность в зоне безопасности\",\"list\":[\"Пассажиры с ограниченными возможностями здоровья должны сообщить сотрудникам службы безопасности об их ограниченной мобильности. Это позволяет ускорить процесс прохождения контроля безопасности, включая использование специально выделенных для этой категории пассажиров проходов.\"]},\"recommendations\":{\"description\":\"Аэропорты Кыргызстана стремятся обеспечить максимальный комфорт и доступность для лиц с ограниченными возможностями здоровья, предоставляя услуги помощи, доступные инфраструктуры и оборудование для безопасного и удобного путешествия. Важно заранее сообщать о потребности в специальной помощи и следовать рекомендациям, чтобы ваше путешествие было как можно более комфортным.\",\"attention\":\"Внимание: при бронировании и покупке авиабилета обязательно сообщайте, какие специальные услуги и помощь Вам потребуются в аэропорту и во время полета. О необходимости этих услуг следует сообщить авиаперевозчику или агенту по продаже билетов во время заказа авиабилетов, но не позднее, чем за 48 часов до вылета.\",\"callText\":\"Звоните в любое время\",\"phoneNumber\":\"+996 312 / 69 31 09\"},\"imageAlt1\":\"Пандус\",\"imageAlt2\":\"Люди с ограниченными возможностями\",\"imageAlt3\":\"Люди\"},\"transportationAnimals\":{\"title\":\"Правила перевозки животных в аэропортах Кыргызстана\",\"transportTypes\":{\"title\":\"Типы перевозки животных\",\"inCabin\":{\"title\":\"В салоне самолета\",\"list\":[\"Маленькие домашние животные, такие как кошки, собаки и попугаи, обычно могут перевозиться в салоне вместе с владельцем, если их вес (вместе с клеткой или контейнером) не превышает определенного лимита, установленного авиакомпанией (чаще всего до 8-10 кг).\"]},\"inBaggage\":{\"title\":\"В багажном отделении\",\"list\":[\"Крупные животные, а также те, которые не могут поместиться в салоне, обычно перевозятся в багажном отделении. В этом случае животные находятся в специальном отсекаемом контейнере, обеспечивающем их безопасность во время полета.\"]}},\"transportConditions\":{\"title\":\"Условия перевозки\",\"container\":{\"title\":\"Контейнер или клетка\",\"list\":[\"Животные должны быть размещены в специальных контейнерах или клетках, которые соответствуют стандартам IATA (Международной ассоциации воздушного транспорта). Контейнер должен быть прочным, хорошо вентилируемым и подходящим по размеру для животного. В клетке животное должно иметь возможность стоять, лежать и поворачиваться.\"]},\"packaging\":{\"title\":\"Упаковка для перевозки\",\"list\":[\"Контейнеры для перевозки животных должны иметь специальные системы для фиксации дверцы, быть герметичными, и не иметь повреждений, которые могут привести к травмам животного.\"]}},\"safetyRequirements\":{\"title\":\"Требования по безопасности\",\"windows\":{\"title\":\"Окна контейнера должны быть прочными\",\"list\":[\"Окна и решетки контейнера должны быть устойчивыми, чтобы животное не могло повредить контейнер во время путешествия.\"]},\"markers\":{\"title\":\"Сигнальные метки\",\"list\":[\"На контейнере должны быть указаны данные владельца, а также маркировка о том, что в контейнере находится животное.\"]}},\"transportRestrictions\":{\"title\":\"Типы перевозки животных\",\"list\":[\"Некоторые авиакомпании могут не перевозить определенные виды животных (например, экзотических животных или опасных животных) или устанавливать дополнительные ограничения по перевозке.\",\"Также может быть ограничение на количество животных, которые могут быть перевезены в одном рейсе, поэтому рекомендуется заранее уточнить все подробности у авиакомпании.\"]},\"requiredDocuments\":{\"title\":\"Необходимые документы для перевозки животных\",\"animalPassport\":{\"title\":\"Паспорт животного\",\"list\":[\"Для международных рейсов животное должно иметь паспорт с отметками о вакцинациях. Паспорт оформляется у ветеринара. В паспорте должны быть указаны данные о прививках от бешенства, а также других заболеваний, которые могут требоваться для ввоза в страну назначения.\",\"Для поездки за границу необходимо наличие международного ветеринарного сертификата, который подтверждает, что животное не заражено заболеваниями, опасными для здоровья человека\"]},\"vetCertificate\":{\"title\":\"Ветеринарный сертификат\",\"list\":[\"Для международной перевозки животного требуется ветеринарный сертификат, который выдается государственной ветеринарной службой. Этот сертификат подтверждает, что животное здорово и готово к путешествию.\",\"Для внутренних рейсов сертификат не всегда требуется, но на усмотрение авиакомпании могут понадобиться другие документы, подтверждающие здоровье животного.\"]},\"quarantineDocs\":{\"title\":\"Документы на карантин\",\"list\":[\"В некоторых случаях для ввоза животного в страну могут потребоваться дополнительные документы, касающиеся карантинных требований (например, для экзотических животных или новых видов, которых могут допустить в страну).\"]},\"vaccinations\":{\"title\":\"Прививки\",\"list\":[\"Животное должно быть вакцинировано от заболеваний, таких как бешенство, и прививки должны быть сделаны заранее (обычно минимум за 21 день до поездки).\"]},\"otherDocs\":{\"title\":\"Другие документы\",\"list\":[\"Для некоторых стран могут потребоваться дополнительные документы, такие как справки о здоровье, справки об отсутствии инфекционных заболеваний и других заболеваний\"]}},\"whereToGetDocs\":{\"title\":\"Где взять документы\",\"passport\":{\"title\":\"Ветеринарный паспорт и сертификат\",\"list\":[\"Ветеринарный сертификат и необходимые прививки для международных перевозок оформляются в государственной ветеринарной службе или в сертифицированных ветеринарных клиниках.\"]},\"healthCertificate\":{\"title\":\"Международный сертификат здоровья животного\",\"list\":[\"Можно получить в государственной ветеринарной службе или в международных ветеринарных клиниках, которые имеют лицензии на оформление таких документов.\"]}},\"transportRules\":{\"title\":\"Правила перевозки\",\"rule1\":{\"list\":[\"Животные и птицы принимаются к воздушной перевозке по предварительному согласованию с авиаперевозчиком и перевозятся в багажном помещении воздушного судна.\",\"Пассажиру, в момент бронирования перевозки необходимо сообщить авиаперевозчику о количестве перевозимых животных и птиц.\",\"При оформлении перевозки животных/птиц пассажир должен предоставить авиаперевозчику ветеринарный сертификат, выданный компетентным государственным учреждением и другие документы, требуемые ветеринарными органами страны назначения.\"]},\"rule2\":{\"list\":[\"Прием к перевозке животных и птиц производится при условии, что пассажир/грузоотправитель берет на себя всю ответственность за последствия, которые могут возникнуть во время перевозки.\",\"Комнатные животные (птицы) при перевозке воздушным транспортом должны быть помещены в крепкий контейнер (клетку), обеспечивающий необходимые удобства при перевозке, с доступом воздуха и надежным запором (замком). Дно контейнера (клетки) должно быть плотным, водонепроницаемым и покрыто абсорбирующим материалом. Контейнер (клетка) должен исключать просыпание абсорбирующего материала. Клетка для птиц должна быть покрыта плотной светонепроницаемой тканью.\"]}},\"recommendations\":{\"title\":\"Рекомендации для пассажиров, путешествующих с животными\",\"notification\":{\"title\":\"Предварительное уведомление\",\"list\":[\"Рекомендуется уведомить авиакомпанию о перевозке животного при бронировании билета или заранее, чтобы гарантировать наличие мест для животных на рейсе.\"]},\"planning\":{\"title\":\"Планирование поездки\",\"list\":[\"Позаботьтесь о безопасности и удобстве животного во время путешествия. Убедитесь, что контейнер соответствует стандартам, а животное привито и не имеет заболеваний, которые могут повлиять на его здоровье во время полета.\"]},\"checkConditions\":{\"title\":\"Проверка условий перевозки\",\"list\":[\"Ознакомьтесь с правилами перевозки животных вашей авиакомпании, так как разные авиакомпании могут иметь различные требования и ограничения для перевозки животных.\"]},\"conclusion\":\"Таким образом, для безопасной и комфортной перевозки животных важно соблюдать все требования и подготовить необходимые документы заранее.\"},\"imageAlt1\":\"Животные в аэропорту\",\"imageAlt2\":\"Животные в контейнере\",\"imageAlt3\":\"Документы для животных\",\"imageAlt4\":\"Путешествие с животными\"},\"police\":{\"title\":\"Милиция в аэропорту\",\"mainDuties\":{\"title\":\"Основные обязанности милиции в аэропорту\",\"publicOrder\":{\"title\":\"Обеспечение общественного порядка\",\"list\":[\"Милиция следит за соблюдением общественного порядка на территории аэропорта. Это включает в себя контроль за поведением пассажиров и других посетителей, предотвращение правонарушений и обеспечение безопасной обстановки.\"]},\"safetyControl\":{\"title\":\"Контроль за безопасностью\",\"list\":[\"Милиция обеспечивает выполнение всех правил безопасности в аэропорту, включая контроль за поведением пассажиров и сотрудников, а также обеспечение защиты от террористических угроз и других преступных действий.\",\"Милиция взаимодействует с другими службами безопасности, такими как службы охраны аэропорта, службы безопасности авиакомпаний и таможенные органы, чтобы предотвращать попытки перевозки запрещенных предметов и веществ.\"]}},\"crimePrevention\":{\"title\":\"Пресечение правонарушений и преступлений\",\"list\":[\"Милиция занимается пресечением различных правонарушений, таких как кражи, мошенничество, насилие, хулиганство, незаконная продажа товаров или услуг, а также любые другие нарушения, происходящие на территории аэропорта.\",\"Также сотрудники милиции отвечают за расследование происшествий, таких как кражи багажа, повреждения имущества и другие инциденты.\"]},\"documentsCheck\":{\"title\":\"Проверка документов и установление личности\",\"list\":[\"Милиция контролирует законность пребывания граждан на территории аэропорта, проверяет документы пассажиров, а также может осуществлять контроль за иностранными гражданами, находящимися в стране.\",\"В случае необходимости милиция может проводить проверку на наличие правонарушений, таких как фальшивые документы или попытки нарушения визовых или иммиграционных правил.\"]},\"emergencyAssistance\":{\"title\":\"Оказание помощи в чрезвычайных ситуациях\",\"list\":[\"В случае чрезвычайных ситуаций (например, при возникновении террористической угрозы, массовых беспорядках, природных катастрофах) милиция принимает меры для обеспечения безопасности людей, эвакуации, а также взаимодействует с другими службами для организации быстрого реагирования.\",\"Милиция также может обеспечивать безопасность в случае крупных аварий, например, при катастрофах, происшествиях с самолетами или наземными транспортными средствами.\"]},\"rightsProtection\":{\"title\":\"Защита прав пассажиров и сотрудников\",\"list\":[\"Милиция оказывает помощь в защите прав пассажиров и сотрудников аэропорта, разрешая конфликты и споры, которые могут возникать между пассажирами, работниками или внешними лицами.\",\"В случае с ситуациями, когда нарушаются права пассажиров (например, агрессия со стороны других людей), милиция принимает меры для восстановления порядка.\"]},\"perimeterSecurity\":{\"title\":\"Охрана периметра и ключевых объектов аэропорта\",\"list\":[\"Милиция следит за безопасностью важных объектов аэропорта, таких как взлетно-посадочные полосы, здания терминалов, склады, зоны досмотра, а также другие важные инфраструктурные объекты, которые могут быть объектами для попыток противоправных действий.\"]},\"assistance\":{\"title\":\"Помощь, которую оказывает милиция\",\"documentsHelp\":{\"title\":\"Помощь в утрате документов\",\"list\":[\"Если пассажир потерял или забыл важные документы, например, паспорт или билет, милиция может помочь в восстановлении документов или в решении ситуаций, связанных с незаконным доступом к личной информации.\"]},\"conflictResolution\":{\"title\":\"Решение конфликтных ситуаций\",\"list\":[\"Милиция помогает решать конфликты между пассажирами или между пассажирами и сотрудниками аэропорта, а также обеспечивает мирное разрешение спорных ситуаций.\",\"В случае агрессивного поведения или угрозы безопасности милиция может вмешиваться для прекращения насилия и обеспечении правопорядка.\"]},\"incidentInvestigation\":{\"title\":\"Участие в расследовании происшествий\",\"list\":[\"В случае краж, потери багажа или других инцидентов милиция ведет расследование, помогает потерпевшим восстановить утраченные вещи или разъяснить обстоятельства происшествия.\",\"Также милиция может сотрудничать с таможенными органами в расследовании случаев контрабанды или попыток незаконного ввоза товаров.\"]},\"evacuationAssistance\":{\"title\":\"Помощь в эвакуации и организации безопасности\",\"list\":[\"Милиция оказывает помощь в организации эвакуации пассажиров и сотрудников аэропорта в случае угрозы (например, пожар, чрезвычайная ситуация или акт терроризма).\",\"В подобных ситуациях сотрудники милиции работают с другими службами, обеспечивая порядок в ходе эвакуации и следя за безопасностью людей.\"]}},\"safetyConsulting\":{\"title\":\"Консультирование и помощь по вопросам безопасности\",\"list\":[\"Милиция предоставляет консультации пассажирам по вопросам безопасности, рассказывая о правилах поведения в аэропорту, правильной упаковке багажа и других важных аспектах, чтобы избежать нарушений и неприятных ситуаций.\",\"Если пассажирам необходимо дополнительное объяснение или помощь по законам и правилам, сотрудники милиции всегда готовы предоставить информацию и поддержку.\"]},\"conclusion\":{\"description\":\"Милиция в аэропорту играет ключевую роль в обеспечении общественного порядка и безопасности. Ее сотрудники контролируют ситуацию, предотвращают преступления, помогают пассажирам и решают конфликтные ситуации. Милиция активно сотрудничает с другими службами безопасности аэропорта для обеспечения безопасного и комфортного пребывания всех людей на территории аэропорта.\\n\\nВ случае возникновения проблем Вы можете обратиться в дежурную часть органа внутренних дел на воздушном транспорте Управления внутренних дел на транспорте (ОВД на воздушном транспорте УВДТ) МВД Кыргызской Республики. Своевременное обращение в милицию с заявлением о преступлении позволяет более эффективно и своевременно провести необходимый комплекс мероприятий, направленных на его раскрытие, изобличение лиц, к нему причастных, и привлечение их к уголовной ответственности, возместить причинённый вред. А в случаях получения информации о готовящемся преступлении - предотвратить его.\",\"callText\":\"Телефон:\",\"phoneNumber\":\"+996 (312) 69-34-02\"},\"imageAlts\":{\"image1\":\"Милиция в аэропорту\",\"image2\":\"Сотрудники милиции\",\"image3\":\"Милиция помогает пассажирам\"}},\"preFlightInspection\":{\"title\":\"Предполетный досмотр: Правила и Процедуры\",\"description\":\"Предполетный досмотр — обязательная процедура в аэропортах Кыргызской Республики, направленная на обеспечение безопасности пассажиров, экипажа и воздушного судна. Досмотр проводится в соответствии с международными стандартами авиационной безопасности и национальным законодательством.\",\"goals\":{\"title\":\"Цели предполетного досмотра:\",\"items\":[\"Обеспечение безопасности пассажиров и предотвращение угроз на борту\",\"Выявление и изъятие запрещенных предметов и веществ\",\"Предотвращение несанкционированного доступа к самолетам и авиационным объектам\"]},\"process\":{\"title\":\"Процесс прохождения досмотра\",\"preparation\":{\"title\":\"Подготовка к досмотру:\",\"steps\":[\"Перед прохождением зоны контроля пассажиров просят подготовить посадочный талон и удостоверение личности.\",\"Все металлические предметы, крупная электроника (ноутбуки, планшеты) и жидкости необходимо выложить из ручной клади для отдельного сканирования.\",\"Верхнюю одежду и головные уборы также необходимо снять и передать на проверку.\"]},\"procedure\":{\"title\":\"Процедура проверки:\",\"steps\":[\"Ручная кладь и личные вещи пассажиров проверяются с помощью рентгеновских сканеров.\",\"Пассажиры проходят металлодетектор, при срабатывании проводится дополнительный досмотр.\",\"Пассажиры с ограниченными возможностями или медицинскими имплантами проходят досмотр с учетом их особенностей и потребностей.\"]}},\"prohibited\":{\"title\":\"Запрещенные предметы и вещества\",\"items\":[{\"title\":\"Оружие\",\"description\":\"Пистолеты, огнестрельное оружие (все виды);  Игрушечные пистолеты и муляжи и имитации оружия, которые можно принять за настоящее;  Составные части стрелкового оружия (за исключением некоторых, например телескопических прицелов);  Пневматическое оружие, включая ружья, пистолеты на сжатом воздухе или с CO₂ баллончиками;  Сигнальные ракетницы и стартовые пистолеты луки, арбалеты, стрелы; гарпунные ружья, ружья для подводной охоты; рогатки и пращи; \"},{\"title\":\"Колющие и режущие предметы\",\"description\":\"Ножи, ножницы, лезвия, ледорубы, бритвенные лезвия, мечи и сабли и др.;  Есть конкретнее: ножи с лезвием более 6 см; ножницы с лезвиями более 6 см (если мерить от центра шарнира) — попадают в запрет.;  Рабочие инструменты с такими заострёнными элементами также запрещены: отвертки, стамески и др.\"},{\"title\":\"Взрывчатые вещества\",\"description\":\"Боеприпасы, капсюлидетонаторы, детонаторы и запалы, мины, гранаты и др.;  В багаже (зарегистрированном багаже) ряд взрывчатых и зажигательных веществ запрещены по соображениям безопасности полёта;\"},{\"title\":\"Жидкости сверх нормы\",\"description\":\"Этот запрет распространяется на жидкости, тюбики, контейнеры и иные средства хранения субстанций личной гигиены, косметики, медикаментов, а также красок, клеев и т.п., если они находятся в ручной клади.;  Исключения: детское питание, материнское молоко, лекарства, которые требуются пассажирам во время полёта. \"}]},\"exceptions\":{\"title\":\"Исключения из процедуры досмотра:\",\"description\":\"Предполетный досмотр обязателен для всех пассажиров. Однако дипломатические и официальные представители некоторых государств могут проходить досмотр по упрощенной схеме в соответствии с международными соглашениями и дипломатическими привилегиями.\",\"denialReasons\":{\"title\":\"Причины отказа в допуске на борт\",\"items\":[\"Обнаружение запрещенных предметов.\",\"Отказ пассажира от прохождения досмотра или выполнения инструкций службы безопасности.\",\"Поведение, которое вызывает обоснованные подозрения.\"]},\"tips\":{\"title\":\"Советы для удобного прохождения досмотра\",\"items\":[\"Приезжайте в аэропорт заранее, чтобы избежать спешки.\",\"Заранее доставайте жидкости, электронику и металлические предметы для быстрого прохождения проверки.\",\"Соблюдайте инструкции сотрудников службы безопасности.\"]},\"conclusion\":\"Предполетный досмотр — это не просто формальность, а важный этап защиты каждого пассажира. Благодарим за понимание и сотрудничество в обеспечении безопасных полетов!\"},\"imageAlts\":{\"preflight1\":\"Предполетный досмотр\",\"preflight2\":\"Исключения из процедуры досмотра\",\"gun\":\"Оружие\",\"knife\":\"Колющие и режущие предметы\",\"boom\":\"Взрывчатые вещества\",\"liquid\":\"Жидкости сверх нормы\"}},\"registration\":{\"title\":\"Процедура регистрации пассажиров на рейс: \u003cbr\u003e Пошаговое руководство\",\"description\":\"Регистрация на рейс — важный этап перед полетом, включающий подтверждение бронирования, получение посадочного талона и сдачу багажа. Процедура может отличаться в зависимости от типа рейса (внутренний или международный), но общий порядок остается неизменным.\",\"arrivalTime\":{\"text\":\"Пассажир должен явиться в аэропорт для регистрации билета и оформления багажа:\",\"items\":[\"на международные рейсы за 3 часа до вылета рейса\",\"на внутренние рейсы за 2 часа до вылета рейса\"],\"note\":\"Регистрация на все международные рейсы авиакомпаний  заканчивается за 1 час до вылета.\"},\"steps\":{\"preparation\":{\"title\":\"Подготовка к регистрации\",\"items\":[{\"title\":\"Документы:\",\"text\":\"Убедитесь, что у вас есть действующий паспорт (для международных рейсов) или удостоверение личности (для внутренних рейсов), а также подтверждение бронирования билета.\"},{\"title\":\"Багаж:\",\"text\":\"Ознакомьтесь с правилами провоза багажа, чтобы заранее подготовить вещи в соответствующих весовых и габаритных рамках.\"}]},\"checkInArea\":{\"title\":\"Проход к зоне регистрации\",\"items\":[\"Следуйте указателям в терминале к стойкам регистрации вашего рейса. Номер рейса и стойки регистрации можно найти на электронных табло аэропорта или заранее уточнить у авиаперевозчика.\"]},\"queue\":{\"title\":\"Очередь и ожидание\",\"items\":[\"Подойдите к своей стойке и дождитесь своей очереди. Авиакомпании могут предложить отдельные стойки для пассажиров бизнес-класса, путешествующих с детьми, или имеющих особые потребности.\",\"В здании аэровокзалов аэропортов находятся залы ожидания, кафе, киоски с печатной и сувенирной продукцией, банкоматы, почта, обменные бюро. Большинство из них работает круглосуточно.\"]},\"documentsCheck\":{\"title\":\"Проверка документов\",\"header\":\"Сотрудник авиакомпании проверяет:\",\"items\":[\"Паспорт или удостоверение личности.\",\"Электронный билет или код бронирования.\",\"Визу (при необходимости для международных рейсов).\"]},\"baggage\":{\"title\":\"Оформление багажа\",\"items\":[\"Багаж взвешивается и маркируется багажной биркой.\",\"Если вес багажа превышает разрешенные нормы, может потребоваться доплата.\",\"Вам выдается квитанция для получения багажа в аэропорту назначения.\"]},\"boardingPass\":{\"title\":\"Получение посадочного талона\",\"header\":\"Сотрудник выдает посадочный талон, где указаны:\",\"items\":[\"Номер рейса и место посадки.\",\"Время начала и окончания посадки.\",\"Номер выхода на посадку (Gate).\"]},\"additionalServices\":{\"title\":\"Дополнительные услуги\",\"header\":\"Если необходимо, можно оформить платные услуги:\",\"items\":[\"Выбор места на борту.\",\"Оплата сверхнормативного багажа.\",\"Заказ специального питания (при наличии услуги).\"]},\"securityCheck\":{\"title\":\"Переход к зоне предполетного досмотра\",\"items\":[\"После получения посадочного талона пассажиры проходят в зону досмотра и пограничного контроля (для международных рейсов).\"]},\"advice\":{\"title\":\"Советы для успешной регистрации:\",\"items\":[\"Приезжайте в аэропорт за 3-4 часа до вылета для международных рейсов и за 2-3 часа для внутренних.\",\"Следите за изменениями времени регистрации и выхода на посадку.\",\"Пользуйтесь услугами онлайн-регистрации, если они доступны, чтобы сэкономить время в аэропорту.\"],\"wish\":\"Желаем приятного путешествия и комфортного полета!\"}},\"imageAlts\":{\"registration\":\"Процедура регистрации\",\"baggage\":\"Багаж\",\"queue\":\"Очередь на регистрацию\",\"documents\":\"Проверка документов\",\"boardingPass\":\"Посадочный талон\",\"terminal\":\"Аэропорт\"}},\"childrenRoom\":{\"title\":\"Детская комната в аэропортах Кыргызстана\",\"description\":\"Детская комната в аэропортах Кыргызстана — это специально оборудованное пространство, предназначенное для отдыха, развлечений и ухода за детьми в процессе путешествия. Комната предназначена для того, чтобы сделать время ожидания комфортным для маленьких пассажиров и их родителей.\",\"functions\":{\"title\":\"Функции детской комнаты\",\"entertainment\":{\"title\":\"Развлечение и досуг для детей\",\"items\":[\"Комната предоставляет пространство для игры и досуга детей, что помогает снять напряжение и усталость во время ожидания рейса.\",\"В детской комнате установлены игровые элементы, такие как игрушки, конструкторы, книжки, настольные игры и интерактивные экраны для развлечения.\"]},\"safety\":{\"title\":\"Безопасная среда\",\"items\":[\"Комната оборудована безопасно для детей. Это включает в себя защитные элементы (углы на мебели, нескользящие покрытия на полу и т.д.), чтобы исключить травмирование во время игр.\",\"В комнате также обеспечена постоянная вентиляция и комфортная температура.\"]},\"rest\":{\"title\":\"Отдых и уединение для детей\",\"items\":[\"Некоторые детские комнаты могут включать тихие зоны, где ребенок может отдохнуть или даже поспать, особенно если рейс длительный, и ожидание может занять несколько часов.\"]},\"care\":{\"title\":\"Уход за детьми\",\"items\":[\"В комнате могут быть предусмотрены дополнительные удобства для ухода за детьми, такие как пеленальные столики или места для кормления младенцев.\"]}},\"access\":{\"title\":\"Кто может пользоваться детской комнатой\",\"parents\":{\"title\":\"Родители или сопровождающие\",\"text\":\"Важно, чтобы ребенок находился под присмотром взрослого, так как детская комната предназначена для игр и отдыха, но не для длительного пребывания без контроля.\"},\"children\":{\"title\":\"Дети до определенного возраста\",\"text\":\"Обычно дети до 7 лет могут пользоваться детской комнатой, но возрастные ограничения могут варьироваться в зависимости от конкретного аэропорта.\"}},\"services\":{\"title\":\"Доступ и услуги\",\"freeUse\":{\"title\":\"Бесплатное использование\",\"text\":\"Как правило, детская комната предоставляется бесплатно для всех пассажиров, путешествующих с детьми. Тем не менее, в некоторых аэропортах могут быть предусмотрены дополнительные услуги, такие как няни или игровые секции за дополнительную плату.\"},\"availability\":{\"title\":\"Доступность\",\"text\":\"Детская комната расположена в удобном месте, обычно в районе ожидания, возле зоны регистрации или у выхода на посадку.\"},\"workingHours\":{\"title\":\"Время работы\",\"text\":\"Комната обычно доступна в рабочие часы аэропорта, но может быть ограничена в зависимости от специфики работы конкретного аэропорта.\"},\"conclusion\":\"Детская комната в аэропорту — это необходимая инфраструктура для путешествующих семей, которая помогает обеспечить комфорт и безопасность детей, делая процесс ожидания более приятным и легким для всех пассажиров.\"},\"imageAlts\":{\"child1\":\"Дети в игровой комнате\",\"child2\":\"Мать с ребенком\",\"child3\":\"Отец с ребенком\"}},\"motherRoom\":{\"title\":\"Комната матери и ребенка\",\"description\":\"Комната матери и ребенка в аэропортах Кыргызстана — это специально оборудованное пространство, предназначенное для комфортного пребывания женщин с младенцами и детьми младшего возраста. Она обеспечивает конфиденциальность, удобство и поддержку для родителей в течение путешествия. Имеются спальные места, места для пеленания, микроволновая печь, диспенсер с питьевой водой, раковина с холодной/горячей водой, игрушки. Комнатой можно воспользоваться с детьми возрастом до 7 лет.\",\"functions\":{\"title\":\"Функции комнаты матери и ребенка\",\"feeding\":{\"title\":\"Удобство для кормления и отдыха\",\"items\":[\"Комната предоставляет удобные места для кормления детей, будь то грудное вскармливание или использование смеси.\",\"Обеспечивает уединение для мам, чтобы они могли комфортно покормить ребенка вдали от шума и суеты.\"]},\"diaper\":{\"title\":\"Смена подгузников\",\"items\":[\"В комнате предусмотрены специальные пеленальные столы для удобной смены подгузников и ухода за детьми.\"]},\"sleep\":{\"title\":\"Тихая зона для сна\",\"items\":[\"Комната может быть оборудована мягкими креслами или кроватками для того, чтобы дети могли отдохнуть перед полетом, а мамы — расслабиться.\"]},\"hygiene\":{\"title\":\"Удобства для гигиенического ухода\",\"items\":[\"Наличие раковин, средств для мытья рук, а также возможно наличие стерилизатора для бутылочек и аксессуаров для ухода за ребенком.\"]}},\"equipment\":{\"title\":\"Что должно быть в комнате матери и ребенка\",\"items\":[\"Пеленальный стол или удобное место для смены подгузников.\",\"Кресло для кормления с поддержкой для удобного сидения мамы и кормления грудью или смесью.\",\"Детская кроватка или удобное место для отдыха ребенка.\",\"Зеркало для мамы и места для хранения личных вещей.\",\"Гигиенические средства: полотенца, жидкость для мытья рук, мусорные контейнеры для подгузников.\",\"Стерилизатор для бутылочек или подогреватель для пищи.\",\"Доступ к питьевой воде или возможности для мамы взять напиток.\"]},\"services\":{\"title\":\"Доступ и услуги\",\"freeUse\":{\"title\":\"Бесплатное использование\",\"text\":\"Комната матери и ребенка предоставляется бесплатно для всех пассажиров, соответствующих условиям (например, женщинам с детьми до 2-3 лет).\"},\"availability\":{\"title\":\"Доступность\",\"text\":\"Комната обычно расположена вблизи зоны ожидания или рядом с туалетами, чтобы родители могли легко и быстро попасть туда.\"},\"comfort\":{\"title\":\"Удобства для отдыха\",\"text\":\"Приятная атмосфера с достаточным количеством освещения, теплых или мягких цветов для создания комфортных условий для ребенка и мамы.\"},\"conclusion\":\"Комнаты матери и ребенка являются важной частью инфраструктуры аэропортов, предоставляя дополнительную поддержку для путешествующих семей. Они помогают сделать процесс путешествия более комфортным и удобным, особенно для тех, кто летит с маленькими детьми.\"},\"imageAlts\":{\"mother1\":\"Мама с ребенком в комнате\",\"mother2\":\"Мама с ребенком\",\"mother3\":\"Доступ и услуги комнаты матери и ребенка\"}},\"prayerRoom\":{\"title\":\"Намазкана (комната для молитв) в аэропортах Кыргызстана\",\"description\":\"Это специально оборудованное место для молитвенных нужд мусульман, где они могут совершать намаз (молитву), соблюдая религиозные традиции и обычаи. Намазкана предоставляет пространство для комфортного и уединенного совершения молитвы перед или после рейса.\",\"functions\":{\"title\":\"Функции намазканы\",\"prayer\":{\"title\":\"Функции намазканы:\",\"items\":[\"Основная функция намазканы — это создание условий для мусульман, чтобы они могли совершить обязательные и дополнительные молитвы (намаз) в удобное время.\",\"Комната предоставляет уединение и тишину для молитвы в условиях, когда другие части аэропорта могут быть шумными и многолюдными.\"]},\"religious\":{\"title\":\"Религиозная обстановка\",\"items\":[\"Намазкана является священным пространством, где соблюдаются требования чистоты и религиозного порядка. Она должна быть устроена таким образом, чтобы удовлетворить потребности верующих в молитвенном процессе.\"]},\"privacy\":{\"title\":\"Обеспечение уединения\",\"items\":[\"В комнате обеспечивается личное пространство для молящихся, так как многие мусульмане предпочитают совершать молитву в одиночестве или в малых группах.\"]},\"rituals\":{\"title\":\"Помощь в соблюдении религиозных обрядов\",\"items\":[\"Намазкана служит также местом для подготовки к молитве, где мусульмане могут сделать абдест (ритуальное омовение), если требуется.\"]}},\"access\":{\"title\":\"Кто может пользоваться намазканой\",\"muslims\":{\"title\":\"Мусульмане\",\"text\":\"Основные пользователи намазканы — это мусульмане, которым необходимо совершить молитву перед полетом или после него.\"},\"cleanState\":{\"title\":\"Пассажиры в состоянии ритуальной чистоты\",\"text\":\"Те, кто совершает омовение и находится в состоянии ритуальной чистоты, могут использовать намазкану для молитвы.\"},\"allMuslims\":{\"title\":\"Все желающие мусульмане, независимо от возраста или пола\",\"text\":\"Намазкана предназначена как для мужчин, так и для женщин, и обычно имеет отдельные зоны для молящихся, чтобы обеспечить приватность.\"}},\"services\":{\"title\":\"Доступ и услуги\",\"freeUse\":{\"title\":\"Бесплатное использование\",\"text\":\"Намазкана обычно доступна для всех пассажиров бесплатно, вне зависимости от класса обслуживания, если они соответствуют религиозным требованиям для пользования комнатой.\"},\"availability\":{\"title\":\"Доступность\",\"text\":\"Комната расположена в
