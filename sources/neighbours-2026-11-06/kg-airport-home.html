удобном месте внутри аэропорта, рядом с зонами ожидания или проходами, чтобы верующие могли легко найти её и использовать.\"},\"workingHours\":{\"title\":\"Время работы\",\"text\":\"Намазкана работает круглосуточно, обеспечивая возможность молитвы в любое время суток, особенно в крупных международных аэропортах.\"},\"conclusion\":\"Намазкана — это важная часть инфраструктуры аэропорта для мусульман, обеспечивающая комфорт и соблюдение религиозных традиций во время путешествия. Она помогает верующим поддерживать связь с их духовными обязанностями, даже находясь в международном транспортном узле.\"},\"imageAlts\":{\"prayerRoom1\":\"Интерьер намазканы\",\"prayerRoom2\":\"Намазкана в аэропорту\",\"prayer\":\"Молящийся человек\"}},\"parking\":{\"title\":\"Паркинг в аэропорту Манас\",\"automatedSystem\":{\"title\":\"Автоматизированная парковочная система\",\"items\":[\"Автоматизированная парковочная система (АПС) – это комплекс программно-аппаратных средств, предназначенных для обустройства и модернизации парковочных мест для упорядочения въездного и выездного режима с/на территорию аэропорта. Основная цель АПС – обеспечение порядка и безопасности пассажиров.\",\"В систему входят автоматические шлагбаумы, камеры и аппараты видеонаблюдения. Система видеонаблюдения регистрирует в центральной базе данных весь въезжающий и выезжающий автотранспорт.\",\"Видеосистема и IT-программа позволяют вести контроль, запись и предоставление информации на тип автотранспорта, государственный номерной знак, нахождение автотранспорта на территории аэропорта по времени, вести статистику в плане соблюдения безопасности.\"]},\"payment\":{\"title\":\"Оплата\",\"items\":[\"Для удобства оплаты паркинга вы можете воспользоваться мобильным банком MBank или оплатить через QR-код на паркомате. Просто отсканируйте QR-код с экрана вашего устройства и завершите оплату через выбранный сервис.\"]},\"howItWorks\":{\"title\":\"Как это работает:\",\"items\":[\"При заезде на парковку получите парковочный билет.\",\"Воспользуйтесь терминалом для оплаты паркинга, выбрав удобный способ — через MBank или QR-код.\",\"Оплатите парковку с помощью вашего мобильного устройства или банковской карты.\",\"После оплаты заберите чек и покиньте парковку.\"],\"conclusion\":\"Система автоматизированного паркинга позволяет быстро и удобно оплачивать услуги, избегая необходимости в длительном ожидании.\"},\"imageAlts\":{\"parking\":\"Парковка в аэропорту\"}},\"dutyFree\":{\"title\":\"Duty Free в аэропорту Манас\",\"description\":\"Откройте для себя мир выгодных покупок в зоне Duty Free аэропорта Манас! Здесь вы найдете широкий ассортимент товаров по привлекательным ценам без налогов.\",\"advantages\":{\"title\":\"Преимущества Duty Free\",\"products\":{\"title\":\"Что вас ждет в Duty Free?\",\"items\":[\"Парфюмерия и косметика – лучшие мировые бренды по выгодным ценам\",\"Алкогольные напитки – премиальные вина, виски, коньяки и ликеры\",\"Шоколад и сладости – изысканные угощения для себя и в подарок\",\"Аксессуары и сувениры – стильные товары и памятные подарки\"]},\"benefits\":{\"title\":\"Преимущества покупок в Duty Free:\",\"items\":[\"Выгодные цены без налогов\",\"Оригинальная продукция от известных брендов\",\"Удобное расположение в зале вылета\"]}},\"info\":{\"title\":\"Информация\",\"text\":\"Центр бортового питания аэропорта «Манас» – надежный поставщик качественного питания для авиакомпаний, обеспечивающий свежие блюда и высокий уровень сервиса на борту!\\n\\nПассажиры смогут совершать покупки известных брендов за наличный и безналичный расчет. Для удобства покупателей в магазине Duty Free также принимаются все основные виды банковских карт, (в том числе карты Мир), и три вида валют: Рубль, Доллар и Евро. Мы будем рады, увидеть Вас в числе наших гостей.\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"partners@airports.kg\"},\"phone\":{\"label\":\"Телефон:\",\"value\":\"+996 (312) 123-456\"}}},\"imageAlts\":{\"dutyFree\":\"Магазин Duty Free\"}},\"taxi\":{\"title\":\"Такси в аэропорту Манас\",\"description\":\"Добраться из аэропорта Манас в город легко и удобно с официальным такси. Комфортабельные автомобили и профессиональные водители обеспечат вам безопасную и быструю поездку.\\n\\nManas Airport Taxi – это современное городское такси. Главные приоритеты в работе службы – комфорт, безопасность и высокий сервис. Обслуживание и консультация ведутся на кыргызском, русском и английском языках. Все автомобили имеют брендированные шашки в виде самолета; оснащены электропакетом, стереосистемой, видеорегистратором, GPS-навигатором, аптечкой и огнетушителем. Водители проходят наркологический и медицинский осмотр.\",\"advantages\":{\"title\":\"Преимущества такси из аэропорта:\",\"items\":[\"Доступность 24/7 – такси работает круглосуточно\",\"Фиксированные тарифы без скрытых платежей\",\"Удобное расположение стоянки у выхода из терминала\",\"Комфортабельные автомобили разного класса\"]},\"howToUse\":{\"title\":\"Как воспользоваться такси?\",\"items\":[\"Найдите стойку заказа такси в зоне прилета.\",\"Выберите нужный маршрут и получите чек с фиксированной стоимостью.\",\"Следуйте к официальной стоянке такси и наслаждайтесь поездкой.\"]},\"info\":{\"title\":\"Информация\",\"text\":\"Такси аэропорта Manas Airport Taxi – надежный и удобный способ передвижения, обеспечивающий комфортную, безопасную и быструю поездку для пассажиров в любое время суток!\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"airporttaximanas@gmail.com\"},\"site\":{\"label\":\"Сайт:\",\"value\":\"manastaxi.kg\"},\"phone\":{\"label\":\"Телефон:\",\"value1\":\"+(996) 550 693 000\",\"value2\":\"+(996) 550 693 000\",\"value3\":\"+(312) 693 000\"}}},\"imageAlts\":{\"taxi\":\"Такси в аэропорту\"}},\"asmanAirlines\":{\"companyName\":\"Асман Эйрлайнс\",\"description\":{\"intro\":\"ОсОО «Авиакомпания Asman Airlines» – первая государственная авиакомпания Кыргызстана, созданная в 2023 году как 100% дочернее предприятие ОАО «Международный аэропорт Манас». Компания ставит своей целью развитие внутреннего авиасообщения, улучшение транспортной доступности регионов и укрепление позиций Кыргызстана на региональном и международном авиационных рынках.\",\"routes\":{\"title\":\"Развитие маршрутной сети\",\"text\":\"С момента начала операций в сентябре 2024 года авиакомпания выполняет регулярные рейсы из Бишкека по следующим направлениям:\\n\\nОш, Талас, Джалал Абад, Баткен, Раззаков. С ноября 2024 года добавлены маршруты в:\\n\\nКербен, Нарын, Каракол, Казарман и другие города.\\n\\nЭти рейсы способствуют укреплению связей между регионами, поддержке бизнеса и туризма, а также удовлетворению потребностей жителей отдаленных районов страны\"},\"fleet\":{\"title\":\"Флот и сервис\",\"intro\":\"Авиакомпания использует современные канадские самолеты Dash 8-Q400, которые отличаются:\",\"features\":[\"Высокой топливной эффективностью\",\"Надежностью и комфортабельностью для пассажиров\",\"Возможностью эксплуатации на коротких взлетно-посадочных полосах, что идеально подходит для региональных аэропортов Кыргызстана\"],\"conclusion\":\"На борту пассажиры могут рассчитывать на качественный сервис, комфортные условия перелета и гибкую ценовую политику.\"},\"future\":{\"title\":\"Будущее авиации Кыргызстана\",\"text\":\"ОАО «Аэропорты Кыргызстана» приглашает авиакомпании к сотрудничеству, активно расширяет маршрутную сеть и использует возможности «пятой степени свободы воздуха».\\n\\nНаши усилия направлены на развитие современной и безопасной авиационной инфраструктуры для удобства пассажиров и партнеров!\"}},\"imageAlts\":{\"routeMap\":\"Карта маршрутов Asman Airlines\",\"aircraft\":\"Самолет Asman Airlines\",\"cooperation\":\"Сотрудничество в авиации Кыргызстана\"}},\"asmanOilCompany\":{\"companyName\":\"Asman Oil Company\",\"description\":\"ОсОО Asman Oil Company – ключевое дочернее предприятие ОАО «Аэропорты Кыргызстана», основанное в 2003 году. Основная деятельность компании связана с приемом, хранением и подготовкой авиационного топлива, а также специальной жидкости для заправки воздушных судов.\",\"activities\":{\"title\":\"Деятельность и достижения\",\"cards\":[{\"title\":\"Инфраструктура\",\"content\":\"Компания располагает современными топливно-заправочными комплексами, оснащенными высокотехнологичным оборудованием. Это позволяет обеспечивать надежное хранение и своевременную подачу топлива для всех типов воздушных судов.\"},{\"title\":\"Качество\",\"content\":\"Asman Oil Company строго соблюдает требования Кыргызской Республики и международных стандартов по обеспечению безопасности полетов. Контроль качества проводится на каждом этапе технологической цепочки.\"},{\"title\":\"Обслуживание\",\"content\":\"Компания заправляет воздушные суда как отечественных, так и зарубежных авиакомпаний, обслуживая рейсы во всех аэропортах Кыргызстана. Среди клиентов – крупнейшие международные перевозчики.\"},{\"title\":\"Экология\",\"content\":\"Внедрение экологически безопасных технологий позволяет минимизировать воздействие на окружающую среду.\"},{\"title\":\"Развитие\",\"content\":\"В 2024 году компания расширила мощности по хранению топлива, увеличив объемы для обеспечения растущего пассажиропотока и грузовых перевозок.\"}]}},\"vipLounge\":{\"title\":\"VIP-обслуживание в аэропорту — Престиж, комфорт и внимание к каждой детали.\",\"description\":{\"part1\":\"Мы рады предложить нашим пассажирам эксклюзивные условия для комфортного и спокойного путешествия с использованием VIP-терминала.\",\"part2\":\"При каждом крупном международном аэропорте 24 часа в сутки работает VIP-зал. Это зона для деловых людей, ценящих свое время и комфорт.\",\"part3\":\"Безопасность, безупречность и удобство – главные приоритеты работы VIP-зала. Философия повышенного сервиса проста: профессиональный и индивидуальный подход к каждому гостю.\",\"part4\":\"Чтобы воспользоваться услугами зала, необходимо сообщить агентам данные пассажира, дату вылета или прилёта, номер рейса и произвести оплату. Обслуживание проводится по коммерческим тарифам.\"},\"advantagesTitle\":\"Преимущества VIP-обслуживания\"},\"procurement\":{\"steps\":[{\"number\":1,\"title\":\"Регистрация на портале госзакупок\",\"details\":[\"Участник должен быть зарегистрирован на официальном портале государственных закупок\"]},{\"number\":2,\"title\":\"Юридический статус\",\"details\":[\"Участник должен быть: Юридическим лицом (компания, организация)\",\"Участник должен быть: Или индивидуальным предпринимателем (ИП)\"]},{\"number\":3,\"title\":\"Пакет документов для участия\",\"details\":[\"Заявка на участие (оформляется по установленной форме)\",\"Копия свидетельства о регистрации (или перерегистрации) юрлица или ИП\",\"ИНН (идентификационный номер налогоплательщика)\",\"Справка об отсутствии задолженности перед налоговыми органами\",\"Банковская справка (об отсутствии просроченной задолженности и наличии счёта)\",\"Справка с соцфонда об отсутствии задолженности (иногда по запросу)\",\"Устав или учредительные документы (для юрлиц)\",\"Портфолио/опыт работы (если требуется)\",\"Техническое предложение (что и как будет поставлено, сделано и т.п.)\",\"Финансовое предложение (цена)\",\"Гарантийное письмо, если требуется\",\"Банковская гарантия или тендерное обеспечение, если предусмотрено\"]},{\"number\":4,\"title\":\"Соответствие критериям заказчика\",\"details\":[\"Наличие соответствующего опыта\",\"Техническая и профессиональная способность\",\"Отсутствие судебных решений о банкротстве или дисквалификации\"]},{\"number\":5,\"title\":\"Подготовка и подача тендерного предложения\",\"details\":[\"Через электронный портал\",\"В установленный срок\",\"С соблюдением всех требований из тендерной документации\"]}],\"provisions\":\"Общее положение\",\"provisionsContent\":\"Для участия в тендере в Кыргызской Республике (КР) участникам необходимо выполнить определённые требования, установленные законодательством (в частности, Законом КР «О государственных закупках»), а также конкретными условиями тендера. Ниже — общий список того, что обычно требуется:\",\"regulatoryDocs\":\"Нормативные документы\",\"regulatoryDocsContent\":\"Законодательные и внутренние документы, регулирующие процесс закупок:\",\"sampleDocs\":\"Образцы документов\",\"sampleDocsContent\":\"Шаблоны заявок, договоров и инструкций, необходимые для участия в закупках:\"},\"handling\":{\"aboutTitle\":\"О нас\",\"aboutDescription\":\"Отдел хэндлингового обслуживания (ОХО) — это штатное структурное подразделение международного аэропорта «Манас». Отдел выполняет функции представителя авиакомпаний, а также предоставляет агентские и хэндлинговые услуги. Мы организуем и координируем все этапы наземного обслуживания воздушных судов, пассажиров и грузов, обеспечивая высокий уровень сервиса и соблюдение международных стандартов безопасности.\",\"advantagesTitle\":\"Преимущества работы с нами\",\"advantages\":[{\"title\":\"Профессиональная команда\",\"description\":\"Наши специалисты имеют многолетний опыт в сфере авиационного наземного обслуживания и проходят регулярное обучение по международным стандартам.\"},{\"title\":\"24/7 обслуживание\",\"description\":\"Мы работаем круглосуточно, чтобы обеспечить оперативную поддержку и решение любых вопросов в любое время суток.\"},{\"title\":\"Индивидуальный подход\",\"description\":\"Для каждого клиента разрабатываются оптимальные решения, учитывающие специфику рейса и пожелания авиакомпании.\"},{\"title\":\"Соблюдение международных стандартов\",\"description\":\"Вся деятельность соответствует требованиям ICAO, IATA и стандартам безопасности аэропорта.\"},{\"title\":\"Оперативность и надёжность\",\"description\":\"Мы гарантируем своевременное выполнение всех операций и быстрое реагирование на любые запросы.\"}]}},\"en\":{\"translation\":{\"aboutNavigation\":{\"boardOfDirectors\":\"Board of Directors\",\"managementMembers\":\"Management Members\",\"auditCommission\":\"Internal Audit Service\",\"team\":\"Team\",\"companyPartners\":\"Company Partners\",\"finance\":\"Finance\",\"history\":\"History\",\"antiCorruption\":\"An  People with Disabilities\",\"vipLounge\":\"VIP Lounge\",\"vipLoungeService\":\"Benefits of VIP service\",\"businessLounge\":\"Business Lounge\",\"dutyFree\":\"Duty-Free\",\"taxi\":\"Taxi\",\"animalTransportation\":\"Animal Transportation\",\"police\":\"Police\",\"airports\":\"Airports\",\"internationalAirports\":\"International Airports\",\"manas\":\"Manas\",\"osh\":\"Osh\",\"jalalAbad\":\"Jalal-Abad\",\"issykKul\":\"Issyk-Kul\",\"karakol\":\"Karakol\",\"batken\":\"Batken\",\"regionalAirports\":\"Regional Airports\",\"talas\":\"Talas\",\"naryn\":\"Naryn\",\"karavan\":\"Karavan\",\"kazarman\":\"Kazarman\",\"razzakov\":\"Razzakov\",\"news\":\"News\",\"gallery\":\"Gallery\",\"contacts\":\"Contacts\"},\"aboutcompany\":{\"description\":\"Airports of Kyrgyzstan | About the company\"},\"passengers\":{\"description\":\"Airports of Kyrgyzstan | Passengers\"},\"subsidiaries\":{\"description\":\"Airports of Kyrgyzstan | Subsidiaries\",\"manasManagement\":\"Manas Management Company\",\"trainingCenter\":\"Manas Training Center\",\"asmanOil\":\"Asman Oil Company\",\"asmanAirlines\":\"Asman Airlines\",\"handling\":\"Handling\"},\"partners\":{\"description\":\"Airports of Kyrgyzstan | For partners\"},\"header\":{\"main\":\"Main\",\"bannertitle\":\"OJSC «Airports of Kyrgyzstan»\",\"bannerDescription\":\"One of the significant transport enterprises of Kyrgyzstan, a large and modern aviation complex of Central Asia for servicing air transportation.\",\"ticket\":\"Buy a ticket\",\"flightboard\":\"Flight board\"},\"footer\":{\"text\":\"One of the significant transport enterprises of Kyrgyzstan, a large and modern aviation complex of Central Asia for servicing air transportation.\",\"contacts\":\"Contacts\",\"information\":\"Information\",\"bottom\":\"The sky starts with us!\",\"bottom_text\":\"This site is the official site of JSC «Airports of Kyrgyzstan»\",\"developed\":\"Created by\",\"info_address_br\":\"Postal address of OJSC «Airports of Kyrgyzstan»\",\"info_address\":\"Kyrgyz Republic, 720062, Bishkek city, JSC «Airports of Kyrgyzstan»\"},\"home\":{\"title\":\"Home page\",\"description\":\"Airports of Kyrgyzstan\"},\"notFound\":{\"somethingWrong\":\"Oops! Something went wrong\",\"message\":\"«Once you have tasted the freedom of flight, you will always walk the earth looking at the sky» - Leonardo da Vinci\",\"status500\":\"There was an error processing your request, we are working on a solution - Please try again in a few minutes.\",\"status502\":\"There was an error on the server side. Please try again in a few minutes.\",\"backToMain\":\"Return to home page\"},\"auditComission\":{\"title\":\"Internal Audit Service\"},\"boardDirectors\":{\"title\":\"Board of Directors\"},\"companyPartners\":{\"title\":\"Company partners\",\"absent\":\"Absent\",\"more\":\"Show more\"},\"finance\":{\"title\":\"Finance\"},\"antiCorruption\":{\"title\":\"Anti-corruption policy\",\"dataNotAvailable\":\"Anti-corruption policy data is temporarily unavailable.\",\"contacts_subtitle\":\"If you become aware of any facts of corruption or conflict of interest, please report it:\",\"phone_label\":\"Hotline\",\"email_label\":\"Email\",\"address_label\":\"Address for letters\"},\"procurement\":{\"title\":\"Procurement\",\"description\":\"Description of the Procurement page\"},\"handling\":{\"title\":\"Handling\",\"description\":\"A set of operations for receiving, preparing for departure and releasing an aircraft into flight, also including many services provided to both passengers and the aircraft itself.\"},\"history\":{\"title\":\"History\"},\"membersBoards\":{\"title\":\"Members of the Board\"},\"team\":{\"title\":\"Team\"},\"flightSafety\":{\"title\":\"Flight safety\",\"indicator1\":\"300+cameras\",\"indicatorContent1\":\"CCTV throughout the airport\",\"indicator2\":\"24/7\",\"indicatorContent2\":\"24-hour airspace monitoring\",\"cartInfo\":\"Flight Safety\",\"description\":\"The Consular Service assists passengers in matters related to flight safety and provides necessary assistance in emergency situations.\"},\"generalInformation\":{\"title\":\"General information\"},\"technicalEquipment\":{\"title\":\"Technical equipment of the airport\"},\"technicalIndicators\":{\"title\":\"Production and technical indicators\"},\"bussinesslounge\":{\"title\":\"Business lounge of Kyrgyzstan airports\",\"services\":\"Services and amenities:\"},\"vipLounge\":{\"title\":\"VIP-hall\"},\"borderContrtol\":{\"title\":\"Border control\",\"description\":\"\"},\"childrenRoom\":{\"title\":\"Children's room\",\"description\":\"This is a specially equipped space designed for the comfortable stay of women with infants and young children. It provides privacy, convenience and support for parents during the trip.\"},\"consularService\":{\"title\":\"Consular Service\",\"name1\":\"Consular Service at the Airport:\",\"name2\":\"Description of Functions and Services\",\"description1\":\"The Consular Service, represented at the international airports of Kyrgyzstan, plays a key role in providing legal support and protection to citizens of their country, as well as assistance to foreign passengers.\",\"description2\":\"It functions as a link between passengers and government agencies, providing prompt assistance in situations requiring the intervention of competent diplomatic representatives.\",\"consular.title\":\"Main functions of the consular service\",\"consular.section1.title\":\"Issuance and preparation of documents\",\"consular.section1.desc\":\"The consular service assists passengers with documentation issues\",\"consular.section1.card1.title\":\"Temporary travel documents:\",\"consular.section1.card1.item1\":\"For citizens who have lost their passport abroad or are traveling without valid documents, the consular service can issue a temporary certificate of identity for return home.\",\"consular.section1.card2.title\":\"Visa consultations:\",\"consular.section1.card2.item1\":\"Assisting foreigners in obtaining information about visa requirements for entry.\",\"consular.section1.card2.item2\":\"Clarifying the need for transit visas for connecting flights.\",\"consular.section2.title\":\"Legal and judicial support\",\"consular.section2.desc\":\"Consular staff provide legal aid in difficult situations such as:\",\"consular.section2.card1.title\":\"Entry denial:\",\"consular.section2.card1.item1\":\"Passengers denied entry by border services are offered advice and assistance in resolving the situation.\",\"consular.section2.card2.title\":\"Detentions and conflicts:\",\"consular.section2.card2.item1\":\"The consulate acts as a mediator during detentions by law enforcement, notifies family members, and provides legal support.\",\"consular.section3.title\":\"Emergency assistance\",\"consular.section3.desc\":\"The consular service helps citizens in urgent, non-standard situations:\",\"consular.section3.card1.title\":\"Document loss\",\"consular.section3.card1.item1\":\"Passengers who lost their passport or were robbed receive help in restoring documents and contacting relatives or officials.\",\"consular.section3.card2.title\":\"Medical and humanitarian cases\",\"consular.section3.card2.item1\":\"In case of sudden illness, injury, or emergency, the consulate helps organize medical care and evacuation.\",\"consular.section3.card3.title\":\"Crisis situations\",\"consular.section3.card3.item1\":\"In case of natural disasters, terrorist threats, or other crises, the consular service coordinates evacuation and safe return.\",\"consular.info.title\":\"Information and consultation services\",\"consular.info.list.title\":\"The consulate provides passengers with information on the following aspects\",\"consular.info.item1\":\"Rules for entering and exiting the destination or transit country.\",\"consular.info.item2\":\"Visa requirements, baggage and personal belongings restrictions.\",\"consular.info.item3\":\"Possible risks when visiting certain countries or regions.\",\"consular.support.title\":\"Support for vulnerable passenger categories\",\"consular.support.desc\":\"The consular service gives special attention to passengers who may face difficulties during travel\",\"consular.support.card1.title\":\"Unaccompanied minors\",\"consular.support.card1.item1\":\"Assistance with handing over the child to responsible adults and monitoring transit safety.\",\"consular.support.card2.title\":\"Persons with disabilities\",\"consular.support.card2.item1\":\"Support in obtaining necessary services and information.\",\"consular.support.card3.title\":\"Elderly people\",\"consular.support.card3.item1\":\"Assistance with visa and migration issues, support in emergencies.\",\"consular.when.title\":\"When and how to contact the consular service\",\"consular.when.item1\":\"Loss or theft of documents.\",\"consular.when.item2\":\"Detention or denial of entry.\",\"consular.when.item3\":\"Urgent document processing or legal support needed.\",\"consular.when.item4\":\"Emergencies requiring immediate intervention.\",\"consular.when.desc\":\"To contact the consular service, the passenger should approach the office in the international departures or arrivals area or call the consulate using the phone number on the airport's information boards.\",\"consular.tips.title\":\"Important recommendations\",\"consular.tips.item1\":\"Always carry copies of your documents and contacts of your country's consular offices.\",\"consular.tips.item2\":\"In case of document loss, immediately contact consulate staff or police.\",\"consular.tips.item3\":\"Follow the consular service’s instructions for fast and effective resolution.\",\"consular.tips.desc\":\"The consular service is a reliable assistant in difficult situations, ensuring safe and comfortable travel for every passenger.\"},\"customsControl\":{\"title\":\"Customs control\"},\"dutyFree\":{\"title\":\"Duty-free\"},\"baggage\":{\"title\":\"Baggage\"},\"motherRoom\":{\"title\":\"Mother and Child Room\",\"description\":\"This is a specially equipped space designed for the comfortable stay of women with infants and young children. It provides privacy, convenience and support for parents during the journey.\"},\"parking\":{\"title\":\"Parking\",\"description\":\"This is a specially equipped space designed for convenient and safe placement of cars of passengers and visitors of the airport. The parking is equipped with modern technologies that ensure comfort, safety and ease of payment.\"},\"peopleDisabilities\":{\"title\":\"For persons with disabilities\"},\"police\":{\"title\":\"Police\"},\"prayerRoom\":{\"title\":\"Prayer room\"},\"preFlightInspection\":{\"title\":\"Pre-flight inspection\"},\"registration\":{\"title\":\"Registration\"},\"taxi\":{\"title\":\"Taxi\"},\"transportationAnimals\":{\"title\":\"Transportation of animals\"},\"asmanAirlines\":{\"title\":\"Airline «Asman Airlines»\",\"description\":\"This is a leading training center specializing in the training of highly qualified specialists for the aviation industry, operating within the framework of JSC Airports of Kyrgyzstan.\"},\"asmanOilCompany\":{\"title\":\"Asman Oil Company\",\"description\":\"This is a leading training center specializing in the preparation of highly qualified specialists for the aviation industry, operating within the framework of JSC «Airports of Kyrgyzstan».\"},\"manasMenegement\":{\"title\":\"Manas Management Company\",\"description\":\"This is the most important link in the logistics and cargo transportation system, operating within the framework of JSC «Airports of Kyrgyzstan».\",\"description2\":\"Since 2000, the In-Flight Catering Center of JSC «Airports of Kyrgyzstan» has been providing passengers and aircraft crews with high-quality dishes prepared in accordance with international standards.\",\"firstIndicatortext\":\"Modern center area\",\"firstIndicatorNumber\":\"3960 sq.m.\",\"secondIndicatortext\":\"The VGC is capable of servicing up to\",\"secondIndicatorNumber\":\"100K tons\",\"logisFirstIndicatortext\":\"Modern center with an area of\",\"logisFirstIndicatorNumber\":\"850 sq. m\",\"logisSecondIndicatortext\":\"International certificate\",\"logisSecondIndicatorNumber\":\"ISO 22000\"},\"trainingCenter\":{\"title\":\"Training center «Manas Training Center»\",\"description\":\"This is a leading training center specializing in the training of highly qualified specialists for the aviation industry, operating within the framework of JSC «Airports of Kyrgyzstan».\",\"description2\":\"Training at the center is carried out using advanced methods, which helps specialists to obtain skills as close to a real situation as possible.\",\"simulators1\":\"Wide range of educational services\",\"simulators2\":\"Current simulators\",\"simulators3\":\"Modern simulators\"},\"airCargoTerminal\":{\"title\":\"Air cargo terminal\",\"name1\":\"Air cargo terminal\",\"description1\":\"The air cargo terminal of Manas International Airport is a modern logistics complex that ensures efficient handling and transportation of cargo. Due to its strategic location, developed infrastructure and advanced technologies, the terminal is a key link in international and regional cargo transportation.\",\"name2\":\"Our capabilities\",\"description2\":\"Processing of various types of cargo: general, perishable, hazardous, valuable, live animals. Modern warehouses with controlled temperature conditions. Prompt clearance and forwarding of cargo, including customs support. Integrated logistics: receiving, storing, sorting, reloading and sending. Flexible terms of cooperation with airlines, forwarders and shippers.\",\"name3\":\"Infrastructure\",\"description3\":\"Spacious warehouses with modern security systems and video surveillance. Refrigerated and freezing chambers for storing perishable goods. Dangerous goods handling area in compliance with international safety standards. Automated accounting and control systems for accurate cargo tracking.\",\"name4\":\"Advantages\",\"description4\":\"Convenient location and access to major international routes. High speed of cargo handling and minimal waiting time. 24/7 operation and prompt customer support. The VGC is equipped with modern equipment and specialized machinery, which allows loading or unloading two aircraft of the Boeing 747-400, AN-124 or IL-76 type at the same time. Operates: 24/7. Cargo terminal capacity: 100,000 tons/year\"},\"cateringCenter\":{\"title\":\"In-flight catering center\",\"name1\":\"In-flight catering center\",\"description1\":\"The In-flight catering center of Manas International Airport offers airlines a wide range of services for the preparation and delivery of fresh and high-quality meals on board. We provide passengers and crews with tasty, safe and varied food that meets international standards.\",\"name2\":\"Our capabilities\",\"description2\":\"Modern technologies and strict quality control at every stage. Full production cycle: purchasing, storage, preparation, packaging and delivery. Flexible logistics and prompt delivery of in-flight meals. Development of individual menus according to airline requirements.\",\"name3\":\"Types of food\",\"description3\":\"Standard menu – balanced food for economy and business class passengers. Special diets – children's, vegetarian, halal, kosher, diabetic and other diets. VIP menu – exquisite dishes for premium service. Crew meals – optimized dishes for flight crews and staff.\",\"name4\":\"Production capacity\",\"description4\":\"Capacity up to X thousand portions per day. Modern kitchens with international certification (HACCP, ISO). Separate cooking lines for different food categories.\",\"name5\":\"Cooperation with airlines\",\"description5\":\"Individual contract terms taking into account the wishes of partners. Compliance with international aviation standards. Round-the-clock operation and the possibility of emergency flight service.\",\"name6\":\"Information\",\"description6_1\":\"JSC «Airports of Kyrgyzstan» In-Flight Catering Center is a reliable partner for airlines, providing high-quality food and excellent service on board!\",\"description6_2\":\"Companies engaged in the production and supply of in-flight catering must undergo mandatory certification for compliance with the certification requirements of the Civil Aviation Agency of the Kyrgyz Republic (according to APCR 21 «Certification of Ground Handling Organizations»)\"},\"commercialServices\":{\"title\":\"Commercial services and advertising\",\"name\":\"Commercial non-aviation services\",\"description\":\"We offer free space in the airport terminals/airport areas of 5 international airports, intended for various services.\",\"optionTitle\":\"Available services:\",\"option1\":\"Air ticket office\",\"option2\":\"Vending machine (subject to use of adjacent area)\",\"option3\":\"Massage chair (subject to use of adjacent area)\",\"option4\":\"Payment terminal (subject to use of adjacent area)\",\"option5\":\"ATM (subject to use of adjacent area)\",\"option6\":\"Coffee shop/Cafe/Bar\",\"option7\":\"Bank/savings bank/banking services\",\"option8\":\"Exchange bureau\",\"option9\":\"Pharmacy\",\"option10\":\"and much more\",\"optionTitle1\":\"Rental conditions:\",\"option11\":\"Rents for rental of commercial space at international airports are developed taking into account the regional market.\",\"option12\":\"Rental costs depend on the zoning of the facility, as well as on the volume and terms of the lease.\",\"option13\":\"Rental terms depend on commercial offers from potential clients/tenants.\",\"contactTitle\":\"Contact information for communication:\",\"email\":\"Email:\",\"phone\":\"Phone:\"},\"cooperation\":{\"title\":\"Cooperation\",\"name1\":\"Cooperation.\",\"description1\":\"OJSC 'Airports of Kyrgyzsta' invites companies and partners interested in developing business in the field of aviation, logistics, commercial real estate, advertising and other areas to long-term and mutually beneficial cooperation. JSC «Airports of Kyrgyzstan», being a key transport hub in the region, offers unique opportunities for joint work and project implementation. The airport's revenues are increased by increasing the volume of activities by attracting foreign investors and foreign airlines, in connection with which much attention is paid to the development of a favorable business environment for the enterprise.\",\"name2\":\"Long-term prospects:\",\"description2\":\"We are interested in building long-term relationships with partners, which ensures stability and business growth.\",\"name3\":\"Support at all stages:\",\"description3\":\"Our team provides full support at all stages of cooperation, from negotiations to project implementation.\",\"name4\":\"International level:\",\"description4\":\"JSC «Airports of Kyrgyzstan» complies with international standards, which allows partners to enter new markets.\",\"name5\":\"Strategic Location\",\"description5\":\"JSC «Airports of Kyrgyzstan» is located close to the capital of Kyrgyzstan, Bishkek, making it an important logistics hub not only for the country but for the entire Central Asian region. It is an ideal location for companies looking to expand their presence in the region.\",\"name6\":\"High Passenger Traffic\",\"description6\":\"JSC «Airports of Kyrgyzstan» handles over [insert number] passengers annually, which opens up significant opportunities for advertising, retail, and service delivery. We offer access to this audience through a variety of channels.\",\"name7\":\"Flexible terms of cooperation\",\"description7\":\"We offer an individual approach to each partner, taking into account the specifics of your business. Our team is ready to develop flexible terms of cooperation that will be beneficial to both parties.\",\"name8\":\"Modern infrastructure\",\"description8\":\"The airport is equipped with advanced technologies and meets international standards. This includes modern terminals, cargo facilities, security systems and logistics solutions.\",\"name9\":\"Investment Opportunities\",\"description9\":\"JSC «Airports of Kyrgyzstan» is actively developing, and we welcome investments in new projects, such as the construction of commercial real estate, the development of logistics centers, the introduction of innovative technologies and much more.\",\"name10\":\"How to start cooperation?\",\"description10\":\"If you are interested in cooperation with JSC «Airports of Kyrgyzstan», please contact us to discuss the details. We are ready to consider your proposals and develop individual conditions that will meet your business goals.\",\"link\":\"Airport Equipment Tech (Regional and International)\",\"name11\":\"Contact information for communication:\",\"address\":\"Address:\",\"contactAddress\":\"Bishkek, st. Manas, 123\"},\"fuelFillingComplex\":{\"title\":\"Fuel filling complex\",\"name1\":\"Fueling complex.\",\"description1\":\"The fueling complex of the Manas International Airport ensures uninterrupted refueling of aircraft with high-quality aviation fuel. Modern technologies, strict safety control and compliance with international standards guarantee the reliability and efficiency of fuel supply.\",\"name2\":\"Main features\",\"description2\":\"Full cycle of fuel supply: reception, storage, quality control and refueling. Automated fuel accounting and control systems. Compliance with international safety requirements and environmental standards. Flexible terms of cooperation with airlines and operators.\",\"name3\":\"Infrastructure\",\"description3\":\"Modern fuel storage tanks with a multi-level protection system. Specialized high-capacity refueling machines. Fuel quality control laboratory with certified equipment.\",\"name4\":\"Advantages\",\"description4\":\"High refueling speed and minimal aircraft servicing time. 24-hour operation and prompt response to customer requests. Flexible rates and an individual approach to each partner.\"},\"hallDelegationsPage\":{\"title\":\"Hall of official delegations\",\"name1\":\"Official Delegation Lounge\",\"description1\":\"The Official Delegations Hall of Manas International Airport is a specialized facility designed to serve high-ranking guests, government officials, diplomatic missions, as well as passengers who prefer a high level of comfort, privacy, and personalized service. We ensure fast and convenient processing of all formalities in a separate area, eliminating the need to wait in general queues.\",\"name2\":\"Information on Booking and Services\",\"description2\":\"The cost of services is determined based on the range of services provided and the passenger category.\",\"strong\":\"Services available to guests:\",\"content1\":\"- ticketing and processing of required documents\",\"content2\":\"- passport and customs control outside the general passenger flow\",\"content3\":\"- baggage handling and delivery to the aircraft or the lounge\",\"content4\":\"- TV and Wi-Fi\",\"content5\":\"- a bar with soft and alcoholic beverages\",\"content6\":\"- a relaxation room for passengers\",\"content7\":\"- a conference room for business meetings\",\"content8\":\"- transportation of passengers by comfortable minibus to the aircraft or the lounge\",\"content9\":\"- taxi arrangement with prompt dispatch, if required\",\"content10\":\"Contact us to learn more about available rates and booking conditions. We guarantee exclusive service and a high level of comfort!\"},\"personnel\":\"Personnel\",\"aviationObjects\":\"Aviation objects\",\"passengersAndTransport\":\"Passengers and transport\",\"service\":\"Service\",\"infrastructure\":\"Infrastructure\",\"events\":\"Events\",\"showMore\":\"Show more\",\"showMoreImages\":\"Show more images\",\"all\":\"All\",\"airports\":{\"InternationalAirports\":\"International airports of Kyrgyzstan\",\"description\":\"Airports of Kyrgyzstan | Airports\",\"RegionalAirports\":\"Regional airports of Kyrgyzstan\",\"flightSchedule\":\"Flight schedule\",\"currentInformation\":\"Current information on arriving and departing flights:\",\"airportNotFound\":\"Airport not found\",\"dataIsMissing\":\"No data available\",\"selectPlaceholder\":\"Select airport\",\"currentTemperature\":\"Current temperature\",\"noWeatherData\":\"No weather data available\"},\"arrivals\":\"Arrivals\",\"departures\":\"Departures\",\"flight\":\"Flight\",\"airport\":\"Route\",\"scheduledDate\":\"Planned date\",\"actualDate\":\"Actual date\",\"scheduled\":\"Planned\",\"actual\":\"Actual\",\"status\":\"Status\",\"regularity\":\"Regularity\",\"airline\":\"Airline\",\"short_flight\":\"Flt\",\"short_airport\":\"AP\",\"short_scheduledDate\":\"Sched\",\"short_actualDate\":\"Actl\",\"short_scheduled\":\"Sch\",\"short_actual\":\"Act\",\"short_status\":\"Stat\",\"short_regularity\":\"Regl\",\"news\":{\"noPicture\":\"No picture\",\"videoFromMediaSlider\":\"Video from media slider\",\"latestNews\":\"Latest news\",\"viewAll\":\"All news\",\"noPosts\":\"No news found\",\"loadError\":\"Failed to load news\",\"title\":\"News\",\"description\":\"Airports of Kyrgyzstan | News\",\"notFound\":\"Page not found\",\"pageNotFoundDescription\":\"Page description not found\"},\"gallery\":{\"title\":\"Gallery\",\"description\":\"Airports of Kyrgyzstan | Gallery\"},\"contacts\":{\"title\":\"Contacts\",\"description\":\"Airports of Kyrgyzstan | Contacts\"},\"advertising\":{\"title\":\"Advertising at the airport\",\"text\":\"Advertising opportunities at Kyrgyzstan airports will help your brand achieve maximum reach. Place your ads on strategically important sites:\",\"phoneText\":\"Call anytime\",\"readMore\":\"Read more\"},\"mainOffer\":{\"smallSlogan\":\"What you will get\",\"findoUTmore\":\"Find out more\"}},\"borderControl\":{\"steps\":[{\"number\":1,\"title\":\"Approaching the Border Control Booth\",\"description\":\"Stand in line according to the instructions and wait for your turn.\"},{\"number\":2,\"title\":\"Document Submission\",\"description\":\"Present your passport and other required documents to the border officer for inspection.\"},{\"number\":3,\"title\":\"Data Verification\",\"description\":\"The border officer checks:\",\"details\":[\"Authenticity of documents\",\"Legitimacy of entry or exit from the country\",\"Presence of visas and compliance with visa requirements.\"]},{\"number\":4,\"title\":\"Additional Questions\",\"description\":\"The officer may ask about:\",\"details\":[\"Purpose of the trip (tourism, work, study, transit)\",\"Place of stay in the destination country\",\"Planned duration of stay\"]},{\"number\":5,\"title\":\"Stamping\",\"description\":\"After successful control, the officer stamps the passport for entry or exit.\"}],\"documentReasons\":[\"Forged or damaged documents.\",\"Violation of visa rules or absence of a visa.\",\"Lack of required supporting documents regarding the purpose of the trip.\",\"Travel ban based on legal grounds (e.g., court restriction).\",\"Threat to national security or public order.\"],\"title\":\"Border Control Procedure\",\"intro\":\"Border control is conducted to verify the legality of crossing the state border and to confirm the right to enter or leave the country. This procedure is mandatory for all international travelers and is an important part of ensuring national security.\",\"section1\":\"The checkpoints 'Manas Airport' and 'Osh Airport' are subdivisions of the border control unit of the State Border Guard Service of the Kyrgyz Republic. They operate under the Constitution, the Law on the State Border of the Kyrgyz Republic, and other legal acts and international agreements to which the Kyrgyz Republic is a party.\",\"section2\":\"Border protection and the movement of persons, aircraft, goods, and other property through the state border at 'Manas Airport' and 'Osh Airport' checkpoints are carried out by border patrol units. Additionally, during the summer tourist season, border patrol units from 'Manas Airport' are deployed to the 'Issyk-Kul Airport' checkpoint to perform similar duties.\",\"section3\":\"The general operating procedure of these checkpoints — including operating hours and the schedule for processing individuals, aircraft, and cargo — is determined by joint decisions of the heads of the relevant state control bodies and the airport director.\",\"preparationTitle\":\"Preparing for Border Control\",\"preparation\":{\"documentsTitle\":\"Required documents:\",\"documentsList\":[\"National passport or foreign passport.\",\"Visa (if required by the destination country).\",\"Additional documents if needed: invitation, tourist voucher, health insurance, proof of accommodation and return ticket.\"],\"behaviorTitle\":\"Behavior:\",\"behaviorList\":[\"Remain calm and polite.\",\"Remove hats and sunglasses before approaching the border officer.\",\"Do not use mobile devices during the control process.\"]},\"stepProcessTitle\":\"Step-by-step Process\",\"docRequestTitle\":\"Possible Requests for Additional Documents\",\"docRequestSubTitle1\":\"Lack of information\",\"docRequestSubTitle2\":\"Suspicion of violating migration rules\",\"docRequestSubTitle3\":\"Special passenger categories:\",\"additionalDocs\":{\"lackInfo\":[\"Missing accommodation or return ticket.\",\"Unclear travel purpose.\"],\"suspicion\":[\"Missing accommodation or return ticket.\",\"Unclear travel purpose.\"],\"specialCategories\":[\"Unaccompanied minors (require parental consent).\",\"Persons restricted by court decisions.\"]},\"recommendations\":{\"name\":\"Checkpoints\",\"content1\":\"During border control at checkpoints of the Kyrgyz Republic, the main focus is on document verification and aircraft inspection. Particular attention is paid to individuals under investigation, links to international terrorist organizations, and detection of forged or unauthorized documents. Aircraft inspection aims to detect smuggling, weapons, ammunition, drugs, and explosives hidden in secret compartments or under cargo.\",\"content2\":\"To ensure effective border control and protection of the state border, the checkpoints at 'Manas Airport', 'Osh Airport', and 'Issyk-Kul Airport' are equipped with modern passport control booths, automated border control systems, advanced technical inspection equipment, and devices for detecting hidden individuals or goods.\",\"title\":\"Tips for successful control:\",\"list\":[\"Familiarize yourself with the entry rules of the destination country.\",\"Check passport and visa validity.\",\"Prepare your documents in advance for quick inspection.\"],\"closing\":\"We wish you a pleasant journey and a comfortable flight!\"}},\"customControl\":{\"steps\":[{\"number\":1,\"title\":\"Choosing the Lane\",\"details\":[\"If you don't have any items or currency to declare, you go through the 'green channel'.\",\"If you have items to declare, you must go through the 'red channel' and fill out a declaration form.\"]},{\"number\":2,\"title\":\"Baggage and Hand Luggage Inspection\",\"details\":[\"Items are scanned using X-ray equipment.\",\"If necessary, a manual inspection may be conducted.\",\"Customs officers have the right to request information about the origin of goods and supporting documents.\"]},{\"number\":3,\"title\":\"Approaching the Border Control Booth\",\"description\":\"Present your passport and other required documents to the border officer for inspection.\"},{\"number\":4,\"title\":\"Personal Belongings Check\",\"details\":[\"Special attention is paid to precious metals, stones, cultural valuables, and large amounts of cash.\"]}],\"documentReasons\":[\"Attempt to transport prohibited goods\",\"Failure to declare large sums of cash or valuables\",\"Refusal to comply with customs requirements\"],\"title\":\"Customs Control Procedure\",\"intro\":\"Customs control is conducted to prevent illegal import and export of goods, currency, and valuables across the country's borders. It also ensures compliance with customs legislation and protects the economic and public interests of the state.\",\"section1\":\"To protect the economic interests of the republic and implement its customs policy, the 'Manas' Customs and 'Osh' Customs Processing Center operate at Manas International Airport and Osh International Airport, directly subordinate to the State Customs Service under the Government of the Kyrgyz Republic.\",\"section2\":\"To perform its tasks, the customs is equipped with modern X-ray inspection equipment and technical means of customs control necessary to detect and prevent illegal import and export of prohibited goods.\",\"section3Title\":\"One of the main tasks is to protect the economic interests of Kyrgyzstan, expressed in fulfilling the task of forming the revenue part of the country's budget, as well as:\",\"section3\":\"- ensuring compliance with the legislation of the Kyrgyz Republic on customs;\\n- protecting the economic interests of the Kyrgyz Republic, ensuring economic security within its competence;\\n- assisting in the implementation of measures to protect state security, life and health of citizens, protection of animals and plants, environmental protection, and protection of domestic consumers' interests when importing goods into the territory of the Kyrgyz Republic.\",\"section4Title\":\"In accordance with its tasks, the customs performs the following functions:\",\"section4\":\"- controls compliance with customs legislation;\\n- organizes and conducts customs control and customs clearance of goods and vehicles at checkpoints, customs clearance points, and other places in accordance with the established procedure;\\n- controls the completeness and timeliness of customs payments;\\n- suppresses customs offenses;\\n- informs and advises interested parties on customs matters;\\n- ensures timely and complete consideration of complaints and appeals in accordance with the established procedure;\\n- performs other functions assigned to it by law.\",\"preparationTitle\":\"Preparing for Customs Control\",\"preparation\":{\"documentsTitle\":\"Documents:\",\"documentsList\":[\"Passport and boarding pass.\",\"Customs declaration (to be filled out if necessary).\",\"Documents confirming the value and legal acquisition of valuables (if necessary).\"],\"lanesTitle\":\"Lane Selection\",\"greenLane\":\"'Green channel' — for passengers who have no goods or currency to declare.\",\"redLane\":\"'Red channel' — for those who declare goods, currency, or carry prohibited or restricted items.\"},\"stepProcessTitle\":\"Step-by-Step Customs Control Process\",\"declarationRulesTitle\":\"Rules for Declaring Currency and Valuables\",\"currencyDeclaration\":\"Currency Declaration\",\"currencyDeclarationList\":[\"In most countries, you must declare amounts exceeding the established limit (usually equivalent to $10,000).\",\"Be sure to declare all cash, traveler's checks, and foreign currency.\"],\"valuablesDeclaration\":\"Valuables\",\"valuablesDeclarationList\":[\"Gold, diamonds, and other precious metals and stones must be declared if their value exceeds the established limit.\",\"When transporting jewelry purchased abroad, documents confirming their purchase and value may be required.\"],\"specialGoodsDeclaration\":\"Special Goods\",\"specialGoodsDeclarationList\":[\"Cultural valuables (paintings, antiques) require permits for export or import.\",\"Certain types of weapons, explosives, and dual-use goods are restricted or prohibited from being transported.\"],\"denialReasonsTitle\":\"Reasons for Denial of Customs Clearance\",\"recommendationsTitle\":\"Recommendations for Successful Control:\",\"recommendationsList\":[\"Familiarize yourself in advance with the customs rules of the departure and destination countries.\",\"Honestly declare currency and valuables.\",\"Keep documents for expensive purchases and cultural valuables to confirm their legality.\",\"Follow the rules and instructions of customs officers.\"],\"closing\":\"Going through customs control is a simple procedure if you follow all the rules and laws. We wish you a smooth and hassle-free journey!\",\"imageAlt1\":\"Customs control\",\"imageAlt2\":\"Flight attendant\",\"imageAlt3\":\"Customs control\"},\"luggage\":{\"title\":\"Passenger Luggage\",\"basicsTitle\":\"Basics\",\"mainRequirements\":{\"title\":\"Main Requirements\",\"description\":\"All luggage carried by passengers, including cabin luggage, must be presented during flight check-in due to flight safety requirements. Luggage that the airline accepts for transportation under its responsibility for safekeeping is labeled with a baggage tag and transported in the aircraft's baggage compartment.\",\"list\":[\"Luggage parameters depend on the airline's policy and service class.\",\"For checked luggage, dimensions typically should not exceed 158 cm in total (length + width + height) with weight up to 20-23 kg.\",\"Hand luggage usually shouldn't exceed dimensions of 55 x 40 x 20 cm and weight of 5-10 kg.\"]},\"freeAllowance\":{\"title\":\"Free Baggage Allowance\",\"systemsTitle\":\"Baggage Allowance Systems\",\"systemsList\":[\"Weight system (weight concept) (must be confirmed when purchasing the ticket)\",\"Piece system (piece concept) (must be confirmed when purchasing the ticket)\"],\"adultsChildrenTitle\":\"For Adults and Children\",\"adultsChildrenList\":[\"First class - 40 kg\",\"Business class - 30 kg\",\"Economy class - 20 kg\",\"For children under 2 years traveling without a separate seat, the free baggage allowance is 10 kg.\"]},\"luggageContent\":{\"title\":\"Luggage Contents\",\"description\":\"\u003cstrong\u003eValuables:\u003c/strong\u003e documents, money, jewelry, laptops and other electronic devices are better transported in hand luggage.\u003cbr /\u003e\u003cbr /\u003ePassengers of all classes \u003cstrong\u003eare allowed to carry\u003c/strong\u003e unregistered luggage weighing up to 10 kg in the cabin, which is included in the total free baggage allowance (must be confirmed when purchasing the ticket). Its total dimensions should not exceed 115 cm.\u003cbr /\u003ePayment for \u003cstrong\u003eexcess baggage\u003c/strong\u003e is made according to baggage tariffs effective on the day of issuing the paid baggage receipt, which is given to the passenger upon payment at the airline's ticket office.\",\"allowedItemsTitle\":\"Allowed but Restricted Items\",\"allowedItemsList\":[\"Liquids, gels and aerosols in hand luggage must be packed in containers of no more than 100 ml each, with total volume not exceeding 1 liter.\",\"Sports equipment and musical instruments are allowed as special or oversized baggage.\"],\"prohibitedItemsTitle\":\"Prohibited Items\",\"prohibitedItemsList\":[\"Ammunition, weapons and explosives.\",\"Flammable liquids and toxic substances.\",\"Chemicals and corrosive materials.\"]},\"packing\":{\"title\":\"Packing Luggage\",\"description\":{\"p1\":\"Dear Travelers!\",\"p2\":\"We are pleased to inform you that on July 1, 2025, we opened three baggage wrapping points at Bishkek International Airport.\",\"p3\":\"Here, you can not only wrap your luggage in our branded protective film, but also take advantage of our baggage protection service and purchase essential travel accessories.\",\"p4\":\"We look forward to welcoming you at our service counters at Manas International Airport.\",\"p5\":\"We wish you a pleasant journey!\",\"contacts\":\"Contact Us:\",\"phone\":\"0703 18 84 88\",\"emailLabel\":\"Email:\"}},\"marking\":{\"title\":\"Marking and Identification\",\"list\":[\"Attach bright tags with your name, phone number and email address to your luggage.\",\"Use covers with unique designs or stickers for quick identification of your luggage on the conveyor belt.\"]},\"oversizedLuggage\":{\"title\":\"Oversized Luggage Handling\",\"categoriesTitle\":\"Oversized Luggage Categories\",\"categoriesList\":[\"Sports equipment (skis, bicycles, snowboards).\",\"Large musical instruments.\",\"Baby strollers, wheelchairs.\"]},\"oversizedLuggageSteps\":[{\"number\":1,\"description\":\"Notify the airline in advance about oversized luggage.\"},{\"number\":2,\"description\":\"Check in at specially designated areas for oversized luggage.\"},{\"number\":3,\"description\":\"Ensure proper tagging and additional protective packaging.\"}],\"lostLuggage\":{\"title\":\"Actions for Lost or Damaged Luggage\",\"lostAndFoundTitle\":\"Lost and Found Service:\",\"lostAndFoundList\":[\"Located in the baggage claim area or near the exits.\",\"Assists in locating lost luggage and processing compensation documents.\"],\"algorithmTitle\":\"Action Algorithm\"},\"lostLuggageSteps\":[{\"number\":1,\"description\":\"Contact service staff and file a report about lost or damaged luggage.\"},{\"number\":2,\"description\":\"Provide documents: boarding pass and baggage receipt.\"},{\"number\":3,\"description\":\"Take photos of damage or condition of received luggage to support your claim.\"},{\"number\":4,\"description\":\"In case of lost luggage, the airline must organize its search and pay compensation if not found within 21 days.\"}],\"compensation\":{\"title\":\"Compensation\",\"list\":[\"According to international standards (Montreal Convention), maximum compensation for lost luggage can be up to 1,131 SDR (Special Drawing Rights).\",\"In Kyrgyzstan's airports, compensation for lost luggage is regulated by international agreements signed by the country, as well as internal airline rules. The main document regulating compensation for lost luggage is the Convention on International Civil Aviation (Montreal Convention) of 1999, which specifies the terms and amount of compensation.\"],\"montrealConventionTitle\":\"Compensation under Montreal Convention:\",\"maxAmountTitle\":\"Maximum compensation amount\",\"maxAmountList\":[\"Compensation for lost luggage can be up to 1,131 SDR (Special Drawing Rights). As of January 2025, this is approximately equivalent to $1,500-1,600 USD depending on exchange rates.\"],\"paymentProcedureTitle\":\"Payment procedure\",\"paymentProcedureList\":[\"The airline must pay compensation within 21 days if the luggage is not found during this time.\",\"Compensation may be reduced if the passenger violated baggage packing rules or transported prohibited items.\"],\"howToGetTitle\":\"How to get compensation for lost luggage?\",\"applicationTitle\":\"Application\",\"applicationList\":[\"The passenger must file a claim with the Lost and Found service at the airport immediately upon discovering the loss.\"],\"documentsTitle\":\"Documents\",\"documentsList\":[\"You must provide boarding pass, baggage receipt and other documents that can confirm luggage loss.\"],\"damageAssessmentTitle\":\"Damage assessment\",\"damageAssessmentList\":[\"If luggage is not found within 21 days, the airline assesses the damage and pays compensation according to established rules.\"],\"delayOrReductionTitle\":\"Compensation delay or reduction:\",\"delayOrReductionList\":[\"In some cases compensation may be partial if the passenger violated packing rules, transported prohibited items or didn't notify the airline within the established timeframe.\"],\"disclaimer\":\"If the passenger disagrees with the compensation amount, they may file a complaint or go to court to resolve the dispute.\"},\"importantInfo\":{\"title\":\"Important Information\",\"list\":[\"Every passenger, except children under 2 years, has the right to transport free baggage according to service standards established by airlines.\",\"Children traveling on separate reserved seats can carry the same amount of hand luggage and checked baggage as adult passengers.\",\"The free baggage allowance depends on the type of aircraft, flight direction and service class. We strongly recommend checking hand luggage rules with airlines operating your route on their websites.\",\"Free allowance doesn't apply to certain items: musical instruments (transported in cabin on separate ticket) and animals. Transportation of such excess baggage is paid according to tariff application rules, regardless of other items transported as baggage and hand luggage.\",\"Baggage dimensions include handles and wheels.\",\"The passenger is responsible for unregistered items.\",\"The passenger receives a baggage tag as confirmation that checked baggage has been accepted for transportation.\",\"The carrier may refuse transportation of checked baggage that is improperly packed or unsuitable for air transportation due to its weight, size or origin.\",\"Depending on weight, size or origin, some categories of checked baggage may only be accepted for transportation with prior carrier approval (e.g.: wheelchairs and other assistive devices powered by lithium batteries, animals, oversized baggage, etc.)\",\"Baggage must be securely closed to prevent opening during flight.\",\"We strongly recommend verifying the baggage tag number with the number on your suitcase upon arrival to prevent mix-ups with similar luggage.\"]},\"recommendations\":{\"title\":\"Recommendations for Safe Baggage Transportation\",\"beforeFlightTitle\":\"Before Flight\",\"beforeFlightList\":[\"Check the list of prohibited items and confirm packing rules with your airline.\",\"Prepare a list of luggage contents in case of loss.\",\"Take photos of your suitcase before departure.\"],\"atAirportTitle\":\"At Airport\",\"atAirportList\":[\"When arriving early, check your luggage and pass security control without rush.\",\"Ensure proper luggage marking and safekeeping of baggage receipt.\"],\"afterArrivalTitle\":\"After Arrival\",\"afterArrivalList\":[\"Inspect luggage for damage or tampering.\",\"Immediately report any problems to Lost and Found service.\"],\"additionalMeasuresTitle\":\"Additional Measures\",\"additionalMeasuresList\":[\"Consider purchasing baggage insurance when transporting valuables.\",\"If needed, use luggage wrapping services for additional protection.\"],\"closing\":\"Following these recommendations will ensure comfortable and safe travel without baggage problems.\"},\"imageAlt1\":\"Luggage\",\"imageAlt2\":\"Luggage\",\"imageAlt3\":\"Aircraft\",\"imageAlt4\":\"LostAndFound\",\"imageAlt5\":\"Woman\"},\"peopleDisabilities\":{\"title\":\"Services for people with disabilities at airports in Kyrgyzstan\",\"rampsAndElevators\":{\"title\":\"Ramps and elevators\",\"list\":[\"All main areas of the airport are equipped with ramps for people with disabilities, as well as elevators providing access to various zones (e.g., terminals, exits, and restrooms).\",\"Ambulift for boarding/disembarking passengers with reduced mobility to/from the aircraft.\",\"Wide doors and corridors: For convenient movement of passengers with wheelchairs or other mobility aids, the airport provides wide doors and corridors.\",\"Wheelchairs available.\"]},\"specialRestrooms\":{\"title\":\"Special restrooms\",\"list\":[\"Airports have restrooms specially equipped for people with disabilities, featuring additional handrails and spacious layouts for wheelchair maneuverability.\"]},\"restAreas\":{\"title\":\"Rest and waiting areas\",\"list\":[\"The airports provide rest areas designed for people with disabilities, offering comfortable seating and accessibility features.\",\"Special parking spaces are located on the eastern side of parking zone C - this is the parking area closest to the passenger terminal complex.\"]},\"instructionsTitle\":\"Guidelines for passengers with disabilities\",\"steps\":[{\"number\":1,\"title\":\"Advance notification\",\"details\":[\"Passengers with disabilities or limited physical abilities should notify the airline in advance about their need for special assistance. This can be done when booking tickets or several hours before the flight so the airline can prepare the necessary support.\"]},{\"number\":2,\"title\":\"Early arrival at the airport\",\"details\":[\"Passengers with disabilities are advised to arrive at the airport several hours before departure to allow sufficient time for all procedures, including check-in, security screening, and boarding. Typically, arriving at least 2-3 hours before the flight is recommended.\"]},{\"number\":3,\"title\":\"Escort services\",\"details\":[\"Escort services provide assistance with movement through the airport, from check-in to boarding the aircraft or disembarking. To use this service, passengers must also notify the airline in advance.\"]},{\"number\":4,\"title\":\"Use of wheelchairs\",\"details\":[\"If a passenger cannot move independently, airports provide free wheelchairs for movement within the airport. If a passenger travels with their own wheelchair, it will be safely stored in the aircraft's baggage compartment.\"]},{\"number\":5,\"title\":\"Boarding and disembarking using special equipment\",\"details\":[\"Special lifts or platforms may be used for boarding and disembarking passengers with disabilities, facilitating smooth transfers between wheelchairs and aircraft seats.\"]}],\"behaviorRulesTitle\":\"Behavior guidelines for passengers with disabilities\",\"orderRules\":{\"title\":\"Following procedures\",\"list\":[\"Passengers with disabilities must comply with general safety rules, such as seatbelt requirements, participating in safety briefings when necessary, and following instructions from airport staff and crew members.\"]},\"assistanceRules\":{\"title\":\"Escort and assistance\",\"list\":[\"During their time at the airport or during boarding/disembarking, passengers with disabilities may use escort services if needed. It's important to inform staff in advance about requiring this assistance.\"]},\"mobilityRules\":{\"title\":\"Mobility in security areas\",\"list\":[\"Passengers with disabilities should inform security personnel about their limited mobility. This helps expedite the security screening process, including using specially designated lanes for such passengers.\"]},\"recommendations\":{\"description\":\"Airports in Kyrgyzstan strive to provide maximum comfort and accessibility for people with disabilities by offering assistance services, accessible infrastructure, and equipment for safe and convenient travel. It's important to notify about special assistance needs in advance and follow recommendations to ensure the most comfortable journey possible.\",\"attention\":\"Important: When booking and purchasing airline tickets, be sure to specify what special services and assistance you'll require at the airport and during the flight. These service requirements should be communicated to the airline or ticket agent when booking your tickets, but no later than 48 hours before departure.\",\"callText\":\"Call anytime\",\"phoneNumber\":\"+996 312 / 69 31 09\"},\"imageAlt1\":\"Ramp\",\"imageAlt2\":\"People with disabilities\",\"imageAlt3\":\"People\"},\"transportationAnimals\":{\"title\":\"Rules for transporting animals at airports in Kyrgyzstan\",\"transportTypes\":{\"title\":\"Types of animal transportation\",\"inCabin\":{\"title\":\"In the aircraft cabin\",\"list\":[\"Small pets such as cats, dogs, and parrots can usually be transported in the cabin with the owner if their weight (including cage or container) does not exceed a certain limit set by the airline (most often up to 8-10 kg).\"]},\"inBaggage\":{\"title\":\"In the baggage compartment\",\"list\":[\"Large animals, as well as those that cannot fit in the cabin, are usually transported in the baggage compartment. In this case, the animals are placed in a special secure container that ensures their safety during the flight.\"]}},\"transportConditions\":{\"title\":\"Transportation conditions\",\"container\":{\"title\":\"Container or cage\",\"list\":[\"Animals must be placed in special containers or cages that comply with IATA (International Air Transport Association) standards. The container must be sturdy, well-ventilated, and appropriately sized for the animal. The animal should be able to stand, lie down, and turn around in the cage.\"]},\"packaging\":{\"title\":\"Packaging for transportation\",\"list\":[\"Animal transport containers must have special door locking systems, be leak-proof, and free from damage that could injure the animal.\"]}},\"safetyRequirements\":{\"title\":\"Safety requirements\",\"windows\":{\"title\":\"Container windows must be sturdy\",\"list\":[\"Container windows and grilles must be sturdy to prevent the animal from damaging the container during travel.\"]},\"markers\":{\"title\":\"Warning labels\",\"list\":[\"The container must display the owner's information as well as markings indicating that it contains a live animal.\"]}},\"transportRestrictions\":{\"title\":\"Animal transportation types\",\"list\":[\"Some airlines may not transport certain types of animals (such as exotic or dangerous animals) or may impose additional transportation restrictions.\",\"There may also be limits on the number of animals that can be transported on a single flight, so it is recommended to check all details with the airline in advance.\"]},\"requiredDocuments\":{\"title\":\"Required documents for animal transportation\",\"animalPassport\":{\"title\":\"Animal passport\",\"list\":[\"For international flights, the animal must have a passport with vaccination records. The passport is issued by a veterinarian. The passport must include information about rabies vaccinations and other vaccinations that may be required for entry into the destination country.\",\"For trips abroad, an international veterinary certificate is required, confirming that the animal is not infected with diseases dangerous to human health.\"]},\"vetCertificate\":{\"title\":\"Veterinary certificate\",\"list\":[\"International animal transportation requires a veterinary certificate issued by the state veterinary service. This certificate confirms that the animal is healthy and ready for travel.\",\"For domestic flights, the certificate is not always required, but the airline may request other documents confirming the animal's health.\"]},\"quarantineDocs\":{\"title\":\"Quarantine documents\",\"list\":[\"In some cases, additional documents regarding quarantine requirements may be needed to import an animal into a country (for example, for exotic animals or new species that may be permitted into the country).\"]},\"vaccinations\":{\"title\":\"Vaccinations\",\"list\":[\"The animal must be vaccinated against diseases such as rabies, and the vaccinations must be administered in advance (usually at least 21 days before the trip).\"]},\"otherDocs\":{\"title\":\"Other documents\",\"list\":[\"Some countries may require additional documents such as health certificates, certificates confirming the absence of infectious diseases, and other documents.\"]}},\"whereToGetDocs\":{\"title\":\"Where to get documents\",\"passport\":{\"title\":\"Veterinary passport and certificate\",\"list\":[\"Veterinary certificates and required vaccinations for international transportation are issued by the state veterinary service or certified veterinary clinics.\"]},\"healthCertificate\":{\"title\":\"International animal health certificate\",\"list\":[\"Can be obtained from the state veterinary service or international veterinary clinics that are licensed to issue such documents.\"]}},\"transportRules\":{\"title\":\"Transportation rules\",\"rule1\":{\"list\":[\"Animals and birds are accepted for air transportation by prior agreement with the airline and are transported in the baggage compartment of the aircraft.\",\"When booking transportation, the passenger must inform the airline about the number of animals and birds being transported.\",\"When arranging the transportation of animals/birds, the passenger must provide the airline with a veterinary certificate issued by a competent government institution and other documents required by the veterinary authorities of the destination country.\"]},\"rule2\":{\"list\":[\"Animals and birds are accepted for transportation on the condition that the passenger/shipper assumes full responsibility for any consequences that may arise during transportation.\",\"Pets (birds) during air transport must be placed in a sturdy container (cage) that provides the necessary comfort during transportation, with air access and a reliable lock. The bottom of the container (cage) must be solid, waterproof, and covered with absorbent material. The container (cage) must prevent spillage of absorbent material. The bird cage must be covered with a dense, light-proof fabric.\"]}},\"recommendations\":{\"title\":\"Recommendations for passengers traveling with animals\",\"notification\":{\"title\":\"Advance notification\",\"list\":[\"It is recommended to notify the airline about animal transportation when booking tickets or in advance to ensure space for animals on the flight.\"]},\"planning\":{\"title\":\"Trip planning\",\"list\":[\"Ensure the safety and comfort of your animal during travel. Make sure the container meets standards and that the animal is vaccinated and free from diseases that could affect its health during the flight.\"]},\"checkConditions\":{\"title\":\"Checking transportation conditions\",\"list\":[\"Familiarize yourself with your airline's animal transportation rules, as different airlines may have different requirements and restrictions for transporting animals.\"]},\"conclusion\":\"Thus, for safe and comfortable animal transportation, it is important to comply with all requirements and prepare the necessary documents in advance.\"},\"imageAlt1\":\"Animals at the airport\",\"imageAlt2\":\"Animals in container\",\"imageAlt3\":\"Documents for animals\",\"imageAlt4\":\"Traveling with animals\"},\"police\":{\"title\":\"Police at the Airport\",\"mainDuties\":{\"title\":\"Main Duties of the Police at the Airport\",\"publicOrder\":{\"title\":\"Maintaining Public Order\",\"list\":[\"The police ensure public order at the airport, including monitoring the behavior of passengers and visitors, preventing offenses, and maintaining a safe environment.\"]},\"safetyControl\":{\"title\":\"Security Control\",\"list\":[\"Police enforce all airport safety rules, monitor the behavior of passengers and staff, and provide protection against terrorist threats and criminal actions.\",\"Police cooperate with other security services—airport security, airline security teams, and customs authorities—to prevent smuggling of prohibited items.\"]}},\"crimePrevention\":{\"title\":\"Prevention of Violations and Crimes\",\"list\":[\"Police prevent theft, fraud, violence, hooliganism, illegal trading, and other violations that occur at the airport.\",\"They also investigate incidents such as luggage theft or property damage.\"]},\"documentsCheck\":{\"title\":\"Document Check and Identification\",\"list\":[\"Police verify the legality of presence at the airport, check passenger documents, and may inspect foreign nationals.\",\"They may also check for forged documents or visa/immigration violations.\"]},\"emergencyAssistance\":{\"title\":\"Assistance in Emergencies\",\"list\":[\"In emergencies (e.g., terrorist threats, riots, natural disasters), police take steps to protect people, organize evacuation, and coordinate with other emergency services.\",\"Police also ensure safety in major accidents such as aircraft or ground transport incidents.\"]},\"rightsProtection\":{\"title\":\"Protection of Passengers' and Staff Rights\",\"list\":[\"Police assist in resolving disputes between passengers and airport staff or third parties.\",\"When passengers' rights are violated (e.g., aggression from others), police restore order.\"]},\"perimeterSecurity\":{\"title\":\"Securing Perimeter and Key Airport Areas\",\"list\":[\"Police protect critical airport areas such as runways, terminals, warehouses, screening zones, and other infrastructure vulnerable to criminal acts.\"]},\"assistance\":{\"title\":\"Assistance Provided by Police\",\"documentsHelp\":{\"title\":\"Help with Lost Documents\",\"list\":[\"If a passenger loses important documents like a passport or ticket, the police help recover or resolve issues related to identity theft or access.\"]},\"conflictResolution\":{\"title\":\"Resolving Conflicts\",\"list\":[\"Police help settle disputes between passengers or between passengers and airport employees.\",\"In cases of aggression or threats, police intervene to ensure public order.\"]},\"incidentInvestigation\":{\"title\":\"Investigating Incidents\",\"list\":[\"Police investigate thefts, lost luggage, or other events, helping victims recover items or clarify circumstances.\",\"They may also assist customs in smuggling or illegal import investigations.\"]},\"evacuationAssistance\":{\"title\":\"Evacuation and Safety Assistance\",\"list\":[\"In emergencies (fire, terrorism, etc.), police organize evacuations and ensure safety.\",\"They work with other services to maintain order and protect people during evacuations.\"]}},\"safetyConsulting\":{\"title\":\"Safety Consulting and Support\",\"list\":[\"Police provide passengers with safety advice, including airport behavior rules, proper baggage packing, and other tips to avoid violations.\",\"They also offer legal explanations or support when needed.\"]},\"conclusion\":{\"description\":\"Police at the airport play a vital role in maintaining public order and safety. They monitor the situation, prevent crimes, assist passengers, and resolve conflicts. The police actively cooperate with other security services to ensure a safe and comfortable environment for everyone at the airport.\\n\\nIn case of problems, you may contact the duty unit of the Transport Internal Affairs Directorate (TIAD) of the Ministry of Internal Affairs of the Kyrgyz Republic. Timely contact allows for effective investigation, crime prevention, and compensation for damages.\",\"callText\":\"Phone:\",\"phoneNumber\":\"+996 (312) 69-34-02\"},\"imageAlts\":{\"image1\":\"Police at the airport\",\"image2\":\"Police officers\",\"image3\":\"Police assisting passengers\"}},\"preFlightInspection\":{\"title\":\"Pre-flight Screening: Rules and Procedures\",\"description\":\"Pre-flight screening is a mandatory procedure at airports of the Kyrgyz Republic aimed at ensuring the safety of passengers, crew, and aircraft. The screening is conducted in accordance with international aviation security standards and national legislation.\",\"goals\":{\"title\":\"Objectives of Pre-flight Screening:\",\"items\":[\"Ensuring passenger safety and preventing threats on board\",\"Detection and removal of prohibited items and substances\",\"Preventing unauthorized access to aircraft and aviation facilities\"]},\"process\":{\"title\":\"Screening Process\",\"preparation\":{\"title\":\"Preparation for Screening:\",\"steps\":[\"Before entering the control zone, passengers are asked to prepare their boarding pass and ID.\",\"All metal objects, large electronics (laptops, tablets), and liquids must be removed from carry-on baggage for separate scanning.\",\"Outerwear and hats must also be removed and screened.\"]},\"procedure\":{\"title\":\"Screening Procedure:\",\"steps\":[\"Carry-on and personal items are screened using X-ray scanners.\",\"Passengers pass through a metal detector; if it is triggered, additional screening is performed.\",\"Passengers with disabilities or medical implants are screened with consideration of their needs.\"]}},\"prohibited\":{\"title\":\"Prohibited Items and Substances\",\"items\":[{\"title\":\"Weapons\",\"description\":\"Pistols, firearms (all types); Toy guns and replicas and imitations of weapons that can be mistaken for real ones; Components of firearms (except for some, such as telescopic sights); Airguns, including shotguns, compressed air pistols, or CO₂ pistols; Signal flares and starting pistols; bows, crossbows, arrows; harpoon guns, spearguns; slingshots and slings; \"},{\"title\":\"Sharp and Cutting Objects\",\"description\":\"Knives, scissors, blades, ice picks, razor blades, swords and sabres, etc.; More specifically: knives with blades longer than 6 cm; scissors with blades longer than 6 cm (measured from the center of the hinge) are prohibited.; Tools with such sharpened elements are also prohibited: screwdrivers, chisels, etc.\"},{\"title\":\"Explosives\",\"description\":\"Ammunition, blasting caps, detonators and fuses, mines, grenades, etc.; Certain explosive and incendiary substances are prohibited in checked baggage for flight safety reasons;\"},{\"title\":\"Excess Liquids\",\"description\":\"This prohibition applies to liquids, tubes, containers, and other storage devices for personal hygiene products, cosmetics, medications, as well as paints, adhesives, etc., if they are in carry-on baggage. Exceptions: baby food, breast milk, and medications required by passengers during the flight.\"}]},\"exceptions\":{\"title\":\"Screening Exceptions:\",\"description\":\"Pre-flight screening is mandatory for all passengers. However, diplomatic and official representatives of certain countries may undergo simplified screening in accordance with international agreements and diplomatic privileges.\",\"denialReasons\":{\"title\":\"Reasons for Denial of Boarding\",\"items\":[\"Detection of prohibited items.\",\"Passenger refuses to undergo screening or comply with security instructions.\",\"Behavior that raises reasonable suspicion.\"]},\"tips\":{\"title\":\"Tips for a Smooth Screening Process\",\"items\":[\"Arrive at the airport early to avoid rushing.\",\"Prepare liquids, electronics, and metal objects in advance for quick screening.\",\"Follow the instructions of security personnel.\"]},\"conclusion\":\"Pre-flight screening is not just a formality, but an important step in protecting every passenger. Thank you for your understanding and cooperation in ensuring safe flights!\"},\"imageAlts\":{\"preflight1\":\"Pre-flight Screening\",\"preflight2\":\"Screening Exceptions\",\"gun\":\"Weapons\",\"knife\":\"Sharp and Cutting Objects\",\"boom\":\"Explosives\",\"liquid\":\"Excess Liquids\"}},\"registration\":{\"title\":\"Passenger Check-in Procedure: \u003cbr\u003e Step-by-Step Guide\",\"description\":\"Check-in is an essential pre-flight step that includes confirming your booking, receiving a boarding pass, and checking in luggage. The procedure may vary depending on the flight type (domestic or international),
