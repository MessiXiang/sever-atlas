енин камсыз кылат.\"]},\"planning\":{\"title\":\"Сапарды пландоо\",\"list\":[\"Жаныбар үчүн коопсуз жана ыңгайлуу шарттарды алдын ала камсыз кылыңыз. Контейнер талаптарга жооп берерине, жаныбар эмделгенине жана ден соолугу жакшы экенине ынаныңыз.\"]},\"checkConditions\":{\"title\":\"Ташуу шарттарын тактоо\",\"list\":[\"Ар кандай авиакомпанияларда жаныбарларды ташууга өз алдынча эрежелер болушу мүмкүн. Ошондуктан алдын ала таанышып алыңыз.\"]},\"conclusion\":\"Жаныбарды коопсуз жана ыңгайлуу ташуу үчүн бардык талаптарды сактоо жана керектүү документтерди алдын ала даярдоо маанилүү.\"},\"imageAlt1\":\"Аэропорттогу жаныбарлар\",\"imageAlt2\":\"Контейнердеги жаныбарлар\",\"imageAlt3\":\"Жаныбарлар үчүн документтер\",\"imageAlt4\":\"Жаныбарлар менен саякат\"},\"police\":{\"title\":\"Аэропорттогу милиция\",\"mainDuties\":{\"title\":\"Аэропорттогу милициянын негизги милдеттери\",\"publicOrder\":{\"title\":\"Коомдук тартипти камсыз кылуу\",\"list\":[\"Милиция аэропорт аймагында коомдук тартипти сактоого көзөмөл кылат. Бул жүргүнчүлөрдүн жана башка келген адамдардын жүрүм-турумун көзөмөлдөөнү, мыйзам бузуулардын алдын алууну жана коопсуз чөйрөнү камсыздоону камтыйт.\"]},\"safetyControl\":{\"title\":\"Коопсуздукту көзөмөлдөө\",\"list\":[\"Милиция аэропорттогу бардык коопсуздук эрежелеринин аткарылышын камсыздайт, жүргүнчүлөрдүн жана кызматкерлердин жүрүм-турумун көзөмөлдөйт, террордук коркунучтардан жана башка кылмыштуу аракеттерден коргойт.\",\"Милиция башка коопсуздук кызматтары менен кызматташат — аэропорт күзөтү, авиакомпаниялардын коопсуздук кызматтары, бажы органдары — тыюу салынган буюмдарды жана заттарды ташып кирүүнүн алдын алуу үчүн.\"]}},\"crimePrevention\":{\"title\":\"Кылмыштардын жана мыйзам бузуулардын алдын алуу\",\"list\":[\"Милиция уурулук, алдамчылык, зомбулук, бейбаштык, мыйзамсыз соода жана башка укук бузууларды токтотуу менен алектенет.\",\"Ошондой эле, милиция жүк жоготуу, мүлккө зыян келтирүү жана башка окуяларды иликтөө менен алектенет.\"]},\"documentsCheck\":{\"title\":\"Документтерди текшерүү жана инсандыгын аныктоо\",\"list\":[\"Милиция аэропорт аймагындагы адамдардын мыйзамдуу жүрүшүн көзөмөлдөйт, жүргүнчүлөрдүн документтерин текшерет, чет өлкөлүктөрдү да көзөмөлгө алат.\",\"Керек учурда жасалма документтерди же визалык мыйзам бузууларды текшерүү иштерин жүргүзөт.\"]},\"emergencyAssistance\":{\"title\":\"Кырдаалдарда жардам көрсөтүү\",\"list\":[\"Террордук коркунуч, массалык баш аламандык, табигый кырсыктар учурунда милиция адамдардын коопсуздугун камсыздайт, эвакуацияны уюштурат жана башка кызматтар менен биргеликте иш жүргүзөт.\",\"Ошондой эле, ири кырсыктарда, мисалы, учак кырсыгында же транспорттук окуяларда коопсуздукту камсыз кылат.\"]},\"rightsProtection\":{\"title\":\"Жүргүнчүлөрдүн жана кызматкерлердин укуктарын коргоо\",\"list\":[\"Милиция жүргүнчүлөр менен аэропорт кызматкерлеринин ортосундагы чатактарды жөнгө салууга жардам берет.\",\"Эгер жүргүнчүлөрдүн укуктары бузулса (мисалы, башкалардан зомбулук көргөндө), милиция тартипти калыбына келтирүү чараларын көрөт.\"]},\"perimeterSecurity\":{\"title\":\"Аэропорттогу маанилүү объектилерди коргоо\",\"list\":[\"Милиция учуп-конуу тилкелери, терминал имараттары, кампалар, текшерүү аймактары сыяктуу маанилүү объектилерди коргойт.\"]},\"assistance\":{\"title\":\"Милиция көрсөткөн жардам\",\"documentsHelp\":{\"title\":\"Документтерди жоготууда жардам берүү\",\"list\":[\"Эгер жүргүнчү паспорт же билет сыяктуу маанилүү документтерди жоготсо, милиция аларды калыбына келтирүүдө жардам берет.\"]},\"conflictResolution\":{\"title\":\"Чатактарды жөнгө салуу\",\"list\":[\"Милиция жүргүнчүлөр жана кызматкерлер ортосундагы кагылышууларды чечүүгө жардам берет.\",\"Зомбулук же кооптуу жүрүм-турум болгондо тартипти калыбына келтирет.\"]},\"incidentInvestigation\":{\"title\":\"Окуяларды тергөө\",\"list\":[\"Милиция жоголгон жүктөр жана башка инциденттер боюнча тергөө жүргүзөт, жоголгон буюмдарды кайтарууга жардам берет.\",\"Контрабанда же мыйзамсыз жүктөрдү алып кирүү учурларын бажы органдары менен бирге иликтейт.\"]},\"evacuationAssistance\":{\"title\":\"Эвакуация жана коопсуздук уюштуруу\",\"list\":[\"Кооптуу кырдаалдарда (өрт, террористтик коркунуч ж.б.) милиция эвакуацияны уюштуруп, коопсуздукту камсыз кылат.\",\"Башка кызматтар менен кызматташып, тартипти жана коопсуздукту сактайт.\"]}},\"safetyConsulting\":{\"title\":\"Коопсуздук боюнча кеңеш берүү\",\"list\":[\"Милиция жүргүнчүлөргө аэропорт эрежелери, жүктү туура таңгактоо жана коопсуз жүрүм-турум боюнча кеңеш берет.\",\"Керек учурда мыйзамдар тууралуу маалымат берип, жардам көрсөтөт.\"]},\"conclusion\":{\"description\":\"Аэропорттогу милиция коомдук тартипти жана коопсуздукту камсыздоодо маанилүү ролду ойнойт. Алар кырдаалды көзөмөлдөп, кылмыштардын алдын алат, жүргүнчүлөргө жардам берет жана кооптуу абалдарда аракет көрөт. Милиция башка коопсуздук кызматтары менен бирге иштеп, адамдардын аэропорт аймагында коопсуз жана ыңгайлуу жүрүшүн камсыздайт.\\n\\nЭгер кандайдыр бир көйгөйлөр жаралса, Кыргыз Республикасынын ИИМдин Транспорттогу ички иштер башкармалыгынын (УВДТ) аба транспортундагы ички иштер органынын нөөмөт бөлүмүнө кайрылсаңыз болот.\",\"callText\":\"Телефон:\",\"phoneNumber\":\"+996 (312) 69-34-02\"},\"imageAlts\":{\"image1\":\"Аэропорттогу милиция\",\"image2\":\"Милиция кызматкерлери\",\"image3\":\"Милиция жүргүнчүлөргө жардам берүүдө\"}},\"preFlightInspection\":{\"title\":\"Учууга чейинки текшерүү: Эрежелер жана Тартиптер\",\"description\":\"Учууга чейинки текшерүү — Кыргыз Республикасынын аэропортторунда жүргүнчүлөрдүн, экипаждын жана учактын коопсуздугун камсыз кылууга багытталган милдеттүү процедура. Текшерүү эл аралык авиация коопсуздугунун стандарттарына жана улуттук мыйзамдарга ылайык жүргүзүлөт.\",\"goals\":{\"title\":\"Учууга чейинки текшерүүнүн максаттары:\",\"items\":[\"Жүргүнчүлөрдүн коопсуздугун камсыз кылуу жана борттогу коркунучтарды алдын алуу\",\"Тыюу салынган нерселерди жана заттарды аныктоо жана алып коюу\",\"Учактарга жана авиациялык объекттерге уруксатсыз кирүүнүн алдын алуу\"]},\"process\":{\"title\":\"Текшерүүдөн өтүү процесси\",\"preparation\":{\"title\":\"Текшерүүгө даярдануу:\",\"steps\":[\"Текшерүү зонасына кирүүдөн мурун жүргүнчүлөргө отуруу талоонун жана өздүгүн тастыктаган документти даярдоосу талап кылынат.\",\"Бардык металл буюмдар, чоң электроника (ноутбуктар, планшеттер) жана суюктуктар кол жүгүңүздөн чыгарылып өзүнчө сканерден өтүшү керек.\",\"Сырт кийимдер жана баш кийимдер да чечилип текшерүүгө берилет.\"]},\"procedure\":{\"title\":\"Текшерүү процедурасы:\",\"steps\":[\"Жүргүнчүлөрдүн кол жүгү жана жеке буюмдары рентген сканерлери менен текшерилет.\",\"Жүргүнчүлөр металл издегичтен өтүшөт; сигнал чыкса кошумча текшерүү жүргүзүлөт.\",\"Мүмкүнчүлүгү чектелген же медициналык импланттары бар жүргүнчүлөр өзгөчөлүктөрүнө жараша текшерүүдөн өтүшөт.\"]}},\"prohibited\":{\"title\":\"Тыюу салынган буюмдар жана заттар\",\"items\":[{\"title\":\"Курал-жарактар\",\"description\":\"Тапанчалар, ок атуучу куралдар (бардык түрлөрү); Оюнчук тапанчалар жана чыныгы куралдар менен чаташтырылышы мүмкүн болгон куралдардын көчүрмөлөрү жана имитациялары; Ок атуучу куралдардын компоненттери (айрымдарынан тышкары, мисалы, телескопиялык көздөөчү); Пневматикалык тапанчалар, анын ичинде бычактар, кысылган аба тапанчалары же CO₂ тапанчалары; Сигнал берүүчү жана старт берүүчү тапанчалар; жаалар, арбалеттер, жебелер; гарпун мылтыктары, найза мылтыктары; роликтер жана лопаткалар; \"},{\"title\":\"Тескен жана курч буюмдар\",\"description\":\"Бычактар, кайчы, бычактар, муз кескичтер, устара, кылычтар жана кылычтар ж.б.; Тагыраак айтканда: 6 смден узунураак бычактар ​​менен бычактар; 6 смден узунураак бычактары бар кайчыларга (шарнирдин ортосунан ченегенде) тыюу салынат.; Мындай курч элементтери бар аспаптар, бурамалар, бурамалар жана башкалар.\"},{\"title\":\"Жарылуучу заттар\",\"description\":\"Ок-дарылар, жардыруучу капсулалар, детонаторлор жана фьючерстер, миналар, гранаталар ж.б.; Учуу коопсуздугу максатында катталган багажга айрым жарылуучу жана күйгүзүүчү заттарды алып кирүүгө тыюу салынат;\"},{\"title\":\"Нормадагы ашыкча суюктуктар\",\"description\":\"Бул тыюу суюктуктарга, түтүкчөлөргө, контейнерлерге жана жеке гигиеналык каражаттарды, косметикалык каражаттарды, дары-дармектерди, ошондой эле боёкторду, жабышчаактарды ж.б. сактоочу шаймандарга, эгерде алар кол жүктө болсо, тиешелүү. Кошумча: балдар тамак-ашы, эмчек сүтү жана учуу учурунда жүргүнчүлөр талап кылган дары-дармектер.\"}]},\"exceptions\":{\"title\":\"Текшерүүдөн өтүүдө өзгөчөлүктөр:\",\"description\":\"Учууга чейинки текшерүү бардык жүргүнчүлөр үчүн милдеттүү. Бирок айрым мамлекеттердин дипломатиялык жана расмий өкүлдөрү эл аралык келишимдерге жана дипломатиялык артыкчылыктарга ылайык жөнөкөйлөштүрүлгөн текшерүүдөн өтө алышат.\",\"denialReasons\":{\"title\":\"Бортко кирүүгө тыюу салуунун себептери\",\"items\":[\"Тыюу салынган буюмдардын табылышы.\",\"Жүргүнчүнүн текшерүүдөн өтүүдөн баш тартуусу же коопсуздук кызматынын көрсөтмөлөрүн аткарбоосу.\",\"Шек жараткан жүрүм-турум.\"]},\"tips\":{\"title\":\"Текшерүүдөн оңой өтүү үчүн кеңештер\",\"items\":[\"Аэропортко алдын ала эртерээк келиңиз.\",\"Суюктуктарды, электрониканы жана металл буюмдарды алдын ала даярдаңыз.\",\"Коопсуздук кызматкерлери берген көрсөтмөлөрдү аткарыңыз.\"]},\"conclusion\":\"Учууга чейинки текшерүү жөн гана формалдуулук эмес, ар бир жүргүнчүнүн коопсуздугун камсыздоонун маанилүү баскычы. Коопсуз учууларды камсыздоого көрсөткөн түшүнүгүңүз жана кызматташууну баалайбыз!\"},\"imageAlts\":{\"preflight1\":\"Учууга чейинки текшерүү\",\"preflight2\":\"Текшерүүдөн өтүүдө өзгөчөлүктөр\",\"gun\":\"Курал-жарактар\",\"knife\":\"Тескен жана курч буюмдар\",\"boom\":\"Жарылуучу заттар\",\"liquid\":\"Нормадагы ашыкча суюктуктар\"}},\"registration\":{\"title\":\"Жүргүнчүлөрдү каттоо тартиби: \u003cbr\u003e Кадам-кадам көрсөтмө\",\"description\":\"Каттоо — учууга чейин маанилүү этап, ал билетиңизди ырастоону, отуруучу талонду алууну жана жүктү тапшырууну камтыйт. Процедура рейстин түрүнө жараша (ички же эл аралык) айырмаланышы мүмкүн, бирок негизги тартип өзгөрбөйт.\",\"arrivalTime\":{\"text\":\"Жүргүнчү каттоо жана жүк тапшыруу үчүн аэропортко келиши керек:\",\"items\":[\"эл аралык каттамдар үчүн учууга 3 саат калганда\",\"ички каттамдар үчүн учууга 2 саат калганда\"],\"note\":\"Бардык эл аралык авиакомпаниялардын каттамдарына каттоо учууга 1 саат калганда аяктайт.\"},\"steps\":{\"preparation\":{\"title\":\"Каттоого даярдануу\",\"items\":[{\"title\":\"Документтер:\",\"text\":\"Эл аралык каттамдар үчүн жарактуу паспорт же ички каттамдар үчүн жеке күбөлүк жана билетти ырастоо кодуңузду даярдаңыз.\"},{\"title\":\"Жүк:\",\"text\":\"Жүктү ташуу эрежелери менен алдын ала таанышып, салмак жана өлчөм чектерин сактаңыз.\"}]},\"checkInArea\":{\"title\":\"Каттоо зонасына өтүү\",\"items\":[\"Терминалдагы көрсөтмөлөрдү ээрчип, каттоо текчесине барыңыз. Рейс жана текче номери аэропорттогу электрондук таблолордон же авиакомпаниядан алдын ала такталат.\"]},\"queue\":{\"title\":\"Кезек жана күтүү\",\"items\":[\"Өз текчеңизге барып, кезегиңизди күтүңүз. Айрым авиакомпаниялар бизнес-класстын жүргүнчүлөрү, балалуу үй-бүлөлөр же өзгөчө муктаждыктары бар жүргүнчүлөр үчүн өзүнчө текчелерди сунуш кылышы мүмкүн.\",\"Аэропорт терминалында күтүү залдары, кафелер, дүкөндөр, банкоматтар, почта жана акча алмаштыруу жайлары бар. Алардын көбү күнү-түнү иштейт.\"]},\"documentsCheck\":{\"title\":\"Документтерди текшерүү\",\"header\":\"Авиакомпаниянын кызматкери төмөнкүлөрдү текшерет:\",\"items\":[\"Паспорт же жеке күбөлүк.\",\"Электрондук билет же брондоо коду.\",\"Виза (эл аралык каттамдар үчүн талап кылынганда).\"]},\"baggage\":{\"title\":\"Жүктү каттоо\",\"items\":[\"Жүк салмакта текшерилет жана багаж теги тагылат.\",\"Салмак чегинен ашса, кошумча акы талап кылынышы мүмкүн.\",\"Багытталган аэропортто жүктү алуу үчүн квитанция берилет.\"]},\"boardingPass\":{\"title\":\"Отуруучу талонду алуу\",\"header\":\"Талондо төмөнкүлөр көрсөтүлөт:\",\"items\":[\"Рейс номери жана отургуч орду.\",\"Отургузуу баштала турган жана аяктоочу убакыт.\",\"Отургузуу дарбазасынын номери (Gate).\"]},\"additionalServices\":{\"title\":\"Кошумча кызматтар\",\"header\":\"Төмөнкү акы төлөнүүчү кызматтарды алууга болот:\",\"items\":[\"Учак ичиндеги ордун тандоо.\",\"Кошумча жүк үчүн акы төлөө.\",\"Атайын тамак-ашка заказ берүү (болсо).\"]},\"securityCheck\":{\"title\":\"Досмотр зонасына өтүү\",\"items\":[\"Отуруучу талонду алгандан кийин жүргүнчүлөр (эл аралык каттамдар үчүн) коопсуздук жана чек ара көзөмөл зонасына өтүшөт.\"]},\"advice\":{\"title\":\"Каттоону ийгиликтүү өтүү үчүн кеңештер:\",\"items\":[\"Эл аралык каттамдар үчүн учууга 3–4 саат, ички каттамдар үчүн 2–3 саат эрте келиңиз.\",\"Каттоо жана отуруу убактысынын өзгөрүшүн байкап туруңуз.\",\"Онлайн каттоону колдонуңуз (эгер бар болсо), убактыңызды үнөмдөйт.\"],\"wish\":\"Сизге коопсуз жана ыңгайлуу учуу болсун!\"}},\"imageAlts\":{\"registration\":\"Каттоо процедурасы\",\"baggage\":\"Жүк\",\"queue\":\"Каттоого кезек\",\"documents\":\"Документтерди текшерүү\",\"boardingPass\":\"Отуруучу талон\",\"terminal\":\"Аэропорт\"}},\"childrenRoom\":{\"title\":\"Кыргызстандагы аэропорттордогу балдар бөлмөсү\",\"description\":\"Кыргызстандагы аэропорттордо балдар бөлмөсү — саякат учурунда балага эс алып, ойноп, кам көрүү үчүн атайын жабдылган жай. Ал чакан жүргүнчүлөр менен алардын ата‑энелери үчүн күтүүлөрдү ыңгайлуу өткөрүү максатында уюштурулган.\",\"functions\":{\"title\":\"Балдар бөлмөсүнүн функциялары\",\"entertainment\":{\"title\":\"Балдар үчүн көңүл ачуу жана эс алуу\",\"items\":[\"Бөлмө балдарга ойноп, эс алуу мүмкүнчүлүгүн сунуштайт, бул учак күтүп жатканда чыдашсыздык жана чарчоонун алдын алууга жардам берет.\",\"Балдар бөлмөсүндө оюнчуктар, конструкторлор, китептер, стол оюндары жана интерактивдүү экрандар сыяктуу оюн элементтери бар.\"]},\"safety\":{\"title\":\"Коопсуз чөйрө\",\"items\":[\"Бөлмө балдар үчүн коопсуз жабдылган. Оюн учурунда жаракат алуусуна жол бербөө үчүн техника (жумшак мебель бурчтары, тайгалоочу эмес пол ж.б.) колдонулат.\",\"Ошондой эле бөлмөдө дайыма желдетүү жана ыңгайлуу температура сакталат.\"]},\"rest\":{\"title\":\"Балдар үчүн эс алуу жана уединение\",\"items\":[\"Кээ бир балдар бөлмөлөрүндө жылуу чөйрө же тынч панелдер болушу мүмкүн, бала эс алып же уктаганы келет, айрыкча рейс узак жана күтүүлөр бир нече саатка созулса.\"]},\"care\":{\"title\":\"Балдарга кам көрүү\",\"items\":[\"Бөлмөдө жууп‑алдыра турган столдор же эмизүү үчүн атайын жайлар сыяктуу кошумча ыңгайлуулуктар болушу мүмкүн.\"]}},\"access\":{\"title\":\"Кимдер балдар бөлмөсүн колдоно алат\",\"parents\":{\"title\":\"Ата‑энелер же коштоочулар\",\"text\":\"Баланын чоң киши көзөмөлүндө болушу маанилүү, анткени балдар бөлмөсү оюн жана эс алуу үчүн түзүлгөн, бирок көзөмөлсиз узак убакытка болбойт.\"},\"children\":{\"title\":\"Белгиленген жашка чейинки балдар\",\"text\":\"Жалпысынан 7 жашка чейинки балдар балдар бөлмөсүн колдоно алат, бирок кээ бир аэропорттордо жаш limitтер ар башка болушу мүмкүн.\"}},\"services\":{\"title\":\"Кирүү жана кызматтар\",\"freeUse\":{\"title\":\"Ыңгай алууда акы алынбайт\",\"text\":\"Балдар менен саякат кылган бардык жүргүнчүлөр үчүн балдар бөлмөсү адатта акысыз берилет. Бирок айрым аэропорттордо эне‑кароочулук кызматтары же оюн аймактары үчүн кошумча төлөм дайын болушу мүмкүн.\"},\"availability\":{\"title\":\"Орношуусу\",\"text\":\"Балдар бөлмөсү ыңгайлуу бөлүктө жайгашкан, көп учурда күтүүлөр залында, каттоо жайлары же отурууга чыгуучу чыгармалардын жанында.\"},\"workingHours\":{\"title\":\"Иштөө убактысы\",\"text\":\"Бөлмө адатта аэропорттун иштөө убактысында жеткиликтүү, бирок конкреттүү аэропорттун графигине жараша кирүүгө чектөөлөр болушу мүмкүн.\"},\"conclusion\":\"Аэропорттогу балдар бөлмөсү саякаттап жаткан үй-бүлөлөр үчүн маанилүү инфраструктура болуп, балдардын ыңгайлуулугун жана коопсуздугун камсыз кылууга жардам берет, күтүүлөрдү баары үчүн жеңил жана жагымдуу өткөрүүгө түрткү берет.\"},\"imageAlts\":{\"child1\":\"Оюн бөлмөдөгү балдар\",\"child2\":\"Бала менен эне\",\"child3\":\"Бала менен атасы\"}},\"motherRoom\":{\"title\":\"Эне жана бала бөлмөсү\",\"description\":\"Кыргызстандагы аэропорттордогу эне жана бала бөлмөсү — бул эмчектеги ымыркайлар жана кичинекей балдары бар аялдар үчүн ыңгайлуу шарт түзүлгөн атайын жабдылган жай. Ал купуялуулукту, ыңгайлуулукту жана ата‑энелерге колдоо көрсөтүүнү камсыз кылат. Бөлмөдө уктоочу орундар, пеленкалоочу үстөлдөр, микротолкундуу меш, ичүүчү суу диспенсери, муздак/ысык суу чыккан раковина, оюнчуктар бар. Бөлмөдөн 7 жашка чейинки балдар менен пайдаланууга болот.\",\"functions\":{\"title\":\"Эне жана бала бөлмөсүнүн функциялары\",\"feeding\":{\"title\":\"Тамактандыруу жана эс алуу үчүн ыңгайлуулук\",\"items\":[\"Бөлмө балдарды эмизүү же аралашма менен тамактандыруу үчүн ыңгайлуу орундарды сунуштайт.\",\"Энелерге баласын ыңгайлуу шартта, ызы-чуудан обочо жерде тамактандыруу үчүн купуялуулук камсыздалат.\"]},\"diaper\":{\"title\":\"Жөргөмдү алмаштыруу\",\"items\":[\"Бөлмөдө баланын жөргөмүн ыңгайлуу алмаштыруу жана ага кам көрүү үчүн атайын пеленкалоочу үстөлдөр бар.\"]},\"sleep\":{\"title\":\"Уктоочу тынч зона\",\"items\":[\"Бөлмөдө балдар учууга чейин эс алуу үчүн жумшак отургучтар же керебеттер болушу мүмкүн, энелер да эс алып алышат.\"]},\"hygiene\":{\"title\":\"Гигиеналык шарттар\",\"items\":[\"Раковиналар, кол жууучу каражаттар, баланын бөтөлкөлөрүн жана кам көрүүчү буюмдарын стерилдештирүүчү жабдыктар болушу мүмкүн.\"]}},\"equipment\":{\"title\":\"Эне жана бала бөлмөсүндө эмне болушу керек\",\"items\":[\"Пеленкалоочу үстөл же жөргөмдү алмаштырууга ыңгайлуу жай.\",\"Эмизүү үчүн энеге ыңгайлуу колдоо көрсөткөн отургуч.\",\"Балдар керебети же эс алуу үчүн орун.\",\"Энелер үчүн күзгү жана жеке буюмдарды сактоо үчүн орундар.\",\"Гигиеналык каражаттар: сүлгү, кол жуугуч каражаттар, жөргөм салуучу урналар.\",\"Бөтөлкө стерилизатору же тамак ысыткыч.\",\"Ичүүчү сууга жеткиликтүүлүк же энеге суусундук алууга мүмкүнчүлүк.\"]},\"services\":{\"title\":\"Кирүү жана кызматтар\",\"freeUse\":{\"title\":\"Акысыз колдонуу\",\"text\":\"Эне жана бала бөлмөсү тиешелүү шарттарга жооп берген бардык жүргүнчүлөр үчүн акысыз (мисалы, 2–3 жашка чейинки балдары бар аялдар үчүн).\"},\"availability\":{\"title\":\"Жеткиликтүүлүк\",\"text\":\"Бөлмө адатта күтүү зонуна же дааратканага жакын жайгашкан, бул ата-энелерге оңой жана тез жетүүгө шарт түзөт.\"},\"comfort\":{\"title\":\"Эс алуу үчүн ыңгайлуулук\",\"text\":\"Баланын жана эненин ыңгайлуулугу үчүн жетиштүү жарык менен коштолгон жагымдуу атмосфера, жумшак же жылуу түстөр.\"},\"conclusion\":\"Эне жана бала бөлмөлөрү аэропорттордун маанилүү инфраструктурасынын бөлүгү болуп саналат. Алар саякаттап жаткан үй-бүлөлөргө кошумча колдоо көрсөтүп, өзгөчө кичинекей балдар менен учкандар үчүн жолду ыңгайлуу жана жеңил кылат.\"},\"imageAlts\":{\"mother1\":\"Бөлмөдө эне менен бала\",\"mother2\":\"Эне менен бала\",\"mother3\":\"Эне жана бала бөлмөсүнүн жеткиликтүүлүгү жана кызматтары\"}},\"prayerRoom\":{\"title\":\"Кыргызстан аэропортторундагы намазкана\",\"description\":\"Бул — мусулмандардын намаз окуу муктаждыктары үчүн атайын жабдылган жай, алар өздөрүнүн диний салттарын жана каада-салтын сактап, намаз окуй алышат. Намазкана учуудан мурда же кийин тынч жана купуя шартта намаз окуу мүмкүнчүлүгүн берет.\",\"functions\":{\"title\":\"Намазкананын функциялары\",\"prayer\":{\"title\":\"Негизги милдети\",\"items\":[\"Намазкананын негизги максаты — мусулмандар үчүн милдеттүү жана кошумча намаздарды (салаат) өз убагында аткарууга шарт түзүү.\",\"Бөлмөдө тынчтык жана купуялуулук камсыздалат, бул өзгөчө башка аэропорт бөлүктөрү ызы-чуу жана эл көп учурда маанилүү.\"]},\"religious\":{\"title\":\"Диний атмосфера\",\"items\":[\"Намазкана — бул ыйык жай, анда тазалык жана диний тартип сакталат. Ал ибадат кылуучулардын муктаждыктарын канааттандыруучу шартта уюштурулушу керек.\"]},\"privacy\":{\"title\":\"Купуялуулукту камсыздоо\",\"items\":[\"Бөлмөдө ар бир ибадат кылуучуга өзүнчө жеке мейкиндик берилет, анткени көпчүлүк мусулмандар намазды жалгыз же чакан топ менен окууну артык көрүшөт.\"]},\"rituals\":{\"title\":\"Диний ырым-жырымдарды сактоого жардам\",\"items\":[\"Намазкана ошондой эле намазга даярдануучу жай катары кызмат кылат, анда мусулмандар омовение (абдест) ала алышат.\"]}},\"access\":{\"title\":\"Ким намазкананы колдоно алат\",\"muslims\":{\"title\":\"Мусулмандар\",\"text\":\"Намазкананын негизги колдонуучулары — бул учуудан мурда же кийин намаз окушу керек болгон мусулмандар.\"},\"cleanState\":{\"title\":\"Ритуалдык тазалыкта болгон жүргүнчүлөр\",\"text\":\"Омовение жасап, тазалык абалында болгондор намазкананы колдонуп намаз окуй алышат.\"},\"allMuslims\":{\"title\":\"Ар кандай жаштагы жана жыныстагы мусулмандар\",\"text\":\"Намазкана эркектер жана аялдар үчүн арналган, адатта купуялуулук үчүн өзүнчө зоналарга бөлүнөт.\"}},\"services\":{\"title\":\"Кирүү жана кызматтар\",\"freeUse\":{\"title\":\"Акысыз пайдалануу\",\"text\":\"Намазкана, эреже боюнча, бардык жүргүнчүлөр үчүн акысыз жеткиликтүү, тейлөө классына карабастан, эгер диний талаптарга жооп берсе.\"},\"availability\":{\"title\":\"Жеткиликтүүлүк\",\"text\":\"Бөлмө аэропорттун ичинде ыңгайлуу жерде жайгашкан — күтүү зонасына же коридорлорго жакын, таап жана пайдалануу жеңил болсун деп.\"},\"workingHours\":{\"title\":\"Иштөө убактысы\",\"text\":\"Намазкана күнү-түнү иштейт, бул өзгөчө ири эл аралык аэропорттордо сутканын каалаган убагында намаз окууга шарт түзөт.\"},\"conclusion\":\"Намазкана — бул мусулмандар үчүн аэропорт инфраструктурасынын маанилүү бөлүгү. Ал сапар учурунда диний салттарды сактоого жана ыңгайлуулукка шарт түзөт. Мындай жайлар ыймандууларга руханий милдетин аткарууга көмөктөшөт, ал тургай эл аралык транспорт борборлорунда да.\"},\"imageAlts\":{\"prayerRoom1\":\"Намазкананын ички көрүнүшү\",\"prayerRoom2\":\"Аэропорттогу намазкана\",\"prayer\":\"Намаз окуп жаткан адам\"}},\"parking\":{\"title\":\"Манас аэропортунун автототоочу жайы\",\"automatedSystem\":{\"title\":\"Автоматташтырылган автототоочу системасы\",\"items\":[\"Автоматташтырылган автототоочу системасы (ААС) - аэропорт аймагына кирип-чыгууну жөнгө салуу үчүн автототоочу жайларды уюштуруу жана модернизациялоо үчүн программалык-аппараттык каражаттардын комплекси. ААС-тын негизги максаты - тартипти жана жүргүнчүлөрдүн коопсуздугун камсыз кылуу.\",\"Системага автоматтык шлагбаумдар, камералар жана көзөмөл аппараттары кирет. Видеокөзөмөл системасы борбордук маалымат базасына кирип-чыккан бардык унааларды каттайт.\",\"Видеосистема жана IT-программа унаанын түрүн, мамлекеттик номерин, аэропорт аймагындагы убакыт боюнча жайгашкан жерин көзөмөлдөөгө, жазууга жана маалымат берүүгө, коопсуздукту сактоо боюнча статистиканы жүргүзүүгө мүмкүндүк берет.\"]},\"payment\":{\"title\":\"Төлөм\",\"items\":[\"Автототоочу жайга ыңгайлуу төлөө үчүн MBank мобилдик банкын же паркоматтагы QR-код аркылуу төлөөнү колдоно аласыз. QR-кодду түзмөк экранынан сканердеп, тандалган сервис аркылуу төлөмдү аяктаңыз.\"]},\"howItWorks\":{\"title\":\"Бул кандай иштейт:\",\"items\":[\"Автототоочу жайга киргенде автототоочу билетин алыңыз.\",\"MBank же QR-код аркылуу ыңгайлуу ыкманы тандап, автототоочу жай үчүн терминалды колдонуңуз.\",\"Мобилдик түзмөгүңүз же банк картаңыз аркылуу автототоочу жай үчүн төлөңүз.\",\"Төлөмдөн кийин чекти алып, автототоочу жайдан чыгыңыз.\"],\"conclusion\":\"Автоматташтырылган автототоочу системасы кыска мөөнөттө ыңгайлуу түрдө төлөмдөрдү жасоого мүмкүндүк берет, көпкө күтүүнүн керегин калтырбайт.\"},\"imageAlts\":{\"parking\":\"Аэропортто автототоочу жай\"}},\"dutyFree\":{\"title\":\"Манас аэропортундагы Duty Free\",\"description\":\"Манас аэропортундагы Duty Free зонасында салыксыз арзан баада соода кылуу дүйнөсүн ачыңыз! Бул жерде сиз салыксыз жакшы баада товарлардын кең ассортиментин таба аласыз.\",\"advantages\":{\"title\":\"Duty Free артыкчылыктары\",\"products\":{\"title\":\"Duty Free'де сизди эмне күтөт?\",\"items\":[\"Парфюмерия жана косметика - дүйнөлүк мыкты брендтер арзан баада\",\"Аракетүү ичимдиктер - премиум шараптар, виски, коньяктар жана ликёрлор\",\"Шоколад жана таттуулар - өзүңүз үчүн жана белекке атайын даамдар\",\"Аксессуарлар жана эстелик буюмдар - стилдүү товарлар жана эсте каларлык белектер\"]},\"benefits\":{\"title\":\"Duty Free'ден соода кылуунун артыкчылыктары:\",\"items\":[\"Салыксыз арзан баалар\",\"Белгилүү бренддердин оригиналдуу продукциялары\",\"Учуу залында ыңгайлуу жайгаштырылышы\"]}},\"info\":{\"title\":\"Маалымат\",\"text\":\"«Манас» аэропортунун бортото тамак-аш борбору - авиакомпаниялар үчүн сапаттуу тамак-ашты ишенимдүү жеткирүүчү, таза тамак-аш жана бортото жогорку деңгээлдеги кызмат көрсөтүүнү камсыз кылат!\\n\\nЖүргүнчүлөр белгилүү бренддерден накталай жана накталай эмес төлөм менен соода кыла алышат. Кардарларга ыңгайлуулук үчүн Duty Free дүкөнүндө бардык негизги банк карталары (анын ичинде Мир карталары) жана үч валюта кабыл алынат: Рубль, Доллар жана Евро. Сизди конокторубуздун катарында көргөнүбүзгө кубанычтабыз.\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"partners@airports.kg\"},\"phone\":{\"label\":\"Телефон:\",\"value\":\"+996 (312) 123-456\"}}},\"imageAlts\":{\"dutyFree\":\"Duty Free дүкөнү\"}},\"taxi\":{\"title\":\"Манас аэропортундагы такси\",\"description\":\"Манас аэропортунан шаарга расмий такси менен жетүү оңой жана ыңгайлуу. Ыңгайлуу унаалар жана адис шоферлор сизге коопсуз жана тез саякатты камсыз кылат.\\n\\nManas Airport Taxi - заманбап шаар таксиси. Кызматтын негизги басымдуулуктары - ыңгайлуулук, коопсуздук жана жогорку сервис. Кызмат жана консультация кыргыз, орус жана англис тилдеринде жүргүзүлөт. Бардык унаалар самолёт формасындагы бренддүү шашкаларга ээ; электр пакети, стереосистемасы, видеорегистратору, GPS навигатору, дары-дармек чемоданы жана өчүргүчү менен жабдылган. Айдоочулар наркологиялык жана медициналык текшерүүлөрдөн өтүшөт.\",\"advantages\":{\"title\":\"Аэропорт таксисинин артыкчылыктары:\",\"items\":[\"24/7 жеткиликтүүлүк - такси түн-түнкү иштейт\",\"Жашыруун төлөмсүз белгиленген тарифтер\",\"Терминалдын чыгуусундагы ыңгайлуу автототоочу жай\",\"Ар түрдүү классдагы ыңгайлуу унаалар\"]},\"howToUse\":{\"title\":\"Таксини кантип пайдалануу керек?\",\"items\":[\"Келип түшүү аймагындагы такси брондоо столун табыңыз.\",\"Керектүү маршрутту тандап, белгиленген баадагы чекти алыңыз.\",\"Расмий такси автототоочу жайына барып, саякаттын ырахатына бөлүнүңүз.\"]},\"info\":{\"title\":\"Маалымат\",\"text\":\"Manas Airport Taxi - ишенимдүү жана ыңгайлуу транспорт каражаты, күнүн каалаган убактысында жүргүнчүлөргө ыңгайлуу, коопсуз жана тез саякатты камсыз кылат!\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"airporttaximanas@gmail.com\"},\"site\":{\"label\":\"Сайт:\",\"value\":\"manastaxi.kg\"},\"phone\":{\"label\":\"Телефон:\",\"value1\":\"+(996) 550 693 000\",\"value2\":\"+(996) 550 693 000\",\"value3\":\"+(312) 693 000\"}}},\"imageAlts\":{\"taxi\":\"Аэропорт таксиси\"}},\"asmanAirlines\":{\"companyName\":\"Асман Эйрлайнс\",\"description\":{\"intro\":\"«Asman Airlines» ЖЧК – Кыргызстандын биринчи мамлекеттик авиакомпаниясы, 2023-жылы «Манас» эл аралык аэропортунун» ААКнын 100% кызылча ишканасы катары түзүлгөн. Компаниянын негизги максаты – ички авиабайланышты өнүктүрүү, региондорго транспорттук жеткиликтүүлүктү жакшыртуу жана Кыргызстандын аймактык жана эл аралык авиабазарлардагы абалын бекемдөө.\",\"routes\":{\"title\":\"Маршруттук тармакты өнүктүрүү\",\"text\":\"2024-жылдын сентябрында ишке киргенден бери авиакомпания Бишкектен төмөнкү багыттар боюнча үзгүлтүксүз рейс аткарып келет:\\n\\nОш, Талас, Жалал-Абад, Баткен, Раззаков. 2024-жылдын ноябрынан баштап төмөнкү маршруттар кошулду:\\n\\nКербен, Нарын, Каракол, Казарман жана башка шаарлар.\\n\\nБул рейс региондор ортосундагы байланышты бекемдөөгө, бизнес жана туризмди колдоого, ошондой эле өлкөнүн алыскы аймактарындагы тургундардын муктаждыктарын канааттандырууга жардам берет\"},\"fleet\":{\"title\":\"Флот жана сервис\",\"intro\":\"Авиакомпания Канаданын заманбап Dash 8-Q400 учактарын колдонот, алар төмөнкүлөр менен айырмаланат:\",\"features\":[\"Жогорку отундун натыйжалуулугу\",\"Ишенимдүүлүк жана жүргүнчүлөр үчүн ыңгайлуулук\",\"Кыска учуш-конуш жолдоруна ылайыктоо мүмкүнчүлүгү, бул Кыргызстандын аймактык аэропорттору үчүн идеалдуу\"],\"conclusion\":\"Бортто жүргүнчүлөр сапаттуу сервиске, ыңгайлуу учуш шарттарына жана ийкемдүү баа саясатына көз сала алышат.\"},\"future\":{\"title\":\"Кыргызстандын авиациясынын келечеги\",\"text\":\"«Кыргызстандын аэропорттору» ААК авиакомпанияларды кызматташтыкка чакырат, активдүү түрдө маршруттук тармакты кеңейтет жана «абанын бешинчи эркиндигинин» мүмкүнчүлүктөрүн пайдаланат.\\n\\nБиздин аракеттерибиз жүргүнчүлөр жана өнөктөштөр үчүн заманбап жана коопсуз авиациялык инфраструктураны өнүктүрүүгө багытталган!\"}},\"imageAlts\":{\"routeMap\":\"Asman Airlines маршрут картасы\",\"aircraft\":\"Asman Airlines учагы\",\"cooperation\":\"Кыргызстандын авиациясындагы кызматташтык\"}},\"asmanOilCompany\":{\"companyName\":\"Asman Oil Company\",\"description\":\"«Asman Oil Company» ЖЧК – «Кыргызстандын аэропорттору» ААКнын негизги кызылча ишканасы, 2003-жылы негизделген. Компаниянын негизги иши аба кемелерин заправкалоо үчүн авиациялык май жана атайын суюктуктарды кабыл алуу, сактоо жана даярдоо менен байланыштуу.\",\"activities\":{\"title\":\"Ишмердүүлүк жана ийгиликтер\",\"cards\":[{\"title\":\"Инфраструктура\",\"content\":\"Компания заманбап жана жогорку технологиялуу жабдуулар менен жабдылган май-заправка комплекстерине ээ. Бул бардык түрдөгү аба кемелери үчүн майды ишенимдүү сактоону жана өз убагында берүүнү камсыз кылат.\"},{\"title\":\"Сапат\",\"content\":\"Asman Oil Company Кыргыз Республикасынын талаптарын жана учуш коопсуздугун камсыз кылуу боюнча эл аралык стандарттарды катуу сактайт. Сапаттык көзөмөл технологиялык чынжырдын ар бир этабында жүргүзүлөт.\"},{\"title\":\"Кызмат көрсөтүү\",\"content\":\"Компания Кыргызстандын бардык аэропортторундагы рейстерди тейлөө менен, өлкө ичиндеги жана чет өлкөлүк авиакомпаниялардын аба кемелерин заправкалайт. Кардарлардын арасында ири эл аралык ташыкчылар бар.\"},{\"title\":\"Экология\",\"content\":\"Экологиялык таза технологияларды киргизүү чөйрөгө тийгизүүчү таасирди минималдаштырууга мүмкүндүк берет.\"},{\"title\":\"Өнүгүү\",\"content\":\"2024-жылы компания өсүп жаткан жүргүнчүлөр агымын жана жүк ташууларды камсыз кылуу үчүн май сактоо кубаттуулугун кеңейткен.\"}]}},\"vipLounge\":{\"title\":\"Аэропорттогу VIP-кызмат - Престиждүүлүк, ыңгайлуулук жана ар бир деталга көңүл буруу.\",\"description\":{\"part1\":\"Биз жүргүнчүлөрүбүзгө VIP терминалын колдонуп, ыңгайлуу жана тынч саякаттоо үчүн өзгөчө шарттарды сунуштабақ.\",\"part2\":\"Ар бир ири эл аралык аэропортто түнү-күнү иштөөчү VIP зал бар. Бул өз убагын жана ыңгайлуулугун баалаган ишкер адамдар үчүн аймак.\",\"part3\":\"Коопсуздук, кемчиликсиздик жана ыңгайлуулук - VIP залдын ишинин негизги басымдуулуктары. Жогорку деңгээлдеги кызмат көрсөтүү философиясы жөнөкөй: ар бир конокко профессионалдык жана жеке мамиле.\",\"part4\":\"Залдын кызматтарын пайдалануу үчүн агенттерге жүргүнчүнүн маалыматтарын, учуу же келиү күнүн, рейс номерин билдирип, төлөмүн жасоо керек. Кызмат коммерциялык тарифтер боюнча көрсөтүлөт.\"},\"advantagesTitle\":\"VIP-кызматтын артыкчылыктары\"},\"procurement\":{\"steps\":[{\"number\":1,\"title\":\"Мамлекеттик сатып алуулар порталына катталуу\",\"details\":[\"Катышуучу мамлекеттик сатып алуулардын расмий порталына катталган болушу керек\"]},{\"number\":2,\"title\":\"Юридикалык статусу\",\"details\":[\"Катышуучу юридикалык жак болушу керек (компания, уюм)\",\"Же болбосо жеке ишкер (ЖИ) болушу керек\"]},{\"number\":3,\"title\":\"Катышуу үчүн документтер топтому\",\"details\":[\"Катышуу арызы (белгиленген форма боюнча толтурулат)\",\"Юридикалык жакты же ЖИни каттоо тууралуу күбөлүктүн көчүрмөсү\",\"Салык төлөөчүнүн идентификациялык номери (ИНН)\",\"Салык кызматында карыздын жоктугу тууралуу справка\",\"Банктык справка (карыздын жоктугу жана эсептин бар экени тууралуу)\",\"Соцфонддон карыздын жоктугу тууралуу справка (зарыл болсо)\",\"Жаргы же уюштуруу документтери (юридикалык жактар үчүн)\",\"Портфолио/иш тажрыйбасы (зарыл болсо)\",\"Техникалык сунуш (эмне жана кантип жеткирилет, аткарылат ж.б.)\",\"Финансылык сунуш (баасы)\",\"Кепилдик кат, эгер талап кылынса\",\"Банктык кепилдик же тендердик камсыздоо, эгер каралса\"]},{\"number\":4,\"title\":\"Кардардын критерийлерине ылайыктуулук\",\"details\":[\"Тиешелүү тажрыйбанын болушу\",\"Техникалык жана кесиптик жөндөмдүүлүк\",\"Банкроттук же иштен четтетүү тууралуу сот чечимдеринин жоктугу\"]},{\"number\":5,\"title\":\"Тендердик сунушту даярдоо жана тапшыруу\",\"details\":[\"Электрондук портал аркылуу\",\"Белгиленген мөөнөттө\",\"Тендердик документтеги бардык талаптарды сактоо менен\"]}],\"provisions\":\"Жалпы жоболор\",\"provisionsContent\":\"Кыргыз Республикасындагы (КР) тендерге катышуу үчүн катышуучулар мыйзамда (атап айтканда, КР «Мамлекеттик сатып алуулар жөнүндө» Мыйзамында) белгиленген айрым талаптарга, ошондой эле конкурстун конкреттүү шарттарына жооп бериши керек. Төмөндө адатта талап кылынган нерселердин жалпы тизмеси келтирилген:\",\"regulatoryDocs\":\"Ченемдик документтер\",\"regulatoryDocsContent\":\"Сатып алуу процессин жөнгө салуучу мыйзамдык жана ички документтер:\",\"sampleDocs\":\"Документтердин үлгүсү\",\"sampleDocsContent\":\"Сатып алууга катышуу үчүн зарыл болгон арыздардын, келишимдердин жана нускамалардын шаблондору:\"},\"handling\":{\"aboutTitle\":\"Биз жөнүндө\",\"aboutDescription\":\"The Handling Services Department (HSD) is a full-time structural subdivision of Manas International Airport. The department acts as a representative oHandling Services департаменти (HSD) «Манас» эл аралык аэропортунун штаттык түзүмдүк бөлүмү болуп саналат. Бөлүм авиакомпаниялардын өкүлү катары иштейт, ошондой эле агенттик жана тейлөө кызматтарын көрсөтөт. Биз учактарды, жүргүнчүлөрдү жана жүктөрдү жерде тейлөөнүн бардык этаптарын уюштурабыз жана координациялайбыз, тейлөөнүн жогорку деңгээлин жана эл аралык коопсуздук стандарттарына ылайык келүүнү камсыз кылабыз.\",\"advantagesTitle\":\"Биз менен иштөөнүн пайдасы\",\"advantages\":[{\"title\":\"Кесипкелүү команда\",\"description\":\"Биздин адистер авиациялык жер кызмат көрсөтүү тармагында көп жылдык тажрыйбага ээ жана эл аралык стандарттар боюнча туруктуу окутуудан өтүшөт.\"},{\"title\":\"24/7 кызмат\",\"description\":\"Күнү-түнү иштеп, каалаган убакта ыкчам колдоо көрсөтүп, ар кандай маселелерди чечүүгө жардам беребиз.\"},{\"title\":\"Индивидуалдуу мамиле\",\"description\":\"Ар бир кардар үчүн рейстин өзгөчөлүгүн жана авиакомпаниянын каалоолорун эске алган оптималдуу чечимдер иштелип чыгат.\"},{\"title\":\"Эл аралык стандарттарга ылайык\",\"description\":\"Бардык иш-аракеттер ICAO, IATA талаптарына жана аэропорттун коопсуздук стандарттарына жооп берет.\"},{\"title\":\"Ыкчамдык жана ишенимдүүлүк\",\"description\":\"Бардык операцияларды убагында аткарууну жана ар кандай суроолорго ыкчам жооп берүүнү кепилдейбиз.\"}]}}},\"children\":[[\"$\",\"$L17\",null,{\"bannerData\":[{\"id\":31,\"title\":\"Сайт\",\"file\":\"https://airport.kg/media/banners/%D0%A1%D0%B0%D0%B9%D1%82_1_optimized.mp4\"}],\"children\":[[\"$\",\"$L18\",null,{\"locale\":\"ru\"}],[\"$\",\"main\",null,{\"children\":[[\"$\",\"div\",null,{\"className\":\"pattern\"}],[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"$19\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Le\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"styles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/96a07a030b7c5141.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/94366475b4257721.css\",\"precedence\":\"next\",\"crossO
