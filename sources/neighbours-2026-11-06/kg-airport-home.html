but the general process remains the same.\",\"arrivalTime\":{\"text\":\"Passengers should arrive at the airport for ticket check-in and baggage handling:\",\"items\":[\"3 hours before departure for international flights\",\"for domestic flights 2 hours before departure\"],\"note\":\"Check-in for all international airline flights ends 1 hour before departure.\"},\"steps\":{\"preparation\":{\"title\":\"Preparation for Check-in\",\"items\":[{\"title\":\"Documents:\",\"text\":\"Ensure you have a valid passport (for international flights) or ID (for domestic flights), and your booking confirmation.\"},{\"title\":\"Baggage:\",\"text\":\"Review baggage rules in advance to ensure your luggage complies with weight and size limits.\"}]},\"checkInArea\":{\"title\":\"Proceeding to the Check-in Area\",\"items\":[\"Follow terminal signs to your flight’s check-in desks. Flight and desk numbers are shown on airport monitors or can be confirmed with your airline in advance.\"]},\"queue\":{\"title\":\"Queue and Waiting\",\"items\":[\"Approach your desk and wait your turn. Some airlines provide separate desks for business class passengers, families, or those with special needs.\",\"The terminal includes waiting areas, cafes, shops, ATMs, postal services, and currency exchanges. Most operate 24/7.\"]},\"documentsCheck\":{\"title\":\"Document Check\",\"header\":\"Airline staff will check:\",\"items\":[\"Passport or ID.\",\"E-ticket or booking code.\",\"Visa (if required for international flights).\"]},\"baggage\":{\"title\":\"Baggage Check\",\"items\":[\"Luggage is weighed and tagged with a baggage tag.\",\"Overweight baggage may incur extra charges.\",\"You will receive a baggage claim receipt for pickup at your destination.\"]},\"boardingPass\":{\"title\":\"Boarding Pass Issuance\",\"header\":\"The boarding pass includes:\",\"items\":[\"Flight number and seat assignment.\",\"Boarding start and end times.\",\"Boarding gate number.\"]},\"additionalServices\":{\"title\":\"Additional Services\",\"header\":\"Optional paid services include:\",\"items\":[\"Seat selection.\",\"Excess baggage payment.\",\"Special meal request (if available).\"]},\"securityCheck\":{\"title\":\"Proceeding to Security Screening\",\"items\":[\"After receiving the boarding pass, passengers proceed to the security and border control zone (for international flights).\"]},\"advice\":{\"title\":\"Tips for Smooth Check-in:\",\"items\":[\"Arrive 3–4 hours early for international flights, 2–3 hours for domestic.\",\"Keep track of check-in and boarding time changes.\",\"Use online check-in to save time when available.\"],\"wish\":\"We wish you a pleasant journey and a comfortable flight!\"}},\"imageAlts\":{\"registration\":\"Check-in Procedure\",\"baggage\":\"Luggage\",\"queue\":\"Check-in Queue\",\"documents\":\"Document Check\",\"boardingPass\":\"Boarding Pass\",\"terminal\":\"Airport\"}},\"childrenRoom\":{\"title\":\"Children’s Room at Airports of Kyrgyzstan\",\"description\":\"The children’s room at airports in Kyrgyzstan is a specially equipped space designed for relaxation, entertainment, and childcare during travel. It aims to make the waiting time comfortable for young passengers and their parents.\",\"functions\":{\"title\":\"Functions of the Children’s Room\",\"entertainment\":{\"title\":\"Entertainment and Leisure for Children\",\"items\":[\"The room provides space for children to play and relax, helping relieve stress and fatigue during flight waiting times.\",\"The children’s room is equipped with play items such as toys, building blocks, books, board games, and interactive screens for entertainment.\"]},\"safety\":{\"title\":\"Safe Environment\",\"items\":[\"The room is child-safe, including protective features (rounded furniture corners, non-slip flooring, etc.) to prevent injury during play.\",\"The room also has constant ventilation and a comfortable temperature.\"]},\"rest\":{\"title\":\"Rest and Privacy for Children\",\"items\":[\"Some children’s rooms may include quiet zones where a child can relax or even nap, especially if the flight is long and waiting may take several hours.\"]},\"care\":{\"title\":\"Childcare Facilities\",\"items\":[\"The room may include additional childcare amenities such as changing tables or feeding areas for infants.\"]}},\"access\":{\"title\":\"Who Can Use the Children’s Room\",\"parents\":{\"title\":\"Parents or Guardians\",\"text\":\"It is important that the child is supervised by an adult, as the children’s room is intended for play and rest, but not for unsupervised long stays.\"},\"children\":{\"title\":\"Children Up to a Certain Age\",\"text\":\"Typically children up to 7 years old can use the children’s room, but age limits may vary depending on the specific airport.\"}},\"services\":{\"title\":\"Access and Services\",\"freeUse\":{\"title\":\"Free of Charge Use\",\"text\":\"As a rule, the children’s room is provided free of charge to all passengers traveling with children. However, some airports may offer additional paid services such as babysitters or special play areas.\"},\"availability\":{\"title\":\"Location\",\"text\":\"The children’s room is located in a convenient area, usually in the waiting zone, near check-in or the boarding gate.\"},\"workingHours\":{\"title\":\"Operating Hours\",\"text\":\"The room is typically available during airport operating hours, but access may be limited depending on the specific airport's schedule.\"},\"conclusion\":\"A children’s room at the airport is an essential infrastructure for traveling families, helping to ensure children’s comfort and safety, making the waiting process more pleasant and easy for all passengers.\"},\"imageAlts\":{\"child1\":\"Children in playroom\",\"child2\":\"Mother with child\",\"child3\":\"Father with child\"}},\"motherRoom\":{\"title\":\"Mother and Child Room\",\"description\":\"The mother and child room at airports in Kyrgyzstan is a specially equipped space designed for the comfortable stay of women with infants and young children. It offers privacy, convenience, and support for parents during travel. The room includes sleeping places, changing tables, a microwave oven, a drinking water dispenser, a sink with cold/hot water, and toys. The room can be used with children up to 7 years old.\",\"functions\":{\"title\":\"Functions of the Mother and Child Room\",\"feeding\":{\"title\":\"Comfort for Feeding and Rest\",\"items\":[\"The room provides convenient places for feeding children, whether through breastfeeding or formula feeding.\",\"It ensures privacy for mothers so they can feed their child comfortably away from noise and crowds.\"]},\"diaper\":{\"title\":\"Diaper Changing\",\"items\":[\"The room is equipped with special changing tables for convenient diaper changes and childcare.\"]},\"sleep\":{\"title\":\"Quiet Sleeping Area\",\"items\":[\"The room may have soft chairs or cribs so that children can rest before the flight and mothers can relax.\"]},\"hygiene\":{\"title\":\"Hygiene Facilities\",\"items\":[\"Includes sinks, handwashing products, and possibly a bottle sterilizer and accessories for baby care.\"]}},\"equipment\":{\"title\":\"What Should Be in the Mother and Child Room\",\"items\":[\"Changing table or a comfortable area for diaper changes.\",\"Feeding chair with support for comfortable seating and breastfeeding or bottle feeding.\",\"Crib or a resting area for the child.\",\"Mirror for the mother and places to store personal items.\",\"Hygiene items: towels, handwashing liquid, and diaper disposal bins.\",\"Bottle sterilizer or food warmer.\",\"Access to drinking water or a way for the mother to get a beverage.\"]},\"services\":{\"title\":\"Access and Services\",\"freeUse\":{\"title\":\"Free Use\",\"text\":\"The mother and child room is provided free of charge to all eligible passengers (e.g. women with children under 2–3 years old).\"},\"availability\":{\"title\":\"Availability\",\"text\":\"The room is usually located near the waiting area or restrooms, allowing parents to access it easily and quickly.\"},\"comfort\":{\"title\":\"Rest Amenities\",\"text\":\"A pleasant atmosphere with sufficient lighting and warm or soft colors to create a comfortable environment for both child and mother.\"},\"conclusion\":\"Mother and child rooms are an important part of airport infrastructure, providing additional support for traveling families. They help make the journey more comfortable and convenient, especially for those flying with small children.\"},\"imageAlts\":{\"mother1\":\"Mother with child in the room\",\"mother2\":\"Mother with child\",\"mother3\":\"Access and services of the mother and child room\"}},\"prayerRoom\":{\"title\":\"Prayer Room in Airports of Kyrgyzstan\",\"description\":\"This is a specially equipped space for the prayer needs of Muslims, where they can perform salah (prayer) in accordance with religious traditions and customs. The prayer room offers a quiet and private space for comfortable prayer before or after a flight.\",\"functions\":{\"title\":\"Functions of the Prayer Room\",\"prayer\":{\"title\":\"Main Purpose\",\"items\":[\"The main function of the prayer room is to provide a suitable environment for Muslims to perform obligatory and additional prayers (salah) at a convenient time.\",\"The room offers privacy and quietness for prayer, especially when other parts of the airport are noisy and crowded.\"]},\"religious\":{\"title\":\"Religious Atmosphere\",\"items\":[\"The prayer room is a sacred space where cleanliness and religious order are maintained. It should be arranged to meet the needs of worshippers during prayer.\"]},\"privacy\":{\"title\":\"Ensuring Privacy\",\"items\":[\"The room provides private space for worshippers, as many Muslims prefer to pray alone or in small groups.\"]},\"rituals\":{\"title\":\"Support for Religious Rituals\",\"items\":[\"The prayer room also serves as a place for preparing for prayer, where Muslims can perform ablution (wudu) if needed.\"]}},\"access\":{\"title\":\"Who Can Use the Prayer Room\",\"muslims\":{\"title\":\"Muslims\",\"text\":\"The primary users of the prayer room are Muslims who need to perform prayers before or after their flight.\"},\"cleanState\":{\"title\":\"Passengers in a State of Ritual Purity\",\"text\":\"Those who have performed ablution and are in a state of ritual purity may use the prayer room for worship.\"},\"allMuslims\":{\"title\":\"All Muslims Regardless of Age or Gender\",\"text\":\"The prayer room is intended for both men and women and usually has separate areas to ensure privacy.\"}},\"services\":{\"title\":\"Access and Services\",\"freeUse\":{\"title\":\"Free Access\",\"text\":\"The prayer room is usually available to all passengers free of charge, regardless of class of service, provided they meet religious requirements.\"},\"availability\":{\"title\":\"Availability\",\"text\":\"The room is located in a convenient area within the airport, near waiting areas or corridors, so that worshippers can easily find and use it.\"},\"workingHours\":{\"title\":\"Operating Hours\",\"text\":\"The prayer room operates 24/7, allowing worship at any time of day, especially in large international airports.\"},\"conclusion\":\"The prayer room is an important part of airport infrastructure for Muslims, ensuring comfort and adherence to religious traditions during travel. It helps believers stay connected to their spiritual duties even in international transit hubs.\"},\"imageAlts\":{\"prayerRoom1\":\"Prayer room interior\",\"prayerRoom2\":\"Prayer room at the airport\",\"prayer\":\"Person praying\"}},\"parking\":{\"title\":\"Parking at Manas Airport\",\"automatedSystem\":{\"title\":\"Automated Parking System\",\"items\":[\"The Automated Parking System (APS) is a set of hardware and software tools designed to organize and modernize parking spaces to regulate entry and exit to/from the airport territory. The main goal of APS is to ensure order and passenger safety.\",\"The system includes automatic barriers, cameras and surveillance equipment. The video surveillance system registers all incoming and outgoing vehicles in a central database.\",\"The video system and IT program allow monitoring, recording and providing information about the type of vehicle, license plate number, vehicle location on the airport territory by time, and maintaining statistics for security purposes.\"]},\"payment\":{\"title\":\"Payment\",\"items\":[\"For convenient parking payment, you can use MBank mobile banking or pay via QR code at the parking meter. Simply scan the QR code from your device screen and complete the payment through the selected service.\"]},\"howItWorks\":{\"title\":\"How it works:\",\"items\":[\"When entering the parking lot, get a parking ticket.\",\"Use the terminal to pay for parking, choosing a convenient method - via MBank or QR code.\",\"Pay for parking using your mobile device or bank card.\",\"After payment, take the receipt and leave the parking lot.\"],\"conclusion\":\"The automated parking system allows you to pay for services quickly and conveniently, avoiding the need for long waits.\"},\"imageAlts\":{\"parking\":\"Airport parking\"}},\"dutyFree\":{\"title\":\"Duty Free at Manas Airport\",\"description\":\"Discover the world of tax-free shopping at Manas Airport Duty Free! Here you'll find a wide range of products at attractive prices without taxes.\",\"advantages\":{\"title\":\"Duty Free Benefits\",\"products\":{\"title\":\"What awaits you at Duty Free?\",\"items\":[\"Perfumes and cosmetics - the best world brands at competitive prices\",\"Alcoholic beverages - premium wines, whiskey, cognacs and liqueurs\",\"Chocolate and sweets - exquisite treats for yourself and as gifts\",\"Accessories and souvenirs - stylish items and memorable gifts\"]},\"benefits\":{\"title\":\"Benefits of Duty Free shopping:\",\"items\":[\"Tax-free competitive prices\",\"Original products from famous brands\",\"Convenient location in the departure hall\"]}},\"info\":{\"title\":\"Information\",\"text\":\"Manas Airport's catering center is a reliable supplier of quality meals for airlines, providing fresh meals and high-quality service on board!\\n\\nPassengers can shop for famous brands using cash or cashless payment. For customer convenience, the Duty Free shop accepts all major bank cards (including Mir cards) and three currencies: Ruble, Dollar and Euro. We will be happy to welcome you as our guest.\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"partners@airports.kg\"},\"phone\":{\"label\":\"Phone:\",\"value\":\"+996 (312) 123-456\"}}},\"imageAlts\":{\"dutyFree\":\"Duty Free shop\"}},\"taxi\":{\"title\":\"Taxi at Manas Airport\",\"description\":\"Getting from Manas Airport to the city is easy and convenient with official taxis. Comfortable vehicles and professional drivers will provide you with a safe and fast trip.\\n\\nManas Airport Taxi is a modern city taxi service. The main priorities of the service are comfort, safety and high service. Service and consultation are available in Kyrgyz, Russian and English. All vehicles have branded airplane-shaped roof signs; equipped with power package, stereo system, dashcam, GPS navigation, first aid kit and fire extinguisher. Drivers undergo drug and medical examinations.\",\"advantages\":{\"title\":\"Advantages of airport taxi:\",\"items\":[\"24/7 availability - taxi operates around the clock\",\"Fixed rates with no hidden fees\",\"Convenient parking location near the terminal exit\",\"Comfortable vehicles of different classes\"]},\"howToUse\":{\"title\":\"How to use a taxi?\",\"items\":[\"Find the taxi booking desk in the arrivals area.\",\"Choose your desired route and receive a receipt with a fixed price.\",\"Proceed to the official taxi stand and enjoy your ride.\"]},\"info\":{\"title\":\"Information\",\"text\":\"Manas Airport Taxi is a reliable and convenient means of transportation, providing comfortable, safe and fast travel for passengers at any time of the day!\",\"contacts\":{\"email\":{\"label\":\"Email:\",\"value\":\"manastaxi.kg@gmail.com\"},\"site\":{\"label\":\"Website:\",\"value\":\"manastaxi.kg\"},\"phone\":{\"label\":\"Phone:\",\"value1\":\"+(996) 550 693 000\",\"value2\":\"+(996) 550 693 000\",\"value3\":\"+(312) 693 000\"}}},\"imageAlts\":{\"taxi\":\"Airport taxi\"}},\"asmanAirlines\":{\"companyName\":\"Asman Airlines\",\"description\":{\"intro\":\"LLC «Asman Airlines» is the first state-owned airline of Kyrgyzstan, established in 2023 as a 100% subsidiary of OJSC «Manas International Airport». The company aims to develop domestic air transportation, improve regional transport accessibility, and strengthen Kyrgyzstan's position in regional and international aviation markets.\",\"routes\":{\"title\":\"Route Network Development\",\"text\":\"Since commencing operations in September 2024, the airline has been operating regular flights from Bishkek to the following destinations:\\n\\nOsh, Talas, Jalal-Abad, Batken, Razzakov. Since November 2024, routes have been added to:\\n\\nKerben, Naryn, Karakol, Kazarman and other cities.\\n\\nThese flights help strengthen inter-regional connections, support business and tourism, and meet the needs of residents in remote areas of the country\"},\"fleet\":{\"title\":\"Fleet and Service\",\"intro\":\"The airline operates modern Canadian Dash 8-Q400 aircraft, which feature:\",\"features\":[\"High fuel efficiency\",\"Reliability and passenger comfort\",\"Ability to operate on short runways, making them ideal for regional airports in Kyrgyzstan\"],\"conclusion\":\"Passengers can expect quality service, comfortable flight conditions and flexible pricing policy on board.\"},\"future\":{\"title\":\"Future of Kyrgyz Aviation\",\"text\":\"OJSC «Airports of Kyrgyzstan» invites airlines to cooperate, actively expands its route network and utilizes the opportunities of the «Fifth Freedom of the Air».\\n\\nOur efforts are aimed at developing modern and safe aviation infrastructure for the convenience of passengers and partners!\"}},\"imageAlts\":{\"routeMap\":\"Asman Airlines route map\",\"aircraft\":\"Asman Airlines aircraft\",\"cooperation\":\"Cooperation in Kyrgyz aviation\"}},\"asmanOilCompany\":{\"companyName\":\"Asman Oil Company\",\"description\":\"LLC Asman Oil Company is a key subsidiary of OJSC «Airports of Kyrgyzstan», founded in 2003. The company's main activities are related to the reception, storage and preparation of aviation fuel, as well as special fluid for aircraft refueling.\",\"activities\":{\"title\":\"Activities and achievements\",\"cards\":[{\"title\":\"Infrastructure\",\"content\":\"The company has modern refueling complexes equipped with high-tech equipment. This ensures reliable storage and timely supply of fuel for all types of aircraft.\"},{\"title\":\"Quality\",\"content\":\"Asman Oil Company strictly complies with the requirements of the Kyrgyz Republic and international standards for flight safety. Quality control is carried out at each stage of the technological chain.\"},{\"title\":\"Service\",\"content\":\"The company refuels aircraft of both domestic and foreign airlines, serving flights at all airports in Kyrgyzstan. Among the clients are the largest international carriers.\"},{\"title\":\"Ecology\",\"content\":\"The introduction of environmentally friendly technologies helps to minimize the impact on the environment.\"},{\"title\":\"Development\",\"content\":\"In 2024, the company expanded its fuel storage capacity to meet the growing passenger traffic and cargo transportation.\"}]}},\"vipLounge\":{\"title\":\"VIP Service at the Airport - Prestige, Comfort and Attention to Every Detail.\",\"description\":{\"part1\":\"We are pleased to offer our passengers exclusive conditions for comfortable and peaceful travel using the VIP terminal.\",\"part2\":\"Every major international airport has a VIP lounge operating 24 hours a day. This is an area for business people who value their time and comfort.\",\"part3\":\"Safety, excellence and convenience are the main priorities of the VIP lounge. The philosophy of enhanced service is simple: professional and individual approach to each guest.\",\"part4\":\"To use the lounge services, you need to provide the agents with passenger data, departure or arrival date, flight number and make a payment. Service is provided at commercial rates.\"},\"advantagesTitle\":\"Advantages of VIP Service\"},\"procurement\":{\"steps\":[{\"number\":1,\"title\":\"Registration on the Public Procurement Portal\",\"details\":[\"The participant must be registered on the official public procurement portal\"]},{\"number\":2,\"title\":\"Legal Status\",\"details\":[\"The participant must be: A legal entity (company or organization)\",\"Or: An individual entrepreneur (IE)\"]},{\"number\":3,\"title\":\"Document Package for Participation\",\"details\":[\"Application for participation (completed in the prescribed form)\",\"Copy of registration (or re-registration) certificate for the legal entity or IE\",\"Taxpayer Identification Number (TIN)\",\"Certificate of no tax arrears\",\"Bank certificate (confirming no overdue debts and account availability)\",\"Certificate from the Social Fund confirming no arrears (sometimes upon request)\",\"Charter or founding documents (for legal entities)\",\"Portfolio/work experience (if required)\",\"Technical proposal (what and how will be delivered or done)\",\"Financial proposal (price)\",\"Letter of guarantee, if required\",\"Bank guarantee or bid security, if provided for\"]},{\"number\":4,\"title\":\"Compliance with Customer Criteria\",\"details\":[\"Relevant experience\",\"Technical and professional capacity\",\"No court rulings on bankruptcy or disqualification\"]},{\"number\":5,\"title\":\"Preparation and Submission of Tender Proposal\",\"details\":[\"Via the electronic portal\",\"Within the specified deadline\",\"In compliance with all requirements in the tender documentation\"]}],\"provisions\":\"General Provisions\",\"provisionsContent\":\"To participate in a tender in the Kyrgyz Republic (KR), participants must meet certain requirements established by law (in particular, the Law of the KR «On Public Procurement»), as well as specific tender conditions. Below is a general list of what is usually required:\",\"regulatoryDocs\":\"Regulatory documents\",\"regulatoryDocsContent\":\"Legislative and internal documents governing the procurement process:\",\"sampleDocs\":\"Sample documents\",\"sampleDocsContent\":\"Templates of applications, contracts and instructions required to participate in procurement:\"},\"handling\":{\"aboutTitle\":\"About Us\",\"aboutDescription\":\"The Handling Services Department (HSD) is a full-time structural subdivision of Manas International Airport. The department acts as a representative of airlines and also provides agency and handling services. We organize and coordinate all stages of ground handling of aircraft, passengers and cargo, ensuring a high level of service and compliance with international safety standards.\",\"advantagesTitle\":\"Benefits of working with us\",\"advantages\":[{\"title\":\"Professional team\",\"description\":\"Our specialists have many years of experience in the field of aviation ground handling and undergo regular training according to international standards.\"},{\"title\":\"24/7 service\",\"description\":\"We operate around the clock to provide prompt support and resolve any issues at any time of the day.\"},{\"title\":\"Individual approach\",\"description\":\"Optimal solutions are developed for each client, taking into account the specifics of the flight and the wishes of the airline.\"},{\"title\":\"Compliance with international standards\",\"description\":\"All activities comply with ICAO, IATA requirements and airport safety standards.\"},{\"title\":\"Efficiency and reliability\",\"description\":\"We guarantee timely completion of all operations and rapid response to any requests.\"}]}},\"ky\":{\"translation\":{\"aboutNavigation\":{\"boardOfDirectors\":\"Директорлор кеңеши\",\"managementMembers\":\"Башкармалыктын мүчөлөрү\",\"auditCommission\":\"Ички аудит кызматы\",\"team\":\"Команда\",\"companyPartners\":\"Коомдун өнөктөштөрү\",\"finance\":\"Каржы\",\"history\":\"Тарых\",\"antiCorruption\":\"Коррупцияга каршы саясат\"},\"mediaSlider\":{\"title\":\"Фото / Видео\"},\"search\":{\"placeholder\":\"Сайттан издөө...\",\"button\":\"Издөө\",\"noData\":\"Андай маалыматтар жок\"},\"navigation\":{\"aboutCompany\":\"Компания жөнүндө\",\"generalInformation\":\"Жалпы маалымат\",\"boardOfDirectors\":\"Директорлор кеңеши\",\"managementMembers\":\"Башкармалыктын мүчөлөрү\",\"auditCommission\":\"Ички аудит кызматы\",\"team\":\"Команда\",\"companyPartners\":\"Коомдун өнөктөштөрү\",\"finance\":\"Каржы\",\"productionAndTechnicalIndicators\":\"Өндүрүштүк жана техникалык көрсөткүчтөр\",\"airportTechnicalEquipment\":\"Аэропорттун техникалык жабдылышы\",\"flightSafety\":\"Учуш коопсуздугу\",\"history\":\"Тарых\",\"procurement\":\"Сатып алуу\",\"handling\":\"Хэндлинг\",\"antiCorruption\":\"Коррупцияга каршы саясат\",\"registration.title\":\"Жүргүнчүлөрдү каттоо тартиби\",\"subsidiaries\":\"Туунду компаниялар\",\"manasManagementCompany\":\"Манас Менеджмент Компаниясы\",\"manasTrainingCenter\":\"Манас окуу борбору\",\"asmanOilCompany\":\"Асман Ойл Компаниясы\",\"asmanAirlines\":\"Асман Эйрлайнс Компаниясы\",\"forPartners\":\"Өнөктөштөр үчүн\",\"cooperation\":\"Кызматташтык\",\"commercialServicesAdvertising\":\"Коммерциялык кызматтар жана жарнама\",\"officialDelegationHall\":\"Расмий делегациялар залы\",\"inFlightCateringCenter\":\"Учакта тамактануу борбору\",\"airCargoTerminal\":\"Жүк терминалы\",\"fuelFillingComplex\":\"Отун куюу комплекси\",\"forPassengers\":\"Жүргүнчүлөргө\",\"preFlightInspection\":\"Учууга чейинки текшерүү\",\"preFlightInspectionProcess\":\"Коопсуздук текшерүү процесси\",\"preFlightInspectionProhibited\":\"Тыюу салынган буюмдар жана заттар\",\"checkIn\":\"Каттоо\",\"borderControl\":\"Чек ара көзөмөлү\",\"customsControl\":\"Б \"membersBoards\":{\"title\":\"Башкармалыктын мүчөлөрү\"},\"team\":{\"title\":\"Команда\"},\"flightSafety\":{\"title\":\"Учуу коопсуздугу\",\"indicator1\":\"300+ камералар\",\"indicatorContent1\":\"Аэропорттун бардык аймагында CCTV\",\"indicator2\":\"24/7\",\"indicatorContent2\":\"24 саат аба мейкиндигин көзөмөлдөө\",\"cartInfo\":\"Учуу коопсуздугу\",\"description\":\"Консулдук кызмат жүргүнчүлөргө учуунун коопсуздугу менен байланышкан маселелерде жардам көрсөтөт жана өзгөчө кырдаалдарда зарыл жардам көрсөтөт.\"},\"generalInformation\":{\"title\":\"Жалпы маалымат\"},\"technicalEquipment\":{\"title\":\"Аэропорттун техникалык жабдылышы\"},\"technicalIndicators\":{\"title\":\"Ондуруштук-техникалык керсеткучтер\"},\"bussinesslounge\":{\"title\":\"Кыргызстан аэропортторунун бизнес залы\",\"services\":\"Кызматтар жана ыңгайлуулуктар:\"},\"vipLounge\":{\"title\":\"VIP зал\"},\"borderContrtol\":{\"title\":\"Чек ара көзөмөлү\"},\"childrenRoom\":{\"title\":\"Балдар бөлмөсү\",\"description\":\"Бул ымыркай жана жаш балдары бар аялдардын жайлуу болушу үчүн атайын жабдылган жай. Бул ата-энелерге саякат учурунда купуялуулукту, ыңгайлуулукту жана колдоону камсыз кылат.\"},\"consularService\":{\"title\":\"Консулдук кызмат\",\"name1\":\"Аэропорттогу консулдук кызмат:\",\"name2\":\"Функциялардын жана кызматтардын сүрөттөлүшү\",\"description1\":\"Кыргызстандын эл аралык аэропортторунда өкүлчүлүгү бар Консулдук кызмат өз өлкөсүнүн жарандарына укуктук колдоо көрсөтүүдө жана коргоодо, ошондой эле чет элдик жүргүнчүлөргө жардам көрсөтүүдө негизги ролду ойнойт.\",\"description2\":\"Ал компетенттүү дипломатиялык өкүлдөрдүн кийлигишүүсүн талап кылган кырдаалдарда ыкчам жардам көрсөтүү менен жүргүнчүлөр менен мамлекеттик органдардын ортосундагы байланыш болуп иштейт.\",\"consular.title\":\"Консулдук кызматтын негизги функциялары\",\"consular.section1.title\":\"Документтерди даярдоо жана берүү\",\"consular.section1.desc\":\"Консулдук кызмат документтик маселелерге кабылган жүргүнчүлөргө жардам берет\",\"consular.section1.card1.title\":\"Убактылуу жол жүрүү документтери:\",\"consular.section1.card1.item1\":\"Чет өлкөдө паспортун жоготкон же жарактуу документи жок жүргөн жарандарга мекенине кайтуу үчүн убактылуу күбөлүк даярдалат.\",\"consular.section1.card2.title\":\"Виза маселелери боюнча кеңештер:\",\"consular.section1.card2.item1\":\"Чет элдиктерге өлкөгө кирүү үчүн виза талаптары боюнча маалымат берүү.\",\"consular.section1.card2.item2\":\"Транзиттик визанын зарылдыгын тактоо.\",\"consular.section2.title\":\"Юридикалык жана укуктук жардам көрсөтүү\",\"consular.section2.desc\":\"Консулдук кызмат татаал кырдаалдарда укуктук жардам көрсөтөт:\",\"consular.section2.card1.title\":\"Кирүүгө тыюу салуу:\",\"consular.section2.card1.item1\":\"Чек ара кызматкерлери кирүүгө уруксат бербеген жүргүнчүлөргө кеңеш жана жардам көрсөтүлөт.\",\"consular.section2.card2.title\":\"Кармоо жана жаңжалдар:\",\"consular.section2.card2.item1\":\"Консулдук кызмат укук коргоо органдары тарабынан кармалган жүргүнчүлөргө ортомчу болуп, туугандарга кабар берип, укуктук жардам көрсөтөт.\",\"consular.section3.title\":\"Кырдаалдык жардам көрсөтүү\",\"consular.section3.desc\":\"Консулдук кызмат өзгөчө кырдаалдарда жарандарга шашылыш жардам көрсөтөт:\",\"consular.section3.card1.title\":\"Документтердин жоголушу\",\"consular.section3.card1.item1\":\"Паспортун жоготкон же уурдалган жүргүнчүлөргө документтерди калыбына келтирүүгө жана туугандар же расмий органдар менен байланышууга көмөк көрсөтүлөт.\",\"consular.section3.card2.title\":\"Медициналык жана гуманитардык учурлар\",\"consular.section3.card2.item1\":\"Кырсык, жаракат же оор абал болгон учурда медициналык жардам уюштурулат.\",\"consular.section3.card3.title\":\"Кризистик кырдаалдар\",\"consular.section3.card3.item1\":\"Жаратылыш кырсыктары, террордук актылар сыяктуу кырдаалдарда консулдук кызмат жарандарды эвакуациялоону жана кайтарууну уюштурат.\",\"consular.info.title\":\"Маалыматтык-консультациялык кызматтар\",\"consular.info.list.title\":\"Консулдук кызмат төмөнкү темалар боюнча маалымат берет\",\"consular.info.item1\":\"Бара турган же транзиттик өлкөгө кирүү жана чыгуу эрежелери.\",\"consular.info.item2\":\"Виза талаптары, жүктү жана жеке буюмдарды ташуу чектөөлөрү.\",\"consular.info.item3\":\"Айрым өлкөлөргө же аймактарга баруудагы мүмкүн болгон коркунучтар.\",\"consular.support.title\":\"Атайын жардам талап кылган жүргүнчүлөр\",\"consular.support.desc\":\"Консулдук кызмат кыйынчылыкка кабылышы мүмкүн болгон жүргүнчүлөргө өзгөчө көңүл бурат\",\"consular.support.card1.title\":\"Чоңдордун коштоосу жок балдар\",\"consular.support.card1.item1\":\"Баланы коштогон адамдарга өткөрүп берүүгө жардам көрсөтүү, транзиттин коопсуздугуна көз салуу.\",\"consular.support.card2.title\":\"Мүмкүнчүлүгү чектелген адамдар\",\"consular.support.card2.item1\":\"Зарыл кызматтарды жана маалыматты алууга көмөк көрсөтүү.\",\"consular.support.card3.title\":\"Улуу курактагы адамдар\",\"consular.support.card3.item1\":\"Виза жана миграция маселелерин чечүүгө жардам берүү, өзгөчө кырдаалдарда колдоо көрсөтүү.\",\"consular.when.title\":\"Консулдук кызматка качан жана кантип кайрылуу керек\",\"consular.when.item1\":\"Документтердин жоголушу же уурдалышы.\",\"consular.when.item2\":\"Кармалуу же өлкөгө кирүүгө тыюу салынуу.\",\"consular.when.item3\":\"Документтерди тез арада даярдоо же укуктук жардам зарыл болгон учурда.\",\"consular.when.item4\":\"Шашылыш кийлигишүүнү талап кылган өзгөчө кырдаалдар.\",\"consular.when.desc\":\"Консулдук кызматка кайрылуу үчүн жүргүнчү эл аралык учуу же келүү зонасындагы тиешелүү кеңсеге кайрылып же аэропорттогу маалымат такталарында көрсөтүлгөн телефон аркылуу байланышса болот.\",\"consular.tips.title\":\"Мыкты сунуштар\",\"consular.tips.item1\":\"Документтердин көчүрмөлөрүн жана консулдук кызматтардын байланыштарын ар дайым алып жүрүңүз.\",\"consular.tips.item2\":\"Документтер жоголгондо дароо консулдук өкүлдөргө же милицияга кайрылыңыз.\",\"consular.tips.item3\":\"Кырдаалды тез жана натыйжалуу чечүү үчүн консулдук кызматтын көрсөтмөлөрүн аткарыңыз.\",\"consular.tips.desc\":\"Консулдук кызмат — ар бир жүргүнчү үчүн коопсуз жана ыңгайлуу саякатты камсыз кылууда ишенимдүү жардамчы.\"},\"customsControl\":{\"title\":\"Бажы көзөмөлү\"},\"dutyFree\":{\"title\":\"Алымсыз\"},\"baggage\":{\"title\":\"Багаж\"},\"motherRoom\":{\"title\":\"Эне жана бала бөлмөсү\",\"description\":\"Бул ымыркай жана жаш балдары бар аялдардын жайлуу болушу үчүн атайын жабдылган жай. Бул ата-энелерге саякат учурунда купуялуулукту, ыңгайлуулукту жана колдоону камсыз кылат.\"},\"parking\":{\"title\":\"Паркинг\",\"description\":\"Бул жүргүнчүлөрдүн жана аэропорттун конокторунун унааларын ыңгайлуу жана коопсуз жайгаштыруу үчүн атайын жабдылган жай. Унаа токтотуучу жай комфортту, коопсуздукту жана төлөөнүн жеңилдигин камсыз кылган заманбап технологиялар менен жабдылган.\"},\"peopleDisabilities\":{\"title\":\"Мүмкүнчүлүгү чектелген адамдар үчүн\"},\"police\":{\"title\":\"Милиция\"},\"prayerRoom\":{\"title\":\"Намазкана\"},\"preFlightInspection\":{\"title\":\"Учуу алдындагы текшерүү\"},\"registration\":{\"title\":\"Каттоо\"},\"taxi\":{\"title\":\"Такси\"},\"transportationAnimals\":{\"title\":\"Жаныбарларды ташуу\"},\"asmanAirlines\":{\"title\":\"«Asman Airlines» авиакомпаниясы\",\"description\":\"Бул «Кыргызстандын аэропорттору» ААКсынын алкагында иш алып барган авиациялык тармак үчүн жогорку квалификациялуу адистерди даярдоого адистешкен алдыңкы окуу борбору.\"},\"asmanOilCompany\":{\"title\":\"Асман мунай компаниясы\",\"description\":\"Бул «Кыргызстандын аэропорттору» ААКсынын алкагында иш алып барган авиациялык тармак үчүн жогорку квалификациялуу адистерди даярдоого адистешкен алдыңкы окуу борбору.\"},\"manasMenegement\":{\"title\":\"Манас Менеджмент Компаниясы\",\"description\":\"Бул «Кыргызстандын аэропорттору» ААКсынын алкагында иштеген логистикалык жана жүк ташуу системасынын эң маанилүү звеносу.\",\"description2\":\"2000-жылдан бери «Кыргызстан аэропорттору» ААКсынын Учуудагы тамактануу борбору жүргүнчүлөрдү жана учактын экипаждарын эл аралык стандарттарга ылайык даярдалган сапаттуу тамактар ​​менен камсыз кылып келет.\",\"firstIndicatortext\":\"Аянты менен заманбап борбор\",\"firstIndicatorNumber\":\"3960 кв.м.\",\"secondIndicatortext\":\"ВГЦ чейин тейлөөгө жөндөмдүү\",\"secondIndicatorNumber\":\"100 миң тонна\",\"logisFirstIndicatortext\":\"Аянты менен заманбап борбор\",\"logisFirstIndicatorNumber\":\"850 кв\",\"logisSecondIndicatortext\":\"Эл аралык сертификат\",\"logisSecondIndicatorNumber\":\"ISO 22000\"},\"trainingCenter\":{\"title\":\"«Манас Тренинг Центр» окуу борбору\",\"description\":\"Бул «Кыргызстандын аэропорттору» ААКсынын алкагында иш алып барган авиациялык тармак үчүн жогорку квалификациялуу адистерди даярдоого адистешкен алдыңкы окуу борбору.\",\"description2\":\"Борбордо окутуу адистерге мүмкүн болушунча реалдуу кырдаалдарга жакын болгон көндүмдөрдү алууга жардам берген алдыңкы ыкмалар менен жүргүзүлөт.\",\"simulators1\":\"Билим берүү кызматтарынын кеңири спектри\",\"simulators2\":\"Учурдагы симуляторлор\",\"simulators3\":\"Заманбап симуляторлор\"},\"airCargoTerminal\":{\"title\":\"Аба жүк терминалы\",\"name1\":\"Аба жүк терминалы\",\"description1\":\"«Манас» эл аралык аэропортунун авиажүк терминалы – жүктөрдү эффективдүү башкарууну жана ташууну камсыз кылган заманбап логистикалык комплекс. Стратегиялык жайгашуусу, өнүккөн инфраструктурасы жана алдыңкы технологиялары менен терминал эл аралык жана аймактык жүк ташуудагы негизги звено болуп саналат.\",\"name2\":\"Биздин мүмкүнчүлүктөр\",\"description2\":\"Ар кандай жүктөрдү кайра иштетүү: жалпы, тез бузулуучу, коркунучтуу, баалуу, тирүү жаныбарлар. Контролдук температура шарттары менен заманбап кампалар. Жүктөрдү тез арада жол-жоболоштуруу жана экспедициялоо, анын ичинде бажылык колдоо. Интегралдык логистика: кабыл алуу, сактоо, сорттоо, кайра жүктөө жана жөнөтүү. Авиакомпаниялар, экспедиторлор жана жүк жөнөтүүчүлөр менен кызматташуунун ийкемдүү шарттары.\",\"name3\":\"Инфраструктура\",\"description3\":\"Заманбап коопсуздук системалары жана видео көзөмөлү бар кенен кампалар. Тез бузулуучу товарларды сактоо үчүн муздаткыч жана тоңдургуч камералар. Эл аралык коопсуздук стандарттарына ылайык кооптуу жүктөрдү иштетүү аймагы. Жүктөрдү так көзөмөлдөө үчүн автоматташтырылган эсепке алуу жана башкаруу системалары.\",\"name4\":\"Артыкчылыктары\",\"description4\":\"Ыңгайлуу жайгашкан жана негизги эл аралык каттамдарга жетүү. Жүк ташуунун жогорку ылдамдыгы жана минималдуу күтүү убактысы. 24/7 иштөө жана ыкчам кардарларды колдоо. VGC заманбап жабдуулар жана атайын техникалар менен жабдылган, бул бир эле учурда Боинг 747-400, АН-124 же ИЛ-76 тибиндеги эки учакты жүктөөгө же түшүрүүгө мүмкүндүк берет. Иштейт: 24/7. Жүк терминалынын кубаттуулугу: 100 000 тонна/жыл\"},\"cateringCenter\":{\"title\":\"Учакта тамактануу борбору\",\"name1\":\"Учакта тамактануу борбору\",\"description1\":\"“Манас” эл аралык аэропортунун борттогу тамактануу борбору авиакомпанияларга бортто жаңы жана сапаттуу тамактарды даярдоо жана жеткирүү боюнча кызматтардын кеңири спектрин сунуштайт. Биз жүргүнчүлөрдү жана экипаждарды даамдуу, коопсуз жана эл аралык стандарттарга жооп берген түрдүү тамак-аш менен камсыздайбыз.\",\"name2\":\"Биздин мүмкүнчүлүктөр\",\"description2\":\"Ар бир этапта заманбап технологиялар жана катуу сапатты көзөмөлдөө. Толук өндүрүш цикли: сатып алуу, сактоо, даярдоо, таңгактоо жана жеткирүү. Ийкемдүү логистика жана учакта тамак-ашты тез жеткирүү. Авиакомпаниянын талаптарына ылайык жеке менюларды иштеп чыгуу.\",\"name3\":\"Тамак-аштын түрлөрү\",\"description3\":\"Стандарттык меню – эконом жана бизнес класстагы жүргүнчүлөр үчүн тең салмактуу тамак-аш. Атайын диеталар – балдар, вегетариандык, халал, кошер, диабетик жана башка диеталар. VIP меню – премиум сервис үчүн эң сонун тамактар. Экипаждын тамактары – учуу экипаждары жана кызматкерлер үчүн оптималдаштырылган тамактар.\",\"name4\":\"Өндүрүш кубаттуулугу\",\"description4\":\"Кубаттуулугу күнүнө X миң порцияга чейин. Эл аралык сертификаты бар заманбап ашканалар (HACCP, ISO). Ар кандай тамак-аш категориялары үчүн өзүнчө бышыруу линиялары.\",\"name5\":\"Авиакомпаниялар менен кызматташуу\",\"description5\":\"Өнөктөштөрдүн каалоолорун эске алуу менен жеке келишимдин шарттары. Эл аралык авиациялык стандарттарга ылайык келүү. Күнү-түнү иштөө жана шашылыш учуу тейлөө мүмкүнчүлүгү.\",\"name6\":\"Маалымат\",\"description6_1\":\"«Манас» аэропортунун учакта тамактануу борбору авиакомпаниялар үчүн ишенимдүү өнөктөш, бортто жогорку сапаттагы тамак-ашты жана мыкты тейлөөнү камсыз кылат!\",\"description6_2\":\"Учуудагы тамак-ашты өндүрүү жана жеткирүү менен алектенген компаниялар Кыргыз Республикасынын Жарандык авиация агенттигинин сертификациялык талаптарына ылайык келүүсүнө милдеттүү сертификациядан өтүшү керек (APCR 21 «Жер үстүндөгү тейлөө уюмдарын сертификациялоо» боюнча)\"},\"commercialServices\":{\"title\":\"Коммерциялык кызматтар жана жарнама\",\"name\":\"Коммерциялык эмес авиациялык кызматтар\",\"description\":\"Биз 5 эл аралык аэропорттун аэропорт терминалдарында/аэропорт аймактарында ар кандай кызматтар үчүн арналган бош орундарды сунуштайбыз.\",\"optionTitle\":\"Жеткиликтүү кызматтар:\",\"option1\":\"Авиа билет кассасы\",\"option2\":\"Автомат (жанындагы аймакты пайдалануу шартында)\",\"option3\":\"Массаж креслосу (кошуна жайгашкан аймакты пайдалануу шартында)\",\"option4\":\"Төлөм терминалы (жанындагы аймакты пайдалануу шартында)\",\"option5\":\"Банкомат (кошуна жайгашкан аймакты колдонуу шартында)\",\"option6\":\"Кофе дүкөн/кафе/бар\",\"option7\":\"Банк/сактык касса/банктык кызматтар\",\"option8\":\"Алмашуу бюросу\",\"option9\":\"Аптека\",\"option10\":\"жана башка көптөгөн нерселер\",\"optionTitle1\":\"Аренда шарттары:\",\"option11\":\"Эл аралык аэропорттордо коммерциялык жайларды ижарага алуу үчүн ижара акысы региондук рынокту эске алуу менен иштелип чыгат.\",\"option12\":\"Ижара чыгымдары объекттин зоналарга бөлүнүшүнө, ошондой эле ижаранын көлөмүнө жана шарттарына жараша болот.\",\"option13\":\"Ижара шарттары потенциалдуу кардарлардын/ижарачылардын коммерциялык сунуштарына жараша болот.\",\"contactTitle\":\"Байланыш үчүн байланыш маалыматы:\",\"email\":\"Электрондук дарек:\",\"phone\":\"Телефон:\"},\"cooperation\":{\"title\":\"Кызматташуу\",\"name1\":\"Кызматташуу.\",\"description1\":\"«Кыргызстандын аэропорттору» ААК авиация, логистика, коммерциялык кыймылсыз мүлк, жарнама жана башка тармактарда бизнести өнүктүрүүгө кызыкдар болгон компанияларды жана өнөктөштөрдү узак мөөнөттүү жана өз ара пайдалуу кызматташууга чакырат. «Манас» аэропорту региондогу негизги транспорттук түйүн болуп саналат жана биргелешкен иш жана долбоорду ишке ашыруу үчүн уникалдуу мүмкүнчүлүктөрдү сунуштайт. Аэропорттун кирешелери чет өлкөлүк инвесторлорду жана чет өлкөлүк авиакомпанияларды тартуу менен иш-чаралардын көлөмүн көбөйтүүнүн эсебинен көбөйтүлөт, буга байланыштуу ишкана үчүн жагымдуу бизнес-чөйрөнү өнүктүрүүгө чоң көңүл бурулууда.\",\"name2\":\"Узак мөөнөттүү перспективалар:\",\"description2\":\"Биз өнөктөштөр менен узак мөөнөттүү мамилелерди түзүүгө кызыкдарбыз, бул туруктуулукту жана бизнестин өсүшүн камсыз кылат.\",\"name3\":\"Бардык этаптарда колдоо:\",\"description3\":\"Биздин команда сүйлөшүүлөрдөн баштап долбоорду ишке ашырууга чейинки кызматташтыктын бардык баскычтарында ар тараптуу колдоо көрсөтөт.\",\"name4\":\"Эл аралык деңгээл:\",\"description4\":\"«Кыргызстандын аэропорттору» ААК эл аралык стандарттарга жооп берет, бул өнөктөштөрдүн жаңы рынокторго чыгуусуна шарт түзөт.\",\"name5\":\"Стратегиялык жайгашкан\",\"description5\":\"«Кыргызстандын аэропорттору» ААК Кыргызстандын борбору Бишкекке жакын жайгашкандыктан, аны өлкө үчүн гана эмес, бүтүндөй Борбор Азия чөлкөмү үчүн маанилүү логистикалык борборго айландырат. Бул аймакта өздөрүнүн катышуусун кеңейтүүнү каалаган компаниялар үчүн идеалдуу жер.\",\"name6\":\"Жогорку жүргүнчүлөр\",\"description6\":\"«Манас» аэропорту жыл сайын [санын киргизиңиз] жүргүнчүлөрдү тейлейт, бул жарнама, чекене соода жана кызмат көрсөтүү үчүн олуттуу мүмкүнчүлүктөрдү ачат. Биз бул аудиторияга ар кандай каналдар аркылуу кирүүнү сунуштайбыз.\",\"name7\":\"Кызматташтыктын ийкемдүү шарттары\",\"description7\":\"Биз сиздин бизнесиңиздин өзгөчөлүктөрүн эске алуу менен ар бир өнөктөшкө жеке мамилени сунуштайбыз. Биздин команда эки тарапка тең пайдалуу кызматташтыктын ийкемдүү шарттарын иштеп чыгууга даяр.\",\"name8\":\"Заманбап инфраструктура\",\"description8\":\"Аэропорт алдыңкы технологиялар менен жабдылган жана эл аралык стандарттарга жооп берет. Буга заманбап терминалдар, жүк ташуучу объекттер, коопсуздук системалары жана логистикалык чечимдер кирет.\",\"name9\":\"Инвестициялык мүмкүнчүлүктөр\",\"description9\":\"«Кыргызстандын аэропорттору» ААК жигердүү өнүгүп жатат жана биз коммерциялык кыймылсыз мүлктү куруу, логистикалык борборлорду өнүктүрүү, инновациялык технологияларды киргизүү жана башка көптөгөн долбоорлорго инвестицияларды кубаттайбыз.\",\"name10\":\"Кызматташтыкты кантип баштоо керек?\",\"description10\":\"”Манас” аэропорту менен кызматташууга кызыкдар болсоңуз, чоо-жайын талкуулоо үчүн биз менен байланышыңыз. Биз сиздин сунуштарыңызды карап чыгууга жана бизнес максаттарыңызга жооп бере турган жеке шарттарды иштеп чыгууга даярбыз.\",\"link\":\"Аэропорттук жабдуулар технологиясы (аймактык жана эл аралык)\",\"name11\":\"Байланыш үчүн байланыш маалыматы:\",\"address\":\"Дарек:\",\"contactAddress\":\"Бишкек шаары, Манас көчөсү, 123\"},\"fuelFillingComplex\":{\"title\":\"Күйүүчү май куюучу комплекс\",\"name1\":\"Күйүүчү май комплекси.\",\"description1\":\"“Манас” эл аралык аэропортунун күйүүчү май куюу комплекси учактарды сапаттуу авиа күйүүчү май менен үзгүлтүксүз куюуну камсыздайт. Заманбап технологиялар, катуу коопсуздук көзөмөлү жана эл аралык стандарттарга ылайык келүү отун менен камсыздоонун ишенимдүүлүгүн жана натыйжалуулугун кепилдейт.\",\"name2\":\"Негизги өзгөчөлүктөрү\",\"description2\":\"Күйүүчү май менен камсыздоонун толук цикли: кабыл алуу, сактоо, сапатты көзөмөлдөө жана май куюу. Күйүүчү майды эсепке алуунун жана башкаруунун автоматташтырылган системалары. Эл аралык коопсуздук талаптарына жана экологиялык стандарттарга ылайыктуу. Авиакомпаниялар жана операторлор менен кызматташуунун ийкемдүү шарттары.\",\"name3\":\"Инфраструктура\",\"description3\":\"Көп деңгээлдүү коргоо системасы менен заманбап күйүүчү май сактоочу резервуарлар. Жогорку кубаттуулуктагы май куюучу адистештирилген машиналар. Күйүүчү майдын сапатын текшерүү лабораториясы сертификатталган жабдуулар менен.\",\"name4\":\"Артыкчылыктары\",\"description4\":\"Жогорку май куюу ылдамдыгы жана учакты тейлөөнүн минималдуу убактысы. 24 саат бою иштөө жана кардарлардын суроо-талаптарына ыкчам жооп берүү. Ийкемдүү тарифтер жана ар бир өнөктөш үчүн жеке мамиле.\"},\"hallDelegationsPage\":{\"title\":\"Расмий делегациялар залы\",\"name1\":\"Делегациянын расмий залы\",\"description1\":\"«Манас» эл аралык аэропортунун расмий делегациялар залы — бул жогорку даражалуу конокторду, расмий адамдарды, дипломатиялык миссияларды, ошондой эле жогорку деңгээлдеги комфортту, купуялуулукту жана жеке тейлөөнү тандаган жүргүнчүлөрдү тейлөө үчүн атайын уюштурулган мейкиндик. Биз бардык формалдуулуктардан өзүнчө аймакта тез жана ыңгайлуу өтүүнү камсыз кылабыз, жалпы кезектерде күтүүнү жокко чыгарабыз.\",\"name2\":\"Брондоо жана кызматтар тууралуу маалымат\",\"description2\":\"Кызмат көрсөтүүнүн баасы көрсөтүлүүчү кызматтардын тизмесине жана жүргүнчүлөрдүн категориясына жараша аныкталат.\",\"strong\":\"Конокторго сунушталган кызматтар:\",\"content1\":\"- авиабилеттерди жана зарыл болгон документтерди тариздөө\",\"content2\":\"- паспорттук жана бажы көзөмөлүн жүргүнчүлөрдүн жалпы агымынан тышкары өтүү\",\"content3\":\"- жүктү тариздөө жана аны аба кемесине же залга жеткирүү\",\"content4\":\"- TV жана Wi-Fi\",\"content5\":\"- салкындатуучу жана спирттик ичимдиктер бар бар\",\"content6\":\"- жүргүнчүлөр үчүн эс алуу бөлмөсү\",\"content7\":\"- ишкердик жолугушуулар үчүн конференц-зал\",\"content8\":\"- жүргүнчүлөрдү ыңгайлуу микроавтобус менен аба кемесине же залга жеткирүү\",\"content9\":\"- зарыл болгон учурда ыкчам жеткирүү менен такси уюштуруу\",\"content10\":\"Жеткиликтүү тарифтер жана ээлөө шарттары тууралуу көбүрөөк билүү үчүн биз менен байланышыңыз. Биз эксклюзивдүү тейлөөгө жана комфорттун жогорку деңгээлине кепилдик беребиз!\"},\"personnel\":\"Кызматкерлер\",\"aviationObjects\":\"Авиациялык объектилер\",\"passengersAndTransport\":\"Жүргүнчүлөр жана транспорт\",\"service\":\"Сервис\",\"infrastructure\":\"Инфраструктура\",\"events\":\"Иш-чаралар\",\"showMore\":\"Көбүрөөк көрсөтүү\",\"showMoreImages\":\"Сүрөттөрдү көбүрөөк көрсөтүү\",\"all\":\"Баары\",\"airports\":{\"InternationalAirports\":\"Кыргызстандын эл аралык аэропорттору\",\"description\":\"Кыргызстандын аэропорттору | Аэропорттор\",\"RegionalAirports\":\"Кыргызстандын аймактык аэропорттору\",\"flightSchedule\":\"Учуу графиги\",\"currentInformation\":\"Учуп келүү жана учуп кетүү боюнча учурдагы маалымат:\",\"airportNotFound\":\"Аэропорт табылган жок\",\"dataIsMissing\":\"Маалымат жок\",\"selectPlaceholder\":\"Аэропортту тандаңыз\",\"currentTemperature\":\"Учурдагы температура\",\"noWeatherData\":\"Аба ырайы тууралуу маалымат жок\"},\"arrivals\":\"Келгендер\",\"departures\":\"Кетүү\",\"flight\":\"Рейс\",\"airport\":\"Маршрут\",\"scheduledDate\":\"План дата\",\"actualDate\":\"Факт дата\",\"scheduled\":\"Пландаштырылган\",\"actual\":\"Чыныгы\",\"status\":\"Статус\",\"regularity\":\"Регулярдуулук\",\"airline\":\"Авиакомпания\",\"short_flight\":\"Рейс\",\"short_airport\":\"Мршт\",\"short_scheduledDate\":\"Плн. дата\",\"short_actualDate\":\"Фкт. дата\",\"short_scheduled\":\"План.\",\"short_actual\":\"Факт.\",\"short_status\":\"Статус\",\"short_regularity\":\"Регул.\",\"news\":{\"noPicture\":\"Сүрөт жок\",\"videoFromMediaSlider\":\"Медиа слайдеринен видео\",\"latestNews\":\"Акыркы кабарлар\",\"viewAll\":\"Бардык жаңылыктар\",\"noPosts\":\"Жаңылыктар табылган жок\",\"loadError\":\"Жаңылыктар жүктөлгөн жок\",\"title\":\"Жаңылыктар\",\"description\":\"Кыргызстандын аэропорттору | Жаңылыктар\",\"notFound\":\"Барак табылган жок\",\"pageNotFoundDescription\":\"Барактын сүрөттөлүшү табылган жок\"},\"gallery\":{\"title\":\"Галерея\",\"description\":\"Кыргызстандын аэропорттору | Галерея\"},\"contacts\":{\"title\":\"Байланыштар\",\"description\":\"Кыргызстандын аэропорттору | Байланыштар\"},\"advertising\":{\"title\":\"Аэропорттогу жарнама\",\"text\":\"Кыргызстандын аэропортторундагы жарнама мүмкүнчүлүктөрү сиздин брендиңизге максималдуу жетүүгө жардам берет. Жарнамаңызды стратегиялык маанилүү сайттарга жайгаштырыңыз:\",\"phoneText\":\"Каалаган убакта чалыңыз\",\"readMore\":\"Кененирээк\"},\"mainOffer\":{\"smallSlogan\":\"Сиз эмне аласыз\",\"findoUTmore\":\"Көбүрөөк билүү\"}},\"borderControl\":{\"steps\":[{\"number\":1,\"title\":\"Чек ара текшерүү кабинкесине жакындоо\",\"description\":\"Нускамаларга ылайык кезекке туруп, кезегиңизди күтүңүз.\"},{\"number\":2,\"title\":\"Документтерди тапшыруу\",\"description\":\"Паспорт жана башка керектүү документтерди чек ара кызматкерине текшерүүгө бериңиз.\"},{\"number\":3,\"title\":\"Маалыматтарды текшерүү\",\"description\":\"Чек ара кызматкери төмөнкүлөрдү текшерет:\",\"details\":[\"Документтердин аныктыгы\",\"Кирүү же чыгуунун мыйзамдуулугу\",\"Виза бар же жоктугу жана визалык талаптардын сакталышы\"]},{\"number\":4,\"title\":\"Кошумча суроолор\",\"description\":\"Кызматкер төмөнкү суроолорду берүү мүмкүн:\",\"details\":[\"Сапардын максаты (туризм, иш, окуу, транзит)\",\"Бара турган өлкөдө жашай турган жериңиз\",\"Пландалган жашоо мөөнөтү\"]},{\"number\":5,\"title\":\"Белги коюу\",\"description\":\"Ийгиликтүү текшерүүдөн кийин кызматкер паспортуңузга кирүү же чыгуу белгисин коёт.\"}],\"documentReasons\":[\"Жасалма же бузулган документтер.\",\"Визалык эрежелерди бузуу же визанын жоктугу.\",\"Сапардын максатын ырастоочу документтердин жоктугу.\",\"Мыйзамдык негизде чыгууга тыюу салынган (мисалы, соттун чечими).\",\"Улуттук коопсуздукка же коомдук тартипке коркунуч.\"],\"title\":\"Мамлекеттик чек арадан өтүү тартиби\",\"intro\":\"Чек ара көзөмөлү — бул мамлекеттик чек араны мыйзамдуу кесип өтүүнү жана өлкөгө кирүү же чыгуунун укугун тастыктоону текшерүүчү жол-жобо. Бул процедура бардык эл аралык каттамдагы жүргүнчүлөр үчүн милдеттүү жана улуттук коопсуздукту камсыздоонун маанилүү этабы болуп саналат.\",\"section1\":\"«Манас-аэропорт» жана «Ош-аэропорт» өткөрмө пункттары Кыргыз Республикасынын Мамлекеттик чек ара кызматынын чек ара көзөмөлүнүн бөлүктөрүнүн бири болуп эсептелет жана өз ишмердүүлүгүндө Кыргыз Республикасынын Конституциясын, «Кыргыз Республикасынын мамлекеттик чек арасы жөнүндө» мыйзамын жана Кыргыз Республикасы катышуучу болуп саналган эл аралык келишимдерге ылайык күчүнө кирген башка ченемдик укуктук актыларды жетекчиликке алат.\",\"section2\":\"«Манас-аэропорт» жана «Ош-аэропорт» өткөрмө пункттарында мамлекеттик чек араны кайтаруу жана мамлекеттик чек ара аркылуу адамдарды, аба кемелерин, жүктөрдү жана башка мүлктү өткөрүп берүү жогоруда аталган өткөрмө пункттардан бөлүнгөн чек ара кезметтери тарабынан жүзөгө ашырылат. Белгилей кетүүчү нерсе, жайкы туристтик сезон учурунда «Манас-аэропорт» өткөрмө пунктунан «Ысык-Көл-аэропорт» өткөрмө пунктуна мамлекеттик чек араны кайтаруу жана адамдарды, аба кемелерин, жүктөрдү өткөрүү боюнча тапшырмаларды аткаруу үчүн чек ара кезметтери жөнөтүлөт.\",\"section3\":\"Аталган өткөрмө пункттардын жалпы иш тартиби — иш башталышы жана аякташы, мамлекеттик чек ара аркылуу өтүүчү адамдарды, аба кемелерин жана жүктөрдү текшерүү графиги (жүргүнчүлөрдү кабыл алуу/жөнөтүү графиги) мамлекеттик көзөмөлдөө органдарынын жетекчилери жана аэропорт директору тарабынан биргелешип бекитилет.\",\"preparationTitle\":\"Чек ара көзөмөлүнөн өтүүгө даярдык\",\"preparation\":{\"documentsTitle\":\"Керектүү документтер:\",\"documentsList\":[\"Жарандык паспорт же чет өлкөлүк паспорт.\",\"Виза (эгерде баруучу өлкө талап кылса).\",\"Керек болгон учурда кошумча документтер: чакыруу каты, туристтик ваучер, медициналык камсыздандыруу, мейманкана же турак жай брондолгондугу жана кайтар билети.\"],\"behaviorTitle\":\"Жүрүм-турум эрежелери:\",\"behaviorList\":[\"Сабырдуу жана сылык болуңуз.\",\"Чек ара кызматкерине жакындаганда баш кийимди жана күн көз айнегин чечиңиз.\",\"Текшерүү учурунда уюлдук телефондорду колдонбоңуз.\"]},\"stepProcessTitle\":\"Чек арадан өтүүнүн кадамдык тартиби\",\"docRequestTitle\":\"Кошумча документтер талап кылынышы мүмкүн болгон учурлар\",\"docRequestSubTitle1\":\"Маалыматтын жетишсиздиги\",\"docRequestSubTitle2\":\"Миграциялык эрежелерди бузууга шек саноо\",\"docRequestSubTitle3\":\"Өзгөчө категориядагы жүргүнчүлөр:\",\"additionalDocs\":{\"lackInfo\":[\"Жатакана же кайтар билет брондолбогон.\",\"Сапардын максаты так эмес.\"],\"suspicion\":[\"Жатакана же кайтар билет брондолбогон.\",\"Сапардын максаты так эмес.\"],\"specialCategories\":[\"Камкорчусуз жүргөн жашы жете элек балдар (уруксат талап кылынат).\",\"Соттун чечими менен чектелген адамдар.\"]},\"recommendations\":{\"name\":\"Өткөрмө пункттар\",\"content1\":\"Кыргыз Республикасынын мамлекеттик чек арасындагы өткөрмө пункттарда чек ара көзөмөлүн жүргүзүүдө негизги көңүл документтерди текшерүүгө жана аба кемелерин кароого бурулат. Документтерди текшерүүдө издөөдө жүргөн адамдар, эл аралык террордук уюмдарга тиешеси барлар жана жасалма же башка адамдардын документтери өзгөчө көңүлгө алынат. Аба кемелерин текшерүүдө — контрабанда, курал-жарак, ок-дарылар, баңги заттар жана жарылуучу заттарды жашыруун жерлерде, жүктүн алдында же ичинде алып өтүүнү аныктоо максатында жүргүзүлөт.\",\"content2\":\"Кыргыз Республикасынын мамлекеттик чек арасын кайтаруу жана коюлган тапшырмаларды аткаруу максатында «Манас-аэропорт», «Ош-аэропорт» жана «Ысык-Көл-аэропорт» өткөрмө пункттары заманбап паспорттук текшерүү кабиналары, автоматташтырылган чек ара көзөмөл системасы жана заманбап техникалык жабдуулар менен жабдылган.\",\"title\":\"Контролдон ийгиликтүү өтүү үчүн кеңештер:\",\"list\":[\"Бара турган өлкөнүн кирүү эрежелери менен алдын ала таанышыңыз.\",\"Паспорт жана визанын мөөнөтүн текшериңиз.\",\"Текшерүү үчүн бардык документтерди алдын ала даярдап коюңуз.\"],\"closing\":\"Сизге жагымдуу сапар жана ыңгайлуу уча турчу каттам каалайбыз!\"}},\"customControl\":{\"steps\":[{\"number\":1,\"title\":\"Коридорду тандоо\",\"details\":[\"Эгерде сизде декларациялоого тийиш буюмдар же акча жок болсо, 'жашыл коридор' аркылуу өтөсүз.\",\"Эгерде декларациялоого тийиш буюмдарыңыз бар болсо, 'кызыл коридор' аркылуу өтүп, декларация толтурууңуз керек.\"]},{\"number\":2,\"title\":\"Жүк жана кол жүктүн текшерүүсү\",\"details\":[\"Буюмдар рентген аппараты менен сканерленет.\",\"Керек болсо, кол менен текшерүү жүргүзүлүшү мүмкүн.\",\"Бажы кызматкери товарлардын келип чыгышы жана ырастоочу документтер жөнүндө маалымат сурай алат.\"]},{\"number\":3,\"title\":\"Чек ара көзөмөлүнүн кабинкасына жакындоо\",\"description\":\"Паспортуңузду жана башка керектүү документтерди чек ара кызматкерине текшерүү үчүн тапшырыңыз.\"},{\"number\":4,\"title\":\"Жеке буюмдарды текшерүү\",\"details\":[\"Атайын көңүл басылат: баалуу металлдар, таштар, маданий баалуулуктар жана чоң суммадагы накта акчалар.\"]}],\"documentReasons\":[\"Тыйу салынган товарларды алып өтүүгө аракет кылуу\",\"Чоң суммадагы акчаны же баалуу буюмдарды декларациялоодон баш тартуу\",\"Бажы кызматкеринин талаптарын аткарбоо\"],\"title\":\"Бажы көзөмөлүнөн өтүү тартиби\",\"intro\":\"Бажы көзөмөлү өлкөнүн чек арасы аркылуу товарлардын, акчанын жана баалуу буюмдардын жашыруун алып өтүлүшүнөн сактоо үчүн жүргүзүлөт. Ал ошондой эле бажы мыйзамдарын сактоону камсыз кылат жана мамлекеттин экономикалык жана коомдук кызыкчылыктарын коргойт.\",\"section1\":\"Республиканын экономикалык кызыкчылыктарын коргоо жана анын бажы саясатын ишке ашыруу максатында «Манас» эл аралык аэропортунда «Манас» бажысы жана «Ош» эл аралык аэропортунда «Ош» бажы процесстеринин борбору иштейт, алар түздөн-түз Кыргыз Республикасынын Өкмөтүнө караштуу Мамлекеттик бажы кызматына баш ийет.\",\"section2\":\"Белгиленген милдеттерди аткаруу үчүн бажы заманбап рентгенттелевизиондук текшерүү техникасы жана бажы көзөмөлүнүн техникалык каражаттары менен жабдылган, бул тыюу салынган товарлардын жашыруун алып өтүлүшүн аныктоого жана алдын алууга мүмкүндүк берет.\",\"section3Title\":\"Негизги милдеттердин бири - бул Кыргызстандын экономикалык кызыкчылыктарын коргоо, өлкөнүн бюджетиндин кирешелүү бөлүгүн түзүү боюнча тапшырманы аткаруу, ошондой эле:\",\"section3\":\"- Кыргыз Республикасынын бажы иши жөнүндөгү мыйзамдарын сактоону камсыз кылуу;\\n- Кыргыз Республикасынын экономикалык кызыкчылыктарын коргоо, өз компетенциясы чектеринде Кыргыз Республикасынын экономикалык коопсуздугун камсыз кылуу;\\n- мамлекеттик коопсуздукту, жарандардын ден соолугун жана жашоосун, жаныбарларды жана өсүмдүктөрдү коргоо, теңдикти коргоо жана товарларды Кыргыз Республикасынын аймагына алып келгенде жергиликтүү потребилдердин кызыкчылыктарын коргоо боюнча чараларды ишке ашырууга жардам берүү.\",\"section4Title\":\"Бажы өзүнө жүктөлгөн милдеттерге ылайык төмөнкү функцияларды аткарат:\",\"section4\":\"- бажы иши жөнүндөгү мыйзамдарды сактоону көзөмөлдөйт;\\n- өткөөл пункттарында, бажы өткөөл пункттарында жана башка жерлерде товарлардын жана унаалардын бажы көзөмөлүн жана бажы өткөөлүн уюштурат жана жүзөгө ашырат;\\n- бажы төлөмдөрүнүн толук жана өз убагында төлөнүшүн көзөмөлдөйт;\\n- бажы бузуулардын алдын алат;\\n- кызыкдар тараптарга бажы маселелери боюнча маалымат берет жана кеңеш берет;\\n- жарандардын арыздарын жана кайрылууларын өз убагында жана толук карап чыгат;\\n- мыйзамдар менен аныкталган башка функцияларды аткарат.\",\"preparationTitle\":\"Бажы көзөмөлүнөн өтүүгө даярдоо\",\"preparation\":{\"documentsTitle\":\"Документтер:\",\"documentsList\":[\"Паспорт жана посадочный талон.\",\"Бажы декларациясы (керек болсо толтурулат).\",\"Баалуу буюмдардын наркын жана мыйзамдуулугун ырастоочу документтер (керек болсо).\"],\"lanesTitle\":\"Коридорду тандоо\",\"greenLane\":\"'Жашыл коридор' - декларациялоого тийиш товарлары же акчасы жок жүргүнчүлөр үчүн.\",\"redLane\":\"'Кызыл коридор' - товарларды, акчаны декларациялагандар же тыюу салынган же чектелген буюмдарды алып жүргөндөр үчүн.\"},\"stepProcessTitle\":\"Бажы көзөмөлүнөн өтүүнүн кадамдары\",\"declarationRulesTitle\":\"Акча жана баалуу буюмдарды декларациялоо эрежелери\",\"currencyDeclaration\":\"Акчаны декларациялоо\",\"currencyDeclarationList\":[\"Көпчүлүк өлкөлөрдө белгиленген чектен ашкан суммаларды декларациялоо керек (адатта $10,000 эквиваленти).\",\"Бардык накта акчаны, трэвел чектерди жана чет элдик валютаны декларациялоону унутпаңыз.\"],\"valuablesDeclaration\":\"Баалуу буюмдар\",\"valuablesDeclarationList\":[\"Алтын, алмаз жана башка баалуу металлдар менен таштар белгиленген чектен ашкан учурда декларацияланышы керек.\",\"Чет өлкөдө сатып алынган зер буюмдарды ташууда, алардын сатып алынышы жана наркы жөнүндө документтер талап кылынышы мүмкүн.\"],\"specialGoodsDeclaration\":\"Атайын товарлар\",\"specialGoodsDeclarationList\":[\"Маданий баалуулуктар (сүрөттөр, антиквардык буюмдар) экспорттоо же импорттоо үчүн уруксат документтерин талап кылат.\",\"Кээ бир куралдардын түрлөрү, жарылуучу заттар жана эки максаттуу товарлар алып өтүүгө тыюу салынат же чектелген.\"],\"denialReasonsTitle\":\"Бажы көзөмөлүнөн өтүүгө тыюу салуунун себептери\",\"recommendationsTitle\":\"Ийгиликтүү көзөмөлдөн өтүү үчүн сунуштар:\",\"recommendationsList\":[\"Жөнөтүү жана баргыңыз келген өлкөнүн бажы эрежелери менен алдын ала таанышыңыз.\",\"Акчаны жана баалуу буюмдарды чынчылдык менен декларациялаңыз.\",\"Кымбат буюмдардын жана маданий баалуулуктардын сатып алынышы жөнүндө документтерди сактаңыз.\",\"Бажы кызматкерлеринин эрежелерин жана көрсөтмөлөрүн сактаңыз.\"],\"closing\":\"Бажы көзөмөлүнөн өтүү - бардык эрежелерди жана мыйзамдарды сактаганда жөнөкөй процедура. Сизге жеңил жана тоскоолсуз саякат каалайбыз!\",\"imageAlt1\":\"Бажы көзөмөлү\",\"imageAlt2\":\"Стюардесса\",\"imageAlt3\":\"Бажы көзөмөлү\"},\"luggage\":{\"title\":\"Жүргүнчүнүн багажы\",\"basicsTitle\":\"Негизги\",\"mainRequirements\":{\"title\":\"Негизги талаптар\",\"description\":\"Жүргүнчү ташыган бардык багаж, кабинадагы багаж дагы, учуу коопсуздугун камсыз кылуу талабынан улам рейске катталуу убагында көрсөтүлүшү керек. Авиакомпания өз жоопкерчилиги менен ташууга кабыл алган багаж багаж биркасы менен белгиленет жана самолёттун багаж бөлүгүндө ташылат.\",\"list\":[\"Багаждын параметрлери авиакомпаниянын саясатына жана классына жараша болот.\",\"Катталган багаж үчүн көбүнчө үч өлчөмдүн жалпы суммасы (узундук + тууралык + бийиктик) 158 смден ашпоосу жана салмагы 20-23 кгдан ашпоосу керек.\",\"Кол багаж көбүнчө 55 x 40 x 20 см өлчөмдөрүн жана 5-10 кг салмагын ашпоосу керек.\"]},\"freeAllowance\":{\"title\":\"Акысыз багаж ташуу нормалары\",\"systemsTitle\":\"Багаж ташуу системасы\",\"systemsList\":[\"Салмак системасы (weight concept) (авиабилетти сатып алганда тактоо керек)\",\"Бирдиктер системасы (piece concept) (авиабилетти сатып алганда тактоо керек)\"],\"adultsChildrenTitle\":\"Чоңдор жана балдар үчүн\",\"adultsChildrenList\":[\"Биринчи класс - 40 кг\",\"Бизнес класс - 30 кг\",\"Эконом класс - 20 кг\",\"2 жашка чейинки балдар үчүн (өзүнчө орунсуз) акысыз багаж нормасы 10 кг.\"]},\"luggageContent\":{\"title\":\"Багаждын курамы\",\"description\":\"\u003cstrong\u003eБаалуу буюмдар:\u003c/strong\u003e документтер, акча, зер буюмдар, ноутбуктар жана башка электрондук түзмөктөр кол багажда ташууга ылайыктуу.\u003cbr /\u003e\u003cbr /\u003eБардык классдагы жүргүнчүлөргө \u003cstrong\u003eуруксат берилет\u003c/strong\u003e кабинага 10 кгга чейин катталбаган багаж алып кирүүгө, ал акысыз багажга кирет (авиабилетти сатып алганда тактоо керек). Анын үч өлчөмүнүн жалпы суммасы 115 смден ашпоосу керек.\u003cbr /\u003eНормадан \u003cstrong\u003eашык багаж\u003c/strong\u003e үчүн төлөм авиакомпаниянын кассасында төлөө убагында жүргүнчүгө берилген багаж төлөм квитанциясын түзүү күнүндө колдонулуучу багаж тарифтерине ылайык жүргүзүлөт.\",\"allowedItemsTitle\":\"Уруксат берилген, бирок чектелген буюмдар\",\"allowedItemsList\":[\"Кол багаждагы суюктуктар, гелдер жана аэрозолдор ар бири 100 млден ашпаган контейнерлерде болушу керек, жалпы көлөмү 1 литрден ашпоосу керек.\",\"Спорттук жабдыктар жана музыкалык аспаптар атайын же чоң өлчөмдүү багаж катары уруксат берилет.\"],\"prohibitedItemsTitle\":\"Ташылууга тыюу салынган буюмдар\",\"prohibitedItemsList\":[\"Ок-дарылар, куралдар жана жарылуучу заттар.\",\"Жегич суюктуктар жана уулуу заттар.\",\"Химиялык заттар жана коррозиялык материалдар.\"]},\"packing\":{\"title\":\"Багаждын таңгакталышы\",\"description\":{\"p1\":\"Урматтуу саякатчылар!\",\"p2\":\"Сиздерге кубаныч менен маалымдайбыз: 2025-жылдын 1-июлунда Бишкек шаарындагы Эл аралык “Манас” аэропортунда жүктү таңгактоо боюнча 3 пункт ачтык.\",\"p3\":\"Бул жерден сиз жүгүңүздү биздин фирмалык пленкага таңгактап гана тим болбостон, жүктү коргоо кызматынан пайдаланып, ошондой эле сапар учурунда керектүү аксессуарларды сатып ала аласыз.\",\"p4\":\"Сиздерди Эл аралык “Манас” аэропортундагы биздин стойкаларда чыдамсыздык менен күтөбүз!\",\"p5\":\"Сапарыңыздар ийгиликтүү жана жагымдуу болсун!\",\"contacts\":\"Байланыш үчүн:\",\"phone\":\"0703 18 84 88\",\"emailLabel\":\"Email:\"}},\"marking\":{\"title\":\"Белгилөө жана аныктоо\",\"list\":[\"Багажга атыңыз, телефон номериңиз жана электрондук дарегиңиз жазылган жаркырак биркаларды тагыңыз.\",\"Багажды тез таанып билүү үчүн өзгөчө дизайндагы чехолдор же наклейкаларды колдонуңуз.\"]},\"oversizedLuggage\":{\"title\":\"Чоң өлчөмдүү багажды иштетүү өзгөчөлүктөрү\",\"categoriesTitle\":\"Чоң өлчөмдүү багаждын категориялары\",\"categoriesList\":[\"Спорттук жабдыктар (лыжалар, велосипеддер, сноубордтор).\",\"Чоң өлчөмдүү музыкалык аспаптар.\",\"Балдар арабалары, майыптар арбалары.\"]},\"oversizedLuggageSteps\":[{\"number\":1,\"description\":\"Чоң өлчөмдүү багаж жөнүндө авиакомпанияга алдын ала кабарлаңыз.\"},{\"number\":2,\"description\":\"Чоң өлчөмдүү багаж үчүн атайын бөлүнгөн аймакта катталыңыз.\"},{\"number\":3,\"description\":\"Биркалардын туура жазылышына жана кошумча коргоочу таңгакка көз салыңыз.\"}],\"lostLuggage\":{\"title\":\"Багаж жоголгон же бузулган учурда иш-аракеттер\",\"lostAndFoundTitle\":\"Lost and Found кызматы:\",\"lostAndFoundList\":[\"Багаж алуу аймагында же чыгуулардын жанында жайгашкан.\",\"Жоголгон багажды издөөгө жана компенсация үчүн документтерди түзүүгө жардам берет.\"],\"algorithmTitle\":\"Иш-аракеттер алгоритми\"},\"lostLuggageSteps\":[{\"number\":1,\"description\":\"Кызмат кызматкерлерине кайрылып, багаж жоголгон же бузулган жөнүндө кат жазыңыз.\"},{\"number\":2,\"description\":\"Документтерди тапшырыңыз: посадочный талон жана багаж квитанциясы.\"},{\"number\":3,\"description\":\"Арызды далилдөө үчүн багаждын бузулушу же абалын сүрөткө тартыңыз.\"},{\"number\":4,\"description\":\"Багаж жоголгон учурда, авиакомпания аны издөөнү уюштурууга жана 21 күн ичинде табылбаса компенсация төлөөгө милдеттүү.\"}],\"compensation\":{\"title\":\"Компенсация\",\"list\":[\"Эл аралык стандарттарга (Монреал конвенциясы) ылайык, жоголгон багаж үчүн максималдуу компенсация 1 131 SDR (Атайын тартуу укуктары) чейин болушу мүмкүн.\",\"Кыргызстандын аэропортторунда жоголгон багаж үчүн компенсация өлкө кол койгон эл аралык келишимдер жана авиакомпаниялардын ички эрежелери менен жөнгө салынат. Жоголгон багаж үчүн компенсацияны жөнгө салуучу негизги документ - 1999-жылкы Эл аралык жарандык авиация конвенциясы (Монреал конвенциясы), ал компенсациянын шарттарын жана өлчөмүн аныктайт.\"],\"montrealConventionTitle\":\"Монреал конвенциясы боюнча компенсация:\",\"maxAmountTitle\":\"Компенсациянын максималдуу өлчөмү\",\"maxAmountList\":[\"Жоголгон багаж үчүн компенсация 1 131 SDR (Атайын тартуу укуктары) чейин болушу мүмкүн. 2025-жылдын январь айына карата бул курсту эске алуу менен болжол менен 1 500-1 600 АКШ долларына барабар.\"],\"paymentProcedureTitle\":\"Төлөө тартиби\",\"paymentProcedureList\":[\"Авиакомпания компенсацияны 21 күн ичинде төлөөгө милдеттүү, эгер багаж ушул убакыт ичинде табылбаса.\",\"Эгер жүргүнчү багажды таңгактоо эрежелерин бузган же тыюу салынган буюмдарды ташыткан болсо, компенсация азайтылышы мүмкүн.\"],\"howToGetTitle\":\"Жоголгон багаж үчүн компенсацияны кантип алууга болот?\",\"applicationTitle\":\"Арыз\",\"applicationList\":[\"Жүргүнчү жоготууну байкагандан кийин дароо аэропорттогу Lost and Found кызматына (жоголгон жана табылган буюмдар кызматы) арыз берүүгө тийиш.\"],\"documentsTitle\":\"Документтер\",\"documentsList\":[\"Багаж жоголгонун ырастоо үчүн посадочный талон, багаж квитанциясы жана башка документтерди тапшыруу керек.\"],\"damageAssessmentTitle\":\"Зыянды баалоо\",\"damageAssessmentList\":[\"Эгер багаж 21 күн ичинде табылбаса, авиакомпания зыянды баалап, белгиленген эрежелер боюнча компенсация төлөйт.\"],\"delayOrReductionTitle\":\"Компенсацияны кечиктирүү же азайтуу:\",\"delayOrReductionList\":[\"Кээ бир учурларда компенсация жарым-жартылай болушу мүмкүн, эгер жүргүнчү таңгактоо эрежелерин бузган, тыюу салынган буюмдарды ташыткан же белгиленген мөөнөттө авиакомпанияга кабарлаган эмес болсо.\"],\"disclaimer\":\"Эгер жүргүнчү компенсациянын өлчөмүнө макул болбосо, арыз берүүгө же сотко кайрылууга укуктуу.\"},\"importantInfo\":{\"title\":\"Маанилүү маалымат\",\"list\":[\"2 жашка чейинки балдардан башка бардык жүргүнчүлөр авиакомпаниялар белгилеген тейлөө стандарттарына ылайык акысыз багаж ташууга укуктуу.\",\"Өзүнчө орундарга билет алган балдар чоңдор сыяктуу эле кол багаж жана катталган багаж ташыша алышат.\",\"Акысыз багаж ташуу нормасы самолёттун түрүнө, учуу багытына жана классына жараша болот. Рейсиңизди аткаруучу авиакомпаниялардын вебсайттарынан кол багаж эрежелерин тактап көрүүнү сунуштайбыз.\",\"Акысыз нормага бир катар буюмдар кирбейт: музыкалык аспаптар (алар кабинада өзүнчө билет менен ташылат) жана жаныбарлар. Мындай нормадан ашык багаж башка багаж жана кол багаждан көз карандысыз тарифтерди колдонуу эрежелери боюнча төлөнөт.\",\"Багаждын өлчөмдөрүнө колтуктар жана дөңгөлөктөр дагы кирет.\",\"Катталбаган буюмдар үчүн жоопкерчилик жүргүнчүнүн өзүнө таандык.\",\"Жүргүнчүгө катталган багаж ташууга кабыл алынгандыгынын далили катары багаж биркасы берилет.\",\"Ташуучу туура таңгакталбаган же салмагы, өлчөмү же келип чыгышы боюнча аба ташуусуна жараксыз багажды ташуудан баш тарта алат.\",\"Салмагына, өлчөмүнө же келип чыгышына жараша катталган багаждын кээ бир категориялары ташуучу менен алдын ала макулдашуу шарты менен гана кабыл алынышы мүмкүн (мисалы: литий батареялар менен иштөөчү майыптар арбалары жана башка жардамчы каражаттар, жаныбарлар, чоң өлчөмдүү багаж ж.б.)\",\"Багаж учуу убагында ачылып кетпеши үчүн бекем бекитилиши керек.\",\"Багаж биркасынын үзүндүсүнүн номерин чемодандагы бирканын номери менен келишүүсүн текшерүүнү сунуштайбыз.\"]},\"recommendations\":{\"title\":\"Багажды коопсуз ташуу боюнча сунуштар\",\"beforeFlightTitle\":\"Учууга чейин\",\"beforeFlightList\":[\"Тыюу салынган буюмдардын тизмесин текшерип, авиакомпаниядан таңгактоо эрежелерин тактап алыңыз.\",\"Жоголуу учур үчүн багаждын курамынын тизмесин даярдаңыз.\",\"Чемодандыңызды жөнөтүүдөн мурун сүрөткө тартыңыз.\"],\"atAirportTitle\":\"Аэропортто\",\"atAirportList\":[\"Эрте келип, багажды каттап, абага чыгуу контролун абалабастан өтүңүз.\",\"Багаждын туура белгиленгенин жана багаж квитанциясынын сакталып калганын текшериңиз.\"],\"afterArrivalTitle\":\"Келип жеткенден кийин\",\"afterArrivalList\":[\"Багажды бузулуш же ачылып калгандыгы үчүн текшериңиз.\",\"Кандайдыр бир көйгөйлөр жөнүндө Lost and Found кызматына дароо кабарлаңыз.\"],\"additionalMeasuresTitle\":\"Кошумча чаралар\",\"additionalMeasuresList\":[\"Баалуу буюмдарды ташарда багажды камсыздандырууну карап көрүңүз.\",\"Керек болсо, багажды кошумча коргоо үчүн пленкага ороп берүү кызматын пайдаланыңыз.\"],\"closing\":\"Бул сунуштарды аткаруу багаж менен көйгөйсүз ыңгайлуу жана коопсуз саякатты камсыз кылат.\"},\"imageAlt1\":\"Багаж\",\"imageAlt2\":\"Багаж\",\"imageAlt3\":\"Самолёт\",\"imageAlt4\":\"LostAndFound\",\"imageAlt5\":\"Аял\"},\"peopleDisabilities\":{\"title\":\"Кыргызстандын аэропортторунда майыптарга кызмат көрсөтүүлөр\",\"rampsAndElevators\":{\"title\":\"Пандустар жана лифттер\",\"list\":[\"Аэропорттун бардык негизги бөлүктөрүндө майыптар үчүн пандустар орнотулган, ошондой эле ар кайсы аймактарга (мисалы, терминалдарга, чыгууларга жана дааратканаларга) кирүү үчүн лифттер бар.\",\"Майыптарды самолётко отургузуу/чыгаруу үчүн амбулифт.\",\"Кен эшиктер жана коридорлор: Майып арбалары же башка кыймылдануу каражаттарын колдонгон жүргүнчүлөрдүн ыңгайлуу кыймылы үчүн аэропортто кен эшиктер жана коридорлор бар.\",\"Майыптар арбалары.\"]},\"specialRestrooms\":{\"title\":\"Атайын дааратканалар\",\"list\":[\"Аэропорттордо майыптар үчүн атайын дааратканалар бар, аларда кошумча кармалуучу түтүктөр жана майып арбалары үчүн кыймылдоо мейкиндиги камтылган.\"]},\"restAreas\":{\"title\":\"Эс алуу жана күтүү аянтчалары\",\"list\":[\"Аэропорттордо майыптар үчүн ыңгайлаштырылган эс алуу аянтчалары бар, алар ыңгайлуу отургучтарды жана кирүү мүмкүнчүлүктөрүн камсыздайт.\",\"Атайын парковка орундары С парковка зонасынын чыгыш тарабында жайгашкан - бул аэровокзал комплексине эң жакын парковка аймагы.\"]},\"instructionsTitle\":\"Майып жүргүнчүлөр үчүн көрсөтмөлөр\",\"steps\":[{\"number\":1,\"title\":\"Алдын ала кабарлоо\",\"details\":[\"Майып жүргүнчүлөр же чектелген кыймыл мүмкүнчүлүгү бар адамдар атайын жардам керек экендигин авиакомпанияга алдын ала билдириши керек. Бул билетди брондоо убагында же рейске бир нече саат калганда жасалышы мүмкүн, авиакомпания зарыл жардамды даярдап коюш үчүн.\"]},{\"number\":2,\"title\":\"Аэропортко эрте келиш\",\"details\":[\"Майып жүргүнчүлөргө рейске чыгуудан бир нече саат мурун аэропортко келип жетиши сунушталат, каттоо, коопсуздук текшерүүсү жана самолётко отуруу сыяктуу бардык процедураларга убакыт жетүү үчүн. Адатта, рейске чыгуудан кеминде 2-3 саат мурун келүү сунушталат.\"]},{\"number\":3,\"title\":\"Кызматкерлердин жардамы\",\"details\":[\"Кызматкерлердин жардамы аэропортто кыймылдоодон баштап, самолётко отурууга же андан түшүүгө чейинки бардык этаптарда керек болушу мүмкүн. Бул кызматтан пайдалануу үчүн дагы авиакомпанияга алдын ала кабарлоо керек.\"]},{\"number\":4,\"title\":\"Майып арбаларын колдонуу\",\"details\":[\"Эгер жүргүнчү өз алдынча кыймылдай албаса, аэропорттор аэропорт аймагында кыймылдоо үчүн акысыз майып арбаларын берет. Эгер жүргүнчү өзүнүн майып арбасы менен саякаттаса, ал самолёттун жүк бөлүгүнө коопсуз орнотулат.\"]},{\"number\":5,\"title\":\"Атайын түзүлүштөр менен отургузуу жана түшүрүү\",\"details\":[\"Майып жүргүнчүлөрдү отургузуу жана түшүрүү үчүн атайын көтөргүчтөр же платформалар колдонулушу мүмкүн, алар арбадан самолётко жана тескерисинче оңой өтүүгө мүмкүнчүлүк берет.\"]}],\"behaviorRulesTitle\":\"Майып жүргүнчүлөр үчүн жүрүм-турум эрежелери\",\"orderRules\":{\"title\":\"Тартипти сактоо\",\"list\":[\"Майып жүргүнчүлөр коопсуздуктун жалпы эрежелерин сакташы керек, мисалы, коопсуздук карагынын талаптары, зарыл болгон учурда коопсуздук боюнча инструктажда катышуу, ошондой эле аэропорт кызматкерлеринин жана экипажтын көрсөтмөлөрүн аткаруу.\"]},\"assistanceRules\":{\"title\":\"Кызматкерлердин жардамы\",\"list\":[\"Аэропортто болгон убакытта же самолётко отуруу/түшүү процессинде майып жүргүнчүлөр зарыл болгон учурда кызматкерлердин жардамынан пайдалана алышат. Бул жардамды керек экендигин кызматкерлерге алдын ала билдирүү маанилүү.\"]},\"mobilityRules\":{\"title\":\"Коопсуздук аймагында кыймылдоо\",\"list\":[\"Майып жүргүнчүлөр коопсуздук кызматынын кызматкерлерине өздөрүнүн чектелген кыймыл мүмкүнчүлүгү жөнүндө билдириши керек. Бул коопсуздук текшерүүсүнүн процессин тездетет, ошондой эле ушул категориядагы жүргүнчүлөр үчүн атайын бөлүнгөн өткөөлдөрдү колдонууга мүмкүнчүлүк берет.\"]},\"recommendations\":{\"description\":\"Кыргызстандын аэропорттору майыптар үчүн максималдуу ыңгайлуулукту жана кирүү мүмкүнчүлүгүн камсыз кылууга аракеттенишет, жардам кызматтарын, кирүүгө ыңгайлаштырылган инфраструктураны жана коопсуз жана ыңгайлуу саякат үчүн жабдууларды сунушташат. Атайын жардам керек экендигин алдын ала билдирүү жана сунуштарды аткаруу саякатыңызды мүмкүн болушунча ыңгайлуу кылуу үчүн маанилүү.\",\"attention\":\"Көңүл: Билетди брондоо жана сатып алуу убагында аэропортто жана учуу убагында кандай атайын кызматтар жана жардам керек экендигин билдириңиз. Бул кызматтардын керек экендиги авиакомпанияга же билет сатуучуга билетди заказ кылганда билдирилиши керек, бирок рейске чыгуудан кеминде 48 саат калганга чейин.\",\"callText\":\"Кайсы саатта болбосун чалыңыз\",\"phoneNumber\":\"+996 312 / 69 31 09\"},\"imageAlt1\":\"Пандус\",\"imageAlt2\":\"Майып адамдар\",\"imageAlt3\":\"Адамдар\"},\"transportationAnimals\":{\"title\":\"Кыргызстандын аэропортторунда жаныбарларды ташуу эрежелери\",\"transportTypes\":{\"title\":\"Жаныбарларды ташуунун түрлөрү\",\"inCabin\":{\"title\":\"Учактын салонунда\",\"list\":[\"Музоо сыяктуу кичинекей үй жаныбарлары – мышыктар, иттер, тоту куштар – эгер алардын салмагы (контейнери менен кошо) авиакомпания белгилеген лимиттен ашпаса (көбүнчө 8–10 кг чейин), ээсинин жанында салондо ташылышы мүмкүн.\"]},\"inBaggage\":{\"title\":\"Жүк бөлүмүндө\",\"list\":[\"Ири жаныбарлар же салонго батпаган жаныбарлар адатта учактын жүк бөлүгүндө ташылат. Алар атайын бекитилген жана коопсуздук талаптарына жооп берген контейнерде болушу керек.\"]}},\"transportConditions\":{\"title\":\"Ташуу шарттары\",\"container\":{\"title\":\"Контейнер же клетка\",\"list\":[\"Жаныбарлар IATA (Эл аралык аба транспорту ассоциациясы) стандарттарына жооп берген атайын контейнерде же клеткада болушу керек. Контейнер бекем, жакшы желдетилген жана жаныбардын өлчөмүнө ылайык болууга тийиш. Жаныбар туруп, жатып, айланып кете ала турган мүмкүнчүлүккө ээ болушу зарыл.\"]},\"packaging\":{\"title\":\"Ташууга арналган таңгак\",\"list\":[\"Контейнер бекем жабылуучу эшик системасы менен жабдылышы керек, герметикалы болушу жана жаныбарга зыян келтире турган кемчиликтери болбошу керек.\"]}},\"safetyRequirements\":{\"title\":\"Коопсуздук талаптары\",\"windows\":{\"title\":\"Контейнердин терезелери бекем болушу керек\",\"list\":[\"Контейнердин терезелери жана торчолору бекем жана жаныбар контейнерди бузуп коё албай тургандай болушу зарыл.\"]},\"markers\":{\"title\":\"Белгилөөчү стикерлер\",\"list\":[\"Контейнерде ээси тууралуу маалымат жана анын ичинде жаныбар бар экендигин көрсөткөн белгилер болушу керек.\"]}},\"transportRestrictions\":{\"title\":\"Жаныбарларды ташууда чектөөлөр\",\"list\":[\"Айрым авиакомпаниялар белгилүү жаныбар түрлөрүн (мисалы, экзотикалык же кооптуу жаныбарлар) ташууга уруксат бербеши мүмкүн же кошумча чектөөлөрдү киргизиши мүмкүн.\",\"Ошондой эле бир каттамда ташыла турган жаныбарлардын санына чектөө болушу мүмкүн, ошондуктан алдын ала авиакомпаниядан тактоо сунушталат.\"]},\"requiredDocuments\":{\"title\":\"Жаныбарларды ташуу үчүн талап кылынган документтер\",\"animalPassport\":{\"title\":\"Жаныбардын паспорту\",\"list\":[\"Эл аралык каттамдар үчүн жаныбардын паспорту болушу керек. Ал ветеринардык клиникада толтурулат жана анда кутурма сыяктуу ооруларга каршы эмдөөлөр тууралуу маалымат камтылышы керек.\",\"Чет мамлекетке чыгууда жаныбардын эл аралык ветеринардык сертификаты болушу зарыл. Ал жаныбардын адамга коркунуч жараткан ооруларга чалдыкпаганын ырастайт.\"]},\"vetCertificate\":{\"title\":\"Ветеринардык сертификат\",\"list\":[\"Эл аралык ташуу үчүн мамлекеттик ветеринардык кызмат тарабынан берилген ветеринардык сертификат талап кылынат.\",\"Ички каттамдар үчүн бул документ ар дайым талап кылынбайт, бирок айрым авиакомпаниялар кошумча документтерди сурашы мүмкүн.\"]},\"quarantineDocs\":{\"title\":\"Карантин боюнча документтер\",\"list\":[\"Айрым өлкөлөргө жаныбарды киргизүү үчүн кошумча карантин документтери талап кылынат (айрыкча экзотикалык жаныбарлар үчүн).\"]},\"vaccinations\":{\"title\":\"Эмдөөлөр\",\"list\":[\"Жаныбар кутурма жана башка ооруларга каршы эмделген болушу керек. Эмдөөлөр сапарга чыгууга чейин 21 күндөн кеч эмес жүргүзүлүшү зарыл.\"]},\"otherDocs\":{\"title\":\"Башка документтер\",\"list\":[\"Айрым өлкөлөр үчүн кошумча медициналык справкалар, инфекциялык оорулар жок экенин ырастаган документтер талап кылынат.\"]}},\"whereToGetDocs\":{\"title\":\"Документтерди кайдан алууга болот\",\"passport\":{\"title\":\"Ветеринардык паспорт жана сертификат\",\"list\":[\"Эл аралык ташуу үчүн керектүү эмдөөлөр жана ветеринардык сертификаттар мамлекеттик ветеринардык кызматта же лицензиясы бар ветеринардык клиникаларда берилет.\"]},\"healthCertificate\":{\"title\":\"Эл аралык саламаттык сертификаты\",\"list\":[\"Мамлекеттик же эл аралык лицензиясы бар ветеринардык мекемелерден алуу мүмкүн.\"]}},\"transportRules\":{\"title\":\"Ташуу эрежелери\",\"rule1\":{\"list\":[\"Жаныбарлар жана канаттуулар авиакомпания менен алдын ала макулдашуу менен гана аба аркылуу ташылат жана жүк бөлүгүндө жайгаштырылат.\",\"Брондоо маалында жүргүнчү ташыла турган жаныбарлар жана канаттуулар тууралуу маалымат бериши керек.\",\"Ташуу маалында жүргүнчү тиешелүү мамлекеттик мекеме тарабынан берилген ветеринардык сертификатты жана керектүү документтерди көрсөтүшү керек.\"]},\"rule2\":{\"list\":[\"Жаныбарлар жана канаттуулар ташууга кабыл алынышы үчүн, жүргүнчү/жүк жөнөтүүчү ташуунун бардык кесепеттерине жоопкерчиликти өзүнө алууга тийиш.\",\"Үй жаныбарлары (канаттуулар) бекем, аба кире турган, жабылышы ишенимдүү контейнерде ташылышы керек. Контейнердин түбү суу өткөрбөс, тыгыз жана соргуч материал менен жабдылган болушу шарт. Канаттуулар үчүн клетка кара түстөгү тыгыз кездеме менен жабылышы керек.\"]}},\"recommendations\":{\"title\":\"Жаныбарлар менен саякаттоочу жүргүнчүлөргө сунуштар\",\"notification\":{\"title\":\"Алдын ала билдирүү\",\"list\":[\"Билетти брондоо учурунда же алдын ала авиакомпанияга жаныбар менен бараарыңызды билдирүү сунушталат. Бул каттамда жаныбарлар үчүн орун бар эк
