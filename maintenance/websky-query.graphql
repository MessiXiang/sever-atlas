
	query FullFlightsSchedule($parameters: [FlightsScheduleParameters]!, $period: Period, $groupEqualFlights: Boolean) {
		FullFlightsSchedule(parameters: $parameters, period: $period, groupEqualFlights: $groupEqualFlights) {
			...FullFlightsSchedule
		}
	}
	
	fragment AircraftInfoParameter on TitleValueParameter {
		title
		value
	}


	fragment Duration on Duration {
		days
		hours
		minutes
		seconds
	}


	fragment Airport on Airport {
		id
		name
		title
		iata
		latitude
		longitude
		city {
			name
			images {
				panorama {
					url
				}
			}
		}
		country {
			id
			codeISO
			name
		}
		images {
			panorama {
				url
			}
		}
	}


	fragment ScheduleSegmentStop on SegmentStop {
		airport {
			id
		}
		duration {
			...Duration
		}
	}
	

	fragment FlightStaticInfo on FlightStaticInfo {
		statistics {
			title
			value
		}
		amenities {
			type
			description
			available
		}
		markers {
			charter
			eco
		}
	}


	fragment ScheduleResultSegmentSearchParameter on ScheduleResultSegmentSearchParameter {
		departure {
			...Airport
		}
		arrival {
			...Airport
		}
	}
	

	fragment ScheduleResultSegment on ScheduleResultSegment {
		id
		flightNumber
		operatingAirline {
			id
		}
		marketingAirline {
			id
		}
		departure {
			...ScheduleResultPoint
		}
		arrival {
			...ScheduleResultPoint
		}
		duration {
			...Duration
		}
		stops {
			...ScheduleSegmentStop
		}
		datesData {
			date
		}
		flightInfo {
			...FlightStaticInfo
		}
		aircraft {
			id
		}
		flightProbability
		scheduleStartDate
		scheduleEndDate
		weekdays
		aircrafts {
			id
		}
	}
	

	fragment FullFlightsSchedule on FullFlightsScheduleResponse {
		airports {
			...Airport
		}
		airlines {
			...Airline
		}
		aircrafts {
			...ScheduleAircraft
		}
		searchParameters {
			...FullFlightsParameters
		}
		flightDirections {
			legs {
				...ScheduleFlightDirectionsLegs
			}
		}
	}
	

	fragment ScheduleResultPoint on ScheduleResultPoint {
		airport {
			id
		}
		terminal
		time
	}


	fragment AircraftInfoCabin on CabinInfo {
		title
		image
		parameters {
			...AircraftInfoParameter
		}
	}
	

	fragment FullFlightsParameters on ScheduleResultSearchParameters {
		segments {
			...ScheduleResultSegmentSearchParameter
		}
	}
	

	fragment ScheduleAircraft on Aircraft {
		id
		title
		name
		icon
		iconRt
		images
		scheme
		cabins {
			...AircraftInfoCabin
		}
		parameters {
			title
			value
			type
		}
		description
	}
	

	fragment ScheduleFlightDirectionsLegs on ScheduleResultLeg {
		segments {
			segment {
				...ScheduleResultSegment
			}
			transferDuration {
				...Duration
			}
		}
		weekdays
	}
	

	fragment Airline on IAirline {
		id
		iata
		name
		logo {
			url
		}
		icon
	}
